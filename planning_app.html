      for (var q = 1; q < mins.length; q++) { if (mins[q] < mn) mn = mins[q]; if (maxs[q] > mx) mx = maxs[q]; }
      return { min: mn, max: mx };
    }
    var r0 = walk(expId, 0, {});
    return { min: r0.min, max: r0.max, unplanned: sawUnplanned, capped: capped };
  }

  function fmeaNextExpCode(problem) {
    var used = {};
    fmeaAllExperiments(problem).forEach(function (r) { used[String((r.x && r.x.code) || '')] = 1; });
    var i = 1;
    while (used['EXP-' + i]) i++;
    return 'EXP-' + i;
  }

  function fmeaEvidenceRollup(problem) {
    var all = fmeaAllExperiments(problem), t = { total: all.length, confirmed: 0, refuted: 0, inconclusive: 0, open: 0 };
    all.forEach(function (r) {

      else if (v === 'refuted') t.refuted++;
      else if (v === 'inconclusive') t.inconclusive++;

  }

  function rpnBand(r) { return r >= 200 ? 'high' : r >= 100 ? 'med' : 'low'; }
  function fmeaScaleLabel(kind, v) { var a = FMEA_SCALES[kind]; if (!a) return ''; return a[(parseInt(v, 10) || 1) - 1] || ''; }

      for (var j = 0; j < effs.length; j++) { var cs = effs[j].causes || [];
        for (var k = 0; k < cs.length; k++) { var r = calcRpn(cs[k].severity, cs[k].occurrence, cs[k].detection); if (r > max) max = r; } } }
    return max;

    var max = 0, modes = prob.modes || [];
    for (var i = 0; i < modes.length; i++) { if (modes[i].status === 'resolved') continue; var effs = modes[i].effects || [];
      for (var j = 0; j < effs.length; j++) { if (effs[j].status === 'resolved') continue; var cs = effs[j].causes || [];
        for (var k = 0; k < cs.length; k++) { if (cs[k].status === 'resolved') continue;
          var r = calcRpn(cs[k].severity, cs[k].occurrence, cs[k].detection); if (r > max) max = r; } } }
    return max;
  }
  function fmeaProblemsFor(exec, objectiveId) {
    var out = [], risks = (exec && exec.risks) || [];
    for (var i = 0; i < risks.length; i++) if (risks[i].objectiveId === objectiveId) out.push(risks[i]);
    return out;
  }
  // rollup over a set of problems. gatePassed is a fn(gateId)->bool (defaults to none passed).
  function fmeaRollup(problems, gatePassed) {
    var gp = gatePassed || function () { return false; };
    var out = { total: problems.length, openHigh: 0, openMed: 0, openLow: 0, clear: 0, worst: 0 };
    for (var i = 0; i < problems.length; i++) {
      var u = worstUnresolvedRpn(problems[i], gp(problems[i].gateId));
      if (u > out.worst) out.worst = u;

    }

  }
  var _fmeaSeq = 0;
  function fmeaId(prefix) { _fmeaSeq++; return (prefix || 'x') + '_' + Date.now().toString(36) + '_' + _fmeaSeq.toString(36) + Math.floor(Math.random() * 1296).toString(36); }
  function blankCause() { return { cid: fmeaId('c'), cause: '', severity: 1, occurrence: 1, detection: 1, mitigation: '', status: 'open' }; }
  function blankEffect() { return { eid: fmeaId('e'), effect: '', status: 'open', causes: [blankCause()] }; }
  function blankMode() { return { mid: fmeaId('m'), mode: '', status: 'open', effects: [blankEffect()] }; }
  function blankProblem(objectiveId) { return { rid: fmeaId('r'), problem: '', objectiveId: objectiveId || null, gateId: null, status: 'open', knowns: [], modes: [blankMode()] }; }
  // shape-normalize a stored/imported problem (schema-safe; fills missing arrays/fields, preserves ids)
  /* This rebuilds every problem from an explicit field list, which means ANY field not named here is
     silently discarded on load — the doc saves correctly and comes back missing pieces. That cost a
     long hunt when FMEA evidence was added: the write was fine, the read threw it away. Anything
     added to a mode, effect or cause must be carried through here too. */
  function keepExperiments(src, out) {
    if (src && Array.isArray(src.experiments) && src.experiments.length) out.experiments = src.experiments;
    return out;
  }
  function migrateProblem(r) {
    r = r || {};
    return {
      rid: r.rid || r.id || fmeaId('r'),
      problem: r.problem || '',
      objectiveId: (r.objectiveId != null) ? r.objectiveId : null,
      gateId: r.gateId || null,
      status: r.status || 'open',
      knowns: (r.knowns || []).map(function (k) { return (typeof k === 'string') ? { kid: fmeaId('k'), text: k } : { kid: (k && k.kid) || fmeaId('k'), text: (k && k.text) || '' }; }),
      modes: (r.modes || []).map(function (m) { m = m || {};
        return keepExperiments(m, { mid: m.mid || fmeaId('m'), mode: m.mode || '', status: m.status || 'open',

                return keepExperiments(c, { cid: c.cid || fmeaId('c'), cause: c.cause || '',

                  mitigation: c.mitigation || '', status: c.status || 'open' });
              }) });

  }

  // ---- exports --------------------------------------------------------------
  /* ---- Milestone pause / deprioritise ---------------------------------------------------------------
     Modelled the way objectives already end: a separate state record rather than a field on the
     milestone. The milestone itself is untouched, so everything that reads one keeps working, and the
     history of pausing survives instead of a field being overwritten and lost.
     'paused' means the date is suspect but the work is still intended; 'deprioritized' means it is not,
     but the record is worth keeping. They behave identically on the chart — the difference is for the
     person reading a review, not for the renderer.
     The LAST matching record wins, so resuming is appending {status:'active'} rather than hunting down
     and deleting the original: the pause stays in the history. */
  var MS_PAUSED = { paused: 1, deprioritized: 1 };
  function milestoneState(milestoneState_, msId){
    var arr = milestoneState_ || [], hit = null;
    for (var i = 0; i < arr.length; i++) {
      var r = arr[i];

    }

  }

    var r = milestoneState(milestoneState_, msId);

    var out = [];
    (milestones || []).forEach(function (m) {
      if (m && milestonePaused(milestoneState_, m.id)) out.push(m.id);
    });
    return out;
  }

  function setMilestoneState(milestoneState_, msId, status, day, note){
    var arr = (milestoneState_ || []).slice();
    arr.push({ milestoneId: msId, status: status, day: (day == null ? null : day),
               note: (note == null ? '' : String(note)) });
    return arr;
  }

  /* ---- Plan versions -------------------------------------------------------------------------------
     A revision snapshots the WHOLE objective plan: its workstreams, its gates with dates, ordering and
     targets, and the KPIs hosted on those gates. Per objective, so a version can honestly claim what the
     committed finish was at the time.
     Versions are READ-ONLY history. There is deliberately no restore: a plan that has moved on cannot be
     rewound without deciding what happens to gates passed since, and guessing that is worse than keeping
     the record and letting someone rebuild deliberately. */
  function planVersionsOf(exec, objId){
    return ((exec && exec.planVersions) || [])
      .filter(function (r) { return r && r.objectiveId === objId; })
      .slice().sort(function (a, b) { return (a.v || 0) - (b.v || 0); });
  }

    var vs = planVersionsOf(exec, objId);
    return vs.length ? vs[vs.length - 1] : null;
  }
  function nextPlanVersionNumber(exec, objId){
    var last = latestPlanVersion(exec, objId);
    return last ? (last.v || 0) + 1 : 1;
  }
  /* The snapshot. Everything the diff needs and nothing derived: a stored forecast would be wrong the
     moment anything else moved. */
  function capturePlanSnapshot(exec, portfolio, objId){
    var sets = ((exec && exec.stageGateSets) || [])
      .filter(function (s) { return s && s.objectiveId === objId; })
      .map(function (s) { return { id: s.id, name: s.name || '', order: s.order || 0 }; })
      .sort(function (a, b) { return a.order - b.order; });
    var kpis = ((exec && exec.kpis) || []).filter(function (k) { return k && k.hostType === 'stageGate'; });
    var gates = ((exec && exec.stageGates) || [])
      .filter(function (g) { return g && g.objectiveId === objId; })
      .map(function (g, i) {
        var links = kpis.filter(function (k) { return k.hostId === g.id; })
          .map(function (k) {
            return { kpiId: k.id, name: k.name || '', direction: k.direction || '',
                     target: (k.target == null ? null : k.target), unit: k.unit || '' };
          });

                 order: (g.order == null ? i : g.order), kpis: links };
      })
      .sort(function (a, b) { return a.order - b.order; });

    return { sets: sets, gates: gates, finishDay: (obj && obj.plannedEnd != null) ? obj.plannedEnd : null };
  }
  function gatesById(snap){
    var m = {}; ((snap && snap.gates) || []).forEach(function (g) { m[g.id] = g; }); return m;
  }
  function kpiKeyOf(g){
    return (g.kpis || []).map(function (k) {
      return k.kpiId + '@' + (k.target == null ? '' : k.target) + (k.direction || '');
    }).sort().join(',');

  /* What changed between two snapshots. A gate counts once, under the most significant thing that

    time(ms) { const d = new Date(ms); let h = d.getUTCHours(); const m = d.getUTCMinutes(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ap; },
    stamp(ms) { if (!ms) return '—'; return F.day(F.dayOfMs(ms)) + ', ' + F.time(ms); },
    ago(ms, now) {
      if (!ms) return '';

      if (s < 60) return 'just now';
      const m = Math.round(s / 60);
      if (m < 60) return m + (m === 1 ? ' minute ago' : ' minutes ago');
      const h = Math.round(m / 60);

    /* quarters: '2026Q4' -> 'Q4 2026' */
    q(q) { const m = /^(\d{4})Q([1-4])$/.exec(q || ''); return m ? 'Q' + m[2] + ' ' + m[1] : (q || 'No quarter'); },
    qOfDay(day) { const d = F.dateOf(day); return d.getUTCFullYear() + 'Q' + (Math.floor(d.getUTCMonth() / 3) + 1); },
    qRange(q) { const m = /^(\d{4})Q([1-4])$/.exec(q || ''); if (!m) return null; const y = +m[1], i = +m[2] - 1; const s = Math.round((Date.UTC(y, i * 3, 1) - EPOCH) / DAY); const e = Math.round((Date.UTC(y, i * 3 + 3, 1) - EPOCH) / DAY) - 1; return { start: s, end: e }; },
    /* ---- numbers ---- */
    n(v, dp) {

      const x = Number(v);
      if (dp != null) return x.toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
      const a = Math.abs(x);
      const d = a >= 1000 ? 0 : a >= 100 ? 1 : a >= 10 ? 2 : a >= 1 ? 3 : 4;

    },
    /* value with unit: 1.84 'V' -> '1.84 V'; '%' and '°C' attach without a space */
    u(v, unit) { const s = F.n(v); if (s === '—') return s; if (!unit) return s; return /^(%|°)/.test(unit) ? s + unit : s + ' ' + unit; },
    score(s) { return s == null || !isFinite(s) ? '—' : String(Math.round(s)); },
    pct(x) { return x == null || !isFinite(x) ? '—' : Math.round(x) + '%'; },
    plural(n, one, many) { return n + ' ' + (n === 1 ? one : many || one + 's'); },
    list(items) { const a = items.filter(Boolean); if (a.length < 2) return a.join(''); return a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; },
    cap(s) { s = String(s || ''); return s ? s[0].toUpperCase() + s.slice(1) : s; },
    /* ---- people (emails are the stored identity) ---- */
    person(email) { const e = String(email || '').toLowerCase(); return ROSTER.find((u) => String(u.email).toLowerCase() === e) || null; },
    /* the roster's name, else the email before the @ in words ("toru.hatsukade@…" -> "Toru Hatsukade") */
    name(email) {

      if (!LIVE) return local || '—';   // the sample's people are all on its roster
      const words = local.split(/[._-]+/).filter(Boolean);

    },
    first(email) { return F.name(email).split(' ')[0]; },
    initials(email) { const n = F.name(email); const p = n.split(/\s+/).filter(Boolean); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); },
    people(emails) { return F.list((emails || []).map(F.first)); },
    /* the roster's orgRole as a job title: cto -> CTO, ceo -> CEO, lead -> Lead, ic -> Engineer */
    roleLabel(orgRole) { const r = String(orgRole || '').toLowerCase(); return { cto: 'CTO', ceo: 'CEO', lead: 'Lead', ic: 'Engineer' }[r] || (r ? F.cap(r) : ''); },
    roleOf(email) { const u = F.person(email); return u && u.orgRole ? String(u.orgRole).toLowerCase() : ''; },
    /* ---- score bands (the engine's thresholds: 80+ on track, 65 to 79 at risk, below 65 off track) ---- */
    band(score) { if (score == null || !isFinite(score)) return 'none'; const b = RD.band(score); return b === 'on-track' ? 'ok' : b === 'at-risk' ? 'warn' : b === 'off-track' ? 'bad' : 'none'; },
    bandWord(tone) { return { ok: 'On track', warn: 'At risk', bad: 'Off track', none: 'No score yet' }[tone] || ''; },
    tone(t) { return 't-' + (t || 'none'); }

})();

/* --------------------------------------------------------------- Component */
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this._t0 = Date.now();
    this._timers = [];
    this.APP = APP;
    this._hub = this.hubSession();   // the real Hub sign-in, when this page shares the Hub's origin (deployed copies)
    this.D = this.freshData();
    this.pullHook();
    const st = {
      rev: 0,                 // bumped after every data mutation
      menu: '',               // id of the one open menu or popover ('' = none)
      sheets: [],             // right-hand editor stack: [{ kind:'mod.name', data:{}, d:{draft}, err:'' }]
      dlg: null,              // confirm / ask dialog
      toasts: [], tseq: 0,
      save: { state: 'saved', at: this.D.nowMs },
      sim: { offline: false, hub: true },
      ro: false,              // read-only preview
      theme: 'light',         // 'light' | 'dark' | 'system'; light until a choice is saved (decided October 14; 'Match system' follows the OS)
      q: '', searchOpen: false,
      settings: false
    };
    MOD_ORDER.forEach((n) => {
      const m = MODS[n];
      if (m && m.state) Object.assign(st, typeof m.state === 'function' ? m.state(this) : K.clone(m.state));
    });
    if (typeof APP_INIT === 'function') APP_INIT(this, st);
    /* who is viewing: the Hub's own sign-in when there is one; otherwise the simulated sign-in, shared by all
       four boards like the real Hub session (the canvas, a file opened locally, a Confluence embed) */
    const vp = this._hub ? { email: this._hub.email, signedIn: true } : LIVE ? { email: '', signedIn: false } : this.storedViewer();
    st.viewer = vp.email;
    st.sim = Object.assign({}, st.sim || {}, { hub: vp.signedIn });
    this.state = st;
    this.applyViewer(st.viewer);
  }

  freshData() {
    if (LIVE) return this.liveData();
    const S = calmSample();
    SEEDS.forEach((f) => f(S));
    if (this._hub) this.addHubPerson(S, this._hub);
    F.setRoster((S.roster && S.roster.users) || []);
    S.prefsByEmail = {};
    if (S.me && S.me.email) S.prefsByEmail[S.me.email] = S.prefs || { kbDone: {} };
    return S;
  }

  /* live builds start empty; NET fills the documents from the broker (kit/net.js) */
  liveData() {
    const t = liveToday();
    const S = {
      today: t, todayIso: F.iso(t), nowMs: Date.now(),
      me: { email: '', name: '', role: '' }, hubSignedIn: !!this._hub,
      roster: { users: [] }, portfolio: REPAIR.blank('portfolio'), docs: {}, spec: {},
      ganttView: { overrides: {} }, analysis: null, prefs: { kbDone: {} }, version: 1, prefsByEmail: {}
    };
    if (this._hub) this.addHubPerson(S, this._hub);
    F.setRoster(S.roster.users);
    return S;
  }
  /* live: after the broker's roster loads, the Hub person keeps the roster's name and role */
  liveRoster() {
    const D = this.D;
    if (!D.roster || !Array.isArray(D.roster.users)) D.roster = { users: [] };
    if (this._hub) this.addHubPerson(D, this._hub);
    F.setRoster(D.roster.users);
    if (this._hub) this.applyViewer(this._hub.email);
    this.setState({ viewer: this._hub ? this._hub.email : '', sim: Object.assign({}, this.state.sim, { hub: !!this._hub }), rev: (this.state.rev || 0) + 1 });
  }

  /* ------------------------------------------------ who is viewing (the Hub sign-in) */
  /* The Hub's sign-in (localStorage 'hub_session_v1'), read the way the live apps read it: RD.hubSessionEmail
     accepts it only if it parses, carries an email and has not expired. The role is the orgRole the Hub
     stored with it. Null when there is none: the canvas, a file opened locally, a Confluence embed where
     the Hub's storage is not visible. The expiry is real time, so this uses the clock, not the sample's today. */
  hubSession() {
    let raw = null;
    try { raw = window.localStorage ? window.localStorage.getItem('hub_session_v1') : null; } catch (e) { return null; }
    if (!raw || typeof RD.hubSessionEmail !== 'function') return null;
    const email = RD.hubSessionEmail(raw, Date.now());
    if (!email) return null;
    let s = null;
    try { s = JSON.parse(raw); } catch (e) { s = null; }
    return { email: email, orgRole: s && typeof s.orgRole === 'string' ? s.orgRole.trim().toLowerCase() : '' };
  }
  /* the signed-in Hub person joins the sample roster (or updates their entry), with the role the Hub gave them */
  addHubPerson(S, hub) {
    if (!S.roster) S.roster = { users: [] };
    if (!Array.isArray(S.roster.users)) S.roster.users = [];
    const known = S.roster.users.find((u) => String(u.email).toLowerCase() === hub.email);
    if (known) {
      known.disabled = false;
      if (!LIVE || !known.orgRole) known.orgRole = hub.orgRole;   // live: the broker's roster is the authority on roles
      known.hub = true;
      return;
    }
    const local = hub.email.split('@')[0];
    const words = local.split(/[._-]+/).filter(Boolean);
    const name = words.length ? words.map((w) => w[0].toUpperCase() + w.slice(1)).join(' ') : hub.email;
    S.roster.users.push({ email: hub.email, disabled: false, name: name, orgRole: hub.orgRole, leadDivisions: [], hub: true });
  }
  storedViewer() {
    const dflt = { email: (this.D.me && this.D.me.email) || '', signedIn: true };
    try {
      const raw = window.localStorage && window.localStorage.getItem('calm_viewer');
      if (!raw) return dflt;
      const v = JSON.parse(raw);
      const u = v && F.person(v.email);
      if (!u || u.disabled) return dflt;
      return { email: u.email, signedIn: v.signedIn !== false };
    } catch (e) { return dflt; }
  }
  /* make the data's "me" (sidebar, posted-by, prefs) the given roster person */
  applyViewer(email) {
    const u = F.person(email);
    if (!u) return;
    const D = this.D;
    D.me = { email: u.email, name: F.first(u.email), role: F.roleLabel(u.orgRole) };
    if (!D.prefsByEmail) D.prefsByEmail = {};
    if (!D.prefsByEmail[u.email]) D.prefsByEmail[u.email] = { kbDone: {} };
    D.prefs = D.prefsByEmail[u.email];
  }
  /* sign in as a roster person, or pass '' to sign out (the person is remembered for signing back in) */
  setViewer(email) {
    if (this._hub) return;   // the Hub decides who is signed in; sign in as someone else there
    const signedIn = !!email;
    const target = signedIn ? email : this.state.viewer;
    const u = F.person(target);
    if (signedIn && (!u || u.disabled)) return;
    try { window.localStorage && window.localStorage.setItem('calm_viewer', JSON.stringify({ email: target, signedIn: signedIn })); } catch (e) { /* storage blocked: this board only */ }
    this.applyViewer(target);
    this.setState({ viewer: target, sim: Object.assign({}, this.state.sim, { hub: signedIn }), rev: (this.state.rev || 0) + 1 });
    if (typeof APP_VIEWER_CHANGED === 'function') APP_VIEWER_CHANGED(this);
    this.toast(signedIn ? 'Signed in as ' + F.name(target) + (u && u.orgRole ? ' (' + F.roleLabel(u.orgRole) + ')' : '') + '.' : 'Signed out of the Hub.', 'info');
  }
  /* the signed-in person, or null when signed out */
  viewer() {
    if (!(this.state.sim && this.state.sim.hub)) return null;
    const u = F.person(this.state.viewer);
    return u && !u.disabled ? { email: u.email, name: u.name, orgRole: String(u.orgRole || '').toLowerCase(), role: F.roleLabel(u.orgRole) } : null;
  }
  hasRole(roles) { const v = this.viewer(); return !!v && roles.indexOf(v.orgRole) >= 0; }
  canEditPlan() { return this.hasRole(PLAN_EDITOR_ROLES); }
  /* "Corey Staller and Dana Whitcomb": the people who may change the plan */
  planEditorsText() {
    const names = ((this.D.roster && this.D.roster.users) || [])
      .filter((u) => u.email && !u.disabled && PLAN_EDITOR_ROLES.indexOf(String(u.orgRole || '').toLowerCase()) >= 0)
      .map((u) => u.name || u.email);

  }
  /* the sidebar's person block */
  meVM() {
    const v = this.viewer();
    if (!v) return { name: 'Signed out', role: 'Not signed in to the Hub', initials: '–', signedIn: false };
    return { name: F.first(v.email), role: v.role || 'Signed in', initials: F.initials(v.email), signedIn: true };
  }
  /* the "Signed in as" picker every board's Settings shows (fixed to the Hub person when the Hub signed them in) */
  viewerVM() {
    const S = this.state;
    if (LIVE && !this._hub) {
      return {
        fixed: true, value: '', opts: [{ v: '', label: 'Not signed in to the Hub' }], pick: () => {},
        hint: inEmbed()

          : 'Sign in to the Hub, then reload this page.'

    if (this._hub) {
      const v = this.viewer();
      return {
        fixed: true,
        value: this._hub.email,

        pick: () => {},

      };

    const opts = ((this.D.roster && this.D.roster.users) || []).filter((u) => u.email && !u.disabled)

  componentDidMount() { if (LIVE) NET.boot(this); }
  componentWillUnmount() { this._timers.forEach((t) => clearTimeout(t)); if (LIVE) NET.stop(this); }

  /* ---------------------------------------------------------------- time */
  now() { return this.D.nowMs + Math.max(0, Date.now() - this._t0); }
  today() { return this.D.today; }
  later(fn, ms) { const t = setTimeout(fn, ms); this._timers.push(t); return t; }

  /* --------------------------------------------------------------- state */
  set(patch) { this.setState(patch); }
  bump() { this.setState({ rev: (this.state.rev || 0) + 1 }); }
  /* per-render cache: C.memo('kr.rows', () => expensive()) */
  memo(key, fn) { const m = this._memo || (this._memo = {}); if (!(key in m)) m[key] = fn(); return m[key]; }
  /* another module's view model (computed once per render) */
  vmOf(name) { return this.memo('vm:' + name, () => this.computeVM(name)); }

  /* -------------------------------------------- data changes (simulated save) */
  /* read-only: the preview / link flag, or an app rule about who may edit (APP_LOCKED) */
  isRo() { return !!this.state.ro || this.isLocked(); }
  isLocked() { return typeof APP_LOCKED === 'function' && !!APP_LOCKED(this); }
  guard() {
    if (this.state.ro) { this.toast('Read-only view — editing is disabled.', 'info'); return false; }
    if (LIVE && !(this.net && this.net.loaded)) { this.toast('Nothing is loaded from the broker yet, so nothing can be changed.', 'info'); return false; }
    if (this.isLocked()) { this.toast((typeof APP_LOCK_MESSAGE === 'function' && APP_LOCK_MESSAGE(this)) || 'You can view this, but not change it.', 'info'); return false; }

  }
  /* Pulled KPIs read other documents (RD.pulledResult): the engine asks the page for every document it has
     and today. pullSource() hands out one object per version of the data, so what the engine works out is
     kept until the next change (C.mutate and every document NET installs bump D.version). pullHook() makes
     this page the one the engine asks (a test may hold several pages of one board in one process). */
  pullHook() {

  pullSource() {

    const docs = {};
    Object.keys(D.docs || {}).forEach((k) => { const m = /^(?:EXEC|BIZ)-(.+)$/.exec(k); if (m && D.docs[k]) docs[m[1]] = D.docs[k]; });
    this._pullSrc = { portfolio: D.portfolio || {}, docs: docs, today: D.today, todayIso: D.todayIso || F.iso(D.today), _D: D, _v: D.version, _docs: D.docs, _p: D.portfolio };

  /* today's autosave: write 700 ms after the last change, but never later than 2.5 s after the first unsaved one */
  markDirty(msg) {

  }
  /* the "Save" button: flush now */
  saveNow() {

  resetData() {

    if (typeof APP_RESET === 'function') APP_RESET(this);

  }

  /* -------------------------------------------------------------- toasts */
  toast(text, kind) {
    const id = (this.state.tseq || 0) + 1;

    this.setState({ toasts: list, tseq: id });

  copyText(text, okMsg, failMsg) {

  openSheet(kind, data, draft) { this.setState({ sheets: [{ kind: kind, data: data || {}, d: draft || {}, d0: JSON.stringify(draft || {}), err: '' }], menu: '' }); }
  pushSheet(kind, data, draft) { this.setState({ sheets: (this.state.sheets || []).concat([{ kind: kind, data: data || {}, d: draft || {}, d0: JSON.stringify(draft || {}), err: '' }]), menu: '' }); }
  /* has this sheet's draft changed since it opened? (a module may move the baseline with setSheetData({ d0: JSON.stringify(d) }) after a save) */
  sheetDirty(s) {
    if (!s) return false;

  /* close the top sheet, asking first when it has unsaved edits (Escape, back) */
  dismissSheet(e) {
    if (e && e.preventDefault) e.preventDefault();
    const top = this.sheet();
    if (!top) return;
    if (this.sheetDirty(top)) { this.confirm({ title: 'Discard your changes?', body: 'Your edits in this panel are not saved yet.', ok: 'Discard changes', danger: true, onOk: () => this.closeSheet() }); return; }
    this.closeSheet();
  }
  /* close every sheet, asking first when any has unsaved edits (clicking the dimmed page) */
  dismissAll() {
    if ((this.state.sheets || []).some((s) => this.sheetDirty(s))) { this.confirm({ title: 'Discard your changes?', body: 'Your edits in this panel are not saved yet.', ok: 'Discard changes', danger: true, onOk: () => this.closeAllSheets() }); return; }
    this.closeAllSheets();
  }
  closeSheet() { this.setState({ sheets: (this.state.sheets || []).slice(0, -1), menu: '' }); }
  closeAllSheets() { this.setState({ sheets: [], menu: '' }); }
  draft() { const s = this.sheet(); return s ? s.d : {}; }
  /* merge fields into the top sheet's draft */
  setDraft(patch) {
    const s = (this.state.sheets || []).slice();
    if (!s.length) return;
    const top = s[s.length - 1];
    s[s.length - 1] = Object.assign({}, top, { d: Object.assign({}, top.d, patch), err: '' });
    this.setState({ sheets: s });
  }
  /* set one nested field: setDraftPath('steps.2.name', 'Soak test') */
  setDraftPath(path, value) {
    const s = (this.state.sheets || []).slice();
    if (!s.length) return;
    const top = s[s.length - 1];
    s[s.length - 1] = Object.assign({}, top, { d: K.setPath(top.d || {}, path, value), err: '' });
    this.setState({ sheets: s });
  }
  /* replace the top sheet's data payload (rarely needed) */
  setSheetData(patch) {
    const s = (this.state.sheets || []).slice();
    if (!s.length) return;
    const top = s[s.length - 1];
    s[s.length - 1] = Object.assign({}, top, { data: Object.assign({}, top.data, patch) });
    this.setState({ sheets: s });
  }
  sheetErr(msg) {
    const s = (this.state.sheets || []).slice();
    if (!s.length) return;
    s[s.length - 1] = Object.assign({}, s[s.length - 1], { err: msg || '' });
    this.setState({ sheets: s });
  }
  /* onChange handler factories for draft fields */
  bindDraft(field) { return (e) => this.setDraft({ [field]: e && e.target ? e.target.value : e }); }
  bindDraftCheck(field) { return (e) => this.setDraft({ [field]: !!(e && e.target && e.target.checked) }); }
  bindDraftPath(path) { return (e) => this.setDraftPath(path, e && e.target ? e.target.value : e); }

  /* ------------------------------------------------- confirm / ask dialogs */
  /* C.confirm({ title, body, ok:'Delete', danger:true, onOk(){...} }) */
  confirm(o) { this._dlgOk = o.onOk || null; this.setState({ dlg: { kind: 'confirm', title: o.title || 'Are you sure?', body: o.body || '', ok: o.ok || 'Confirm', cancel: o.cancel || 'Cancel', danger: !!o.danger }, menu: '' }); }
  /* C.ask({ title, label, value, placeholder, ok:'Create', onOk(value){ return 'error text' or nothing } }) */
  ask(o) { this._dlgOk = o.onOk || null; this.setState({ dlg: { kind: 'ask', title: o.title || '', body: o.body || '', label: o.label || '', value: o.value || '', placeholder: o.placeholder || '', ok: o.ok || 'Save', cancel: o.cancel || 'Cancel', danger: false, err: '' }, menu: '' }); }
  dlgOk() {
    const d = this.state.dlg;
    if (!d) return;
    const fn = this._dlgOk;
    if (d.kind === 'ask') {
      const r = fn ? fn(d.value) : null;
      if (typeof r === 'string' && r) { this.setState({ dlg: Object.assign({}, d, { err: r }) }); return; }
    }
    this._dlgOk = null;
    this.setState({ dlg: null });
    if (d.kind !== 'ask' && fn) fn();
  }
  dlgCancel() { this._dlgOk = null; this.setState({ dlg: null }); }

  /* ------------------------------------------------------- app hand-off */
  handoff(payload) { try { window.sessionStorage.setItem('celadyne-calm-open', JSON.stringify(payload)); } catch (e) { /* storage blocked */ } }
  takeHandoff(app) {
    try {
      const raw = window.sessionStorage.getItem('celadyne-calm-open');
      if (!raw) return null;
      const p = JSON.parse(raw);
      if (!p || p.app !== app) return null;
      window.sessionStorage.removeItem('celadyne-calm-open');
      return p;
    } catch (e) { return null; }
  }

  /* --------------------------------------------------------------- theme */
  themeNow() {
    const t = this.state.theme;
    if (t === 'dark' || t === 'light') return t;
    try { return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { return 'light'; }
  }

  /* ------------------------------------------------------- view models */
  computeVM(name) {
    const m = MODS[name];
    if (!m || !m.vm) return {};
    try { return m.vm(this, this.ctx) || {}; } catch (e) {
      console.error('[calm] ' + name + ' view failed', e);
      (this._vmErrors || (this._vmErrors = [])).push(name + ': ' + (e && e.message ? e.message : e));
      return { __err: String(e && e.message ? e.message : e) };
    }
  }
  lazy(name) {
    const C = this;
    return new Proxy({}, {
      get(_, k) {
        if (typeof k === 'symbol' || k === 'toJSON' || k === '$$typeof' || k === 'then') return undefined;
        return C.vmOf(name)[k];
      }
    });
  }
  uiVM() {
    const S = this.state;
    const top = this.sheet();
    const sv = S.save || {};
    const saveText = sv.state === 'saving' ? 'Saving…' : sv.state === 'offline' ? 'Offline, changes kept here' : sv.state === 'conflict' ? 'Reloaded after a conflict' : sv.state === 'error' ? (sv.why || 'Not saved') : 'Saved ' + F.ago(sv.at, this.now());
    const d = S.dlg;
    return {
      anyMenu: !!S.menu,
      closeMenus: () => this.closeMenus(),
      sheetOpen: !!top,
      sheetKind: top ? top.kind : '',
      sheetDepth: (S.sheets || []).length,
      sheetBack: (S.sheets || []).length > 1,
      sheetErr: top ? top.err || '' : '',
      hasSheetErr: !!(top && top.err),
      sheetCls: 'sheet' + (top && ((MODS[top.kind.split('.')[0]] || {}).wide || []).indexOf(top.kind) >= 0 ? ' wide' : ''),
      closeSheet: () => this.closeSheet(),
      closeAllSheets: () => this.closeAllSheets(),
      dismissSheet: (e) => this.dismissSheet(e),
      dismissAll: () => this.dismissAll(),
      sheetKey: (e) => { if (!e || e.key !== 'Escape') return; if (e.defaultPrevented || (typeof e.isDefaultPrevented === 'function' && e.isDefaultPrevented())) return; this.dismissSheet(e); },
      toasts: (S.toasts || []).map((t) => ({ text: t.text, cls: 'toast ' + (t.kind === 'err' ? 'err' : t.kind === 'info' ? 'info' : ''), drop: () => this.dropToast(t.id) })),
      saving: sv.state === 'saving',
      saveText: saveText,
      saveTone: sv.state === 'error' ? 't-bad' : sv.state === 'offline' || sv.state === 'conflict' ? 't-warn' : sv.state === 'saving' ? 't-info' : 't-ok',
      saveNow: () => this.saveNow(),
      dlg: d ? {
        title: d.title, body: d.body, hasBody: !!d.body, ok: d.ok, cancel: d.cancel,
        okCls: d.danger ? 'btn danger solid' : 'btn pri',
        isAsk: d.kind === 'ask', label: d.label, value: d.value, placeholder: d.placeholder, err: d.err || '', hasErr: !!d.err,
        onValue: (e) => this.setState({ dlg: Object.assign({}, this.state.dlg, { value: e.target.value, err: '' }) }),
        onKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); this.dlgOk(); } else if (e.key === 'Escape') this.dlgCancel(); },
        okFn: () => this.dlgOk(), cancelFn: () => this.dlgCancel()
      } : null,
      hasDlg: !!d,
      errors: (this._vmErrors || []).slice(),
      hasErrors: !!(this._vmErrors && this._vmErrors.length)
    };
  }

  renderVals() {
    if (LIVE) { const t = liveToday(); if (t !== this.D.today) { this.D.today = t; this.D.todayIso = F.iso(t); } }
    this.pullHook();
    this._memo = {};
    this._vmErrors = [];
    const ctx = APP_CTX(this);
    this.ctx = ctx;
    const vals = { ro: this.isRo(), theme: this.themeNow() };
    MOD_ORDER.forEach((n) => { vals[n] = this.lazy(n); });
    vals.sh = APP_SHELL(this, ctx);
    vals.ui = this.uiVM();
    return vals;
  }
}

/* ================= kit/merge.js */
/* ============================================================================
   Calm kit: three-way merge for the shared portfolio (live builds).
   When a portfolio save is refused because someone saved first (412), NET merges
     base   the portfolio as this page last loaded or saved it
     mine   the portfolio with this page's unsaved changes
     theirs the portfolio the other editor saved
   and saves the result: every field this page changed keeps its value, everything else comes from
   theirs. Lists of records with ids (objectives, milestones, KPIs…) merge record by record, so two
   people editing different objectives never touch each other's work.
   A real clash makes the merge give up (ok:false) and the caller reloads theirs:
     - one side deleted a record (or field) the other side changed
     - both sides added a record with the same id
   Both sides changing the same field is not a clash: this page's value wins, as today's Planning
   re-applies your change.
   Pure functions over JSON data; tested by test/merge.js.
   ========================================================================== */
const MERGE = (function () {
  function same(a, b) {
    if (a === b) return true;
    if (a == null || b == null || typeof a !== 'object' || typeof b !== 'object') return false;
    return JSON.stringify(a) === JSON.stringify(b);
  }
  function rec(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }
  function clone(x) { return x === undefined ? undefined : JSON.parse(JSON.stringify(x)); }
  /* a list of records that all carry a distinct id (an empty list qualifies) */
  function idList(a) {
    if (!Array.isArray(a)) return false;
    const seen = {};
    for (let i = 0; i < a.length; i++) {
      const x = a[i];
      if (!rec(x) || x.id == null || x.id === '') return false;
      const k = String(x.id);
      if (seen[k]) return false;
      seen[k] = 1;
    }
    return true;
  }
  function byId(a) { const m = {}; a.forEach((x) => { m[String(x.id)] = x; }); return m; }
  function keysOf() {
    const out = [], seen = {};
    for (let i = 0; i < arguments.length; i++) {
      const o = arguments[i];
      if (!rec(o)) continue;
      Object.keys(o).forEach((k) => { if (!seen[k]) { seen[k] = 1; out.push(k); } });
    }
    return out;
  }

  function merge(b, m, t, cx, path) {
    if (same(m, b)) return clone(t);           // this page didn't change it: theirs
    if (same(t, b)) return clone(m);           // they didn't change it: this page's
    if (same(m, t)) return clone(m);           // both made the same change
    if (rec(b) && rec(m) && rec(t)) return mergeRec(b, m, t, cx, path);
    if (idList(b) && idList(m) && idList(t)) return mergeList(b, m, t, cx, path);
    return clone(m);                           // both changed one value: this page's change wins
  }
  function mergeRec(b, m, t, cx, path) {
    const out = {};
    keysOf(t, m, b).forEach((k) => {
      const hb = Object.prototype.hasOwnProperty.call(b, k);
      const hm = Object.prototype.hasOwnProperty.call(m, k);
      const ht = Object.prototype.hasOwnProperty.call(t, k);
      if (hb && !hm) {                         // this page removed the field
        if (ht && !same(t[k], b[k])) clash(cx, path + '.' + k, 'removed here, changed there');
        return;
      }
      if (hb && !ht) {                         // they removed the field
        if (hm && !same(m[k], b[k])) clash(cx, path + '.' + k, 'changed here, removed there');
        return;
      }
      if (!hb && hm && ht) { out[k] = merge(undefined, m[k], t[k], cx, path + '.' + k); return; }
      if (!hb) { out[k] = clone(hm ? m[k] : t[k]); return; }
      out[k] = merge(b[k], m[k], t[k], cx, path + '.' + k);
    });
    return out;
  }
  function mergeList(b, m, t, cx, path) {
    const B = byId(b), M = byId(m), T = byId(t);
    const out = [];
    t.forEach((x) => {                         // their order first
      const id = String(x.id);
      const inB = Object.prototype.hasOwnProperty.call(B, id), inM = Object.prototype.hasOwnProperty.call(M, id);
      if (inB && !inM) {                       // this page deleted it
        if (!same(T[id], B[id])) clash(cx, path + '[' + id + ']', 'deleted here, changed there');
        return;
      }
      if (!inB && inM) {                       // both sides added this id
        if (!same(M[id], T[id])) clash(cx, path + '[' + id + ']', 'added on both sides');
        out.push(clone(T[id]));
        return;
      }
      out.push(inM ? merge(B[id], M[id], T[id], cx, path + '[' + id + ']') : clone(x));
    });
    m.forEach((x) => {                         // this page's additions, in its order
      const id = String(x.id);
      if (!Object.prototype.hasOwnProperty.call(B, id) && !Object.prototype.hasOwnProperty.call(T, id)) out.push(clone(x));
    });
    Object.keys(B).forEach((id) => {           // they deleted a record this page changed
      if (!Object.prototype.hasOwnProperty.call(T, id) && Object.prototype.hasOwnProperty.call(M, id) && !same(M[id], B[id])) clash(cx, path + '[' + id + ']', 'changed here, deleted there');
    });
    return out;
  }
  function clash(cx, where, why) { cx.ok = false; cx.clashes.push(where.replace(/^\./, '') + ': ' + why); }

  /* three(base, mine, theirs) -> { ok, value, clashes } */
  function three(base, mine, theirs) {
    const cx = { ok: true, clashes: [] };
    const value = merge(base, mine, theirs, cx, '');
    return { ok: cx.ok, value: value, clashes: cx.clashes };
  }
  return { three: three, same: same };
})();

/* ================= kit/repair.js */
/* ============================================================================
   Calm kit: load-time repairs for documents read from the broker (live builds).
   The same clean-up today's apps run when they adopt a document, so stored data that predates a field
   or a rule reads the way the modules expect. The sample (data/sample.js plus the seeds) already
   carries these repairs; test/sc_repair.js checks that running them on the sample changes nothing.

     REPAIR.blank(kind)                 an empty document: 'portfolio' | 'exec' | 'spec'
     REPAIR.portfolio(P)                missing lists filled (today's blankPortfolio merge)
     REPAIR.exec(doc)                   missing lists filled (blankExec), workstream clean-up
                                        (migrateStageGateSets without today's forced chaining: the
                                        Independent setting sticks), FMEA problems reshaped
                                        (RD.migrateProblem), milestone step due dates as ISO strings
     REPAIR.spec(doc)                   missing lists, legacy KPI links and host types, colliding
                                        ids renumbered (today's L356–384); returns true if ids moved
     REPAIR.autoPass(doc, divId, P, today)
                                        a gate with no passed date whose targets are all met is passed
                                        today ("auto"), as today's first render does. Returns the
                                        number of gates passed. This one is a real change and is saved.
   Structural repairs are not saved on their own: they go out with the next real change, as today.
   ========================================================================== */
const REPAIR = (function () {
  function arr(o, keys) { keys.forEach((k) => { if (!Array.isArray(o[k])) o[k] = []; }); }
  function obj(o, keys) { keys.forEach((k) => { if (!o[k] || typeof o[k] !== 'object' || Array.isArray(o[k])) o[k] = {}; }); }
  const PORTFOLIO_LISTS = ['units', 'divisions', 'products', 'models', 'initiatives', 'milestones', 'milestoneEdges', 'objectives', 'objectiveEdges', 'kpis', 'kpiDefs', 'kpiUpdates', 'composition'];
  const EXEC_LISTS = ['objectiveState', 'keyResults', 'kpis', 'stageGates', 'tasks', 'boards', 'planVersions', 'kpiUpdates', 'stageGateEdges', 'risks', 'stageGateSets', 'catchupPlans'];
  const EXEC_MAPS = ['gateMode', 'chainGatesByDate', 'etbTrees'];
  const SPEC_LISTS = ['keyResults', 'stageGates', 'kpis', 'kpiUpdates'];

  function blank(kind) {
    const o = {};
    if (kind === 'portfolio') arr(o, PORTFOLIO_LISTS);
    else if (kind === 'spec') { arr(o, SPEC_LISTS); o.modelSpec = {}; }
    else { arr(o, EXEC_LISTS); obj(o, EXEC_MAPS); }
    return o;
  }
  function portfolio(P) {
    if (!P || typeof P !== 'object') return;
    arr(P, PORTFOLIO_LISTS);
  }
  function exec(x) {
    if (!x || typeof x !== 'object') return;
    arr(x, EXEC_LISTS);
    obj(x, EXEC_MAPS);
    /* migrateStageGateSets, without forcing every workstream back to chained */
    const objIds = [];
    x.stageGates.forEach((g) => { if (g && objIds.indexOf(g.objectiveId) < 0) objIds.push(g.objectiveId); });
    objIds.forEach((objId) => {
      let sets = x.stageGateSets.filter((s) => s && s.objectiveId === objId);
      if (!sets.length) {
        const set = { id: RD.allocId('stageGateSet', objId, x.stageGateSets.map((s) => s.id)), objectiveId: objId, name: 'General', order: 0, chained: true };
        x.stageGateSets.push(set);
        sets = [set];
      }
      const ids = sets.map((s) => s.id);
      x.stageGates.forEach((g) => { if (g && g.objectiveId === objId && (!g.setId || ids.indexOf(g.setId) < 0)) g.setId = sets[0].id; });
    });
    x.risks = x.risks.map(RD.migrateProblem);
    /* milestone steps keep their due date as an ISO string ('' when undated), as the live apps store it */
    const EPOCH = Date.UTC(2020, 0, 1);
    x.keyResults.forEach((kr) => {
      ((kr && kr.steps) || []).forEach((st) => {
        if (!st) return;
        if (typeof st.due === 'number' && isFinite(st.due)) st.due = new Date(EPOCH + st.due * 86400000).toISOString().slice(0, 10);
        else if (st.due == null) st.due = '';
      });
    });
  }
  function spec(doc) {
    if (!doc || typeof doc !== 'object') return false;
    arr(doc, SPEC_LISTS);
    if (!doc.modelSpec || typeof doc.modelSpec !== 'object' || Array.isArray(doc.modelSpec)) doc.modelSpec = {};
    RD.migrateKpiLinks(doc.kpis);
    doc.kpis.forEach((k) => { if (k.hostType === 'initiative') k.hostType = 'product'; else if (k.hostType === 'stageGate') k.hostType = 'component'; });
    let changed = false;
    const sgs = doc.stageGates, kpis = doc.kpis;
    const groups = {};
    sgs.forEach((g) => { (groups[g.id] = groups[g.id] || []).push(g); });
    const used = sgs.map((g) => g.id);
    Object.keys(groups).forEach((oldId) => {
      const grp = groups[oldId];
      if (grp.length < 2) return;
      changed = true;
      const hosted = kpis.filter((k) => k.hostType === 'component' && k.hostId === oldId);
      grp.forEach((g) => { const fresh = RD.allocId('stageGate', g.objectiveId || 'MDL-X', used); used.push(fresh); g.__newId = fresh; });
      const firstNormal = grp.find((g) => !g.refModel) || grp[0];
      hosted.forEach((k) => {
        let host = null;
        if (k.refModel) host = grp.find((g) => g.refModel === k.refModel);
        k.hostId = (host || firstNormal).__newId;
      });
      grp.forEach((g) => { g.id = g.__newId; delete g.__newId; });
    });
    const krs = doc.keyResults, kseen = {}, kused = krs.map((k) => k.id);
    krs.forEach((kr) => {
      if (kseen[kr.id]) { const fresh = RD.allocId('keyResult', kr.objectiveId || 'MDL-X', kused); kr.id = fresh; kused.push(fresh); changed = true; }
      kseen[kr.id] = 1;
    });
    return changed;
  }
  function autoPass(doc, divId, P, today) {
    if (!doc || !(doc.stageGates || []).length) return 0;
    const m = {};
    m[divId] = doc;
    const em = RD.withPortfolio(P, m);
    let n = 0;
    doc.stageGates.forEach((g) => {
      if (g && g.actualDate == null && RD.gateAtTarget(g.id, em)) { g.actualDate = today; g.completionMethod = 'auto'; n++; }
    });
    return n;
  }
  return { blank: blank, portfolio: portfolio, exec: exec, spec: spec, autoPass: autoPass, PORTFOLIO_LISTS: PORTFOLIO_LISTS, EXEC_LISTS: EXEC_LISTS };
})();

/* ================= kit/net.js */
/* ============================================================================
   Calm kit: the broker connection (live builds only; LIVE is false on the canvas and in the tests).

   Today's apps' contract, unchanged:
     GET  /state/{id}            -> { doc, etag, version }          404: no document yet
     GET  /state/{id}/version    -> { version, etag }               polled every 25 s
     PUT  /state/{id}  { doc, client }   If-Match: <etag> ("0" for a new document); 412 if someone saved first
     GET  /roster   GET /analysis   GET|PATCH /prefs/{email}
   Every call sends Authorization: Bearer <rd_broker_token>. `client` names this build so the broker can
   turn away pages that predate it (an old tab still open after the update).

   What an app loads and may save comes from its shell's APP_LIVE_PLAN(C). Modules never talk to the
   broker: they change C.D through C.mutate, and NET saves every writable document whose content changed
   (a whole-document PUT, like today) 0.7 s after the last change and within 2.5 s while editing.
   A refused save (412): the portfolio merges field by field (MERGE.three: your fields, their everything
   else) and saves again; any other document reloads and your unsaved change is dropped, as today.
   A dropped connection keeps unsaved changes in the page and retries; closing the page with unsaved
   changes asks first. A load that fails for a passing reason (offline, a 5xx) tries again by itself.

   Shell hooks (all optional):
     APP_LIVE_PLAN(C) -> { roster, prefs, autoPass, createPortfolio, docs(P) -> [ids], writable(id) -> bool,
                           quiet(id) -> bool }
                                createPortfolio: with no portfolio on the broker, load a blank one (Planning)
                                quiet: a document whose changes the poll takes in without "Updated from another editor."
     APP_LIVE_READY(C, url)     after a load; `url` (the page's parameters, lower-case keys) on the first
                                successful load only, null after that
     APP_LIVE_STATUS(C, s)      s = { phase, status } with phase 'loading' | 'ok' | 'notoken' | 'badtoken' |
                                'noportfolio' | 'fail' | 'offline' | 'outdated'
     APP_LIVE_NOTICE(C, tone, text)   conflicts and other editors' changes (default: a toast)
   ========================================================================== */
const NET = (function () {
  const BROKER = 'https://web-production-b17a2.up.railway.app';
  const CLIENT = 'calm-1';
  const TOKEN_KEY = 'rd_broker_token';
  const POLL_MS = 25000, DEBOUNCE_MS = 700, MAXWAIT_MS = 2500;
  const warned = {};

  function warnOnce(t) { if (warned[t]) return; warned[t] = 1; try { console.warn('[calm] ' + t); } catch (e) { /* no console */ } }
  function token() { try { return String(window.localStorage.getItem(TOKEN_KEY) || '').trim(); } catch (e) { return ''; } }
  function storeToken(t) {
    try { if (t) window.localStorage.setItem(TOKEN_KEY, t); else window.localStorage.removeItem(TOKEN_KEY); } catch (e) { /* storage blocked */ }
  }
  function enc(id) { return encodeURIComponent(id); }
  function kindOf(id) { return id === 'portfolio' ? 'portfolio' : /^SPEC-/.test(id) ? 'spec' : 'exec'; }
  function divOf(id) { return String(id).replace(/^(EXEC|BIZ|SPEC)-/, ''); }
  function getObj(C, id) { const D = C.D; return id === 'portfolio' ? D.portfolio : kindOf(id) === 'spec' ? (D.spec || {})[id] : (D.docs || {})[id]; }
  function setObj(C, id, o) {

  /* ------------------------------------------------------------ the wire */

  /* put a document read from the broker into C.D and the registry. Gates at target are passed here

  function install(C, id, resp, p, reg, passLater) {
    const kind = kindOf(id);

    repair(C, id, doc);

    const writable = !!p.writable(id);
    if (!passLater && kind === 'exec' && p.autoPass && writable && !C.state.ro && REPAIR.autoPass(doc, divOf(id), C.D.portfolio, C.D.today) && C.net) C.net.sinceSave = true;
    setObj(C, id, doc);
    reg[id] = { id: id, kind: kind, writable: writable, etag: resp ? String(resp.etag) : '0', version: resp ? Number(resp.version) || 0 : 0, base: base, missing: !resp };

    if (REPAIR.autoPass(doc, divOf(id), C.D.portfolio, C.D.today)) {

    const p = n.plan;

    /* a document a module created after the load (a new division's first document): saved from its next change */
    [['docs', D.docs || {}], ['spec', D.spec || {}]].forEach((pair) => {
      Object.keys(pair[1]).forEach((id) => {
        if (n.reg[id] || !pair[1][id]) return;

    Object.keys(n.reg).forEach((id) => {

      if (s === r.base) return;

  /* ------------------------------------------------------------ loading */
  function urlParams() {

  /* ?token= is saved in this browser and removed from the address bar, as today */

    try {
      const u = new URL(window.location.href);

      const drop = [];
      u.searchParams.forEach((v, k) => { if (String(k).toLowerCase() === 'token') { t = v; drop.push(k); } });
      if (t == null) return;
      storeToken(String(t).trim());
      drop.forEach((k) => u.searchParams.delete(k));
      const q = u.searchParams.toString();
      window.history.replaceState(window.history.state, '', u.pathname + (q ? '?' + q : '') + u.hash);
    } catch (e) { /* no history API */ }

  async function loadRoster(C) {

        const email = u.email.trim().toLowerCase();
        return {
          email: email,
          disabled: !!u.disabled,
          name: typeof u.name === 'string' && u.name.trim() ? u.name.trim() : '',
          orgRole: typeof u.orgRole === 'string' ? u.orgRole.trim().toLowerCase() : '',

    status(C, 'loading');
    try {
      if (n.plan.roster) await loadRoster(C);
      const pr = await call('GET', '/state/portfolio');
      /* no portfolio yet: only Planning starts one (a blank plan, created by its first save with If-Match "0") */
      if (!pr && !n.plan.createPortfolio) { n.loaded = false; status(C, 'noportfolio'); C.bump(); return; }

      const got = await Promise.all(ids.map((id) => call('GET', '/state/' + enc(id)).then((r) => ({ id: id, r: r }))));

    let added = 0;
    for (let i = 0; i < ids.length; i++) {
      try { const r = await call('GET', '/state/' + enc(ids[i])); install(C, ids[i], r, n.plan, n.reg); added++; } catch (e) { if (transient(e)) break; }

  async function conflict(C, id) {

        C.bump();

    const n = C.net;
    const me = viewerEmail(C);

    try {
      const r = await call('GET', '/prefs/' + enc(me));

      n.prefsReady = true;

      if (r && r.prefs) C.D.prefs = { kbDone: r.prefs.kbDone || {} };

    }, (e) => { if (transient(e) && !e.status) goOffline(C); return false; });
  }

  /* ------------------------------------------------------------ analysis portal index (Connect data) */
  function analysis(C) {
    const n = C.net;
    if (!n) return Promise.reject(new Error('not connected'));
    if (n.analysisP) return n.analysisP;
    n.analysisP = call('GET', '/analysis').then((idx) => {
      C.D.analysis = idx && typeof idx === 'object' ? idx : { schema: 2, runs: [] };
      C.bump();
      return C.D.analysis;
    }, (e) => { n.analysisP = null; throw e; });

  /* ------------------------------------------------------------ public */

    const dProdIds = (P.products || []).filter((p) => p.divisionId === d.id && ctx.prodShows(p)).map((p) => p.id);

    const risks = povRisks(doc, rec.id);
    const nHigh = risks.filter((x) => x.rpn >= 200).length, nMed = risks.filter((x) => x.rpn >= 100 && x.rpn < 200).length;
    const maxR = risks.length ? risks[0].rpn : 0;
    const pe = rec.plannedEnd != null ? (casc.objectiveProjectedEnd[rec.id] != null ? casc.objectiveProjectedEnd[rec.id] : rec.plannedEnd) : casc.objectiveProjectedEnd[rec.id];
    const late = pe != null && rec.plannedEnd != null && pe > rec.plannedEnd;
    const app = ctx.appOf(rec.divisionId);
    return Object.assign(blank, {
      isObj: true, title: rec.statement || rec.id, sub: 'Objective, ' + (rec.quarter ? F.q(rec.quarter) : 'no quarter'), badges: badges,
      krs: povKrRows(rec.id, doc, pool, em), hasKrs: (doc.keyResults || []).some((k) => k.objectiveId === rec.id),
      gateHead: 'Stage-gates, ' + gp + ' of ' + gates.length + ' passed', hasGates: gates.length > 0, gateRows: gateRows,
      health: (function () { const h = RD.objectiveGateReadiness(rec.id, em, today); return h == null ? '' : 'Weakest workstream: ' + Math.round(h) + '% of its gates passed'; })(),
      hasRisks: risks.length > 0,
      riskSum: F.plural(risks.length, 'risk') + ', highest RPN ' + maxR + (nHigh ? ', ' + nHigh + ' high' : '') + (nMed ? ', ' + nMed + ' medium' : ''),
      risks: risks.slice(0, 8).map((x) => ({ mode: x.mode, s: String(x.s), o: String(x.o), d: String(x.d), rpn: String(x.rpn), cls: 'pov-rpn ' + F.tone(povRpnTone(x.rpn)) })),
      sched: [
        { k: 'Planned end', v: rec.plannedEnd != null ? F.dayY(rec.plannedEnd) : '—', cls: '' },
        { k: 'Projected end', v: pe != null && isFinite(pe) ? F.dayY(pe) : '—', cls: late ? 'tx-bad strong' : '' },
        { k: 'Score', v: F.score(score), cls: 'strong tx-' + PLAN.tone(RD.band(score)) }
      ],
      hasApp: true, appHref: app === 'sales' ? 'sales_app.html' : 'execution_app.html', appLabel: app === 'sales' ? 'Open in Sales' : 'Open in Execution',
      openApp: () => C.handoff({ app: app, objective: rec.id })
    });
  }
  if (type === 'milestone') {
    const doc = ctx.docOf(povMsDiv(P, rec));
    const achieved = RD.milestoneAchieved(rec, em);
    const score = achieved ? 100 : RD.milestoneScore(rec.id, em);
    const st = PLAN.msState(P, rec.id);
    const paused = !achieved && !!(st && (st.status === 'paused' || st.status === 'deprioritized'));
    const kpis = povMsKpis(P, doc, rec.id).map((k) => povKpiRow(k, pool, em));
    const eff = casc.milestoneEffective[rec.id];
    const pn = PLAN.byId(P, 'product', povMsProd(P, rec));
    const hasPms = typeof PMS !== 'undefined' && PMS && typeof PMS.openReport === 'function';
    return Object.assign(blank, {
      isMs: true, title: rec.name || rec.id, sub: 'Milestone, ' + PLAN.nameOf(PLAN.byId(P, 'initiative', rec.initiativeId)),
      badges: [badge(achieved ? 'Achieved' : paused ? (st.status === 'paused' ? 'Paused' : 'Deprioritized') : PLAN.word(RD.band(score)), achieved ? 'ok' : paused ? 'none' : PLAN.tone(RD.band(score))), badge(pn ? pn.name : 'No product')],
      kpis: kpis, hasKpis: kpis.length > 0, noKpis: !kpis.length,
      sched: [
        { k: 'Planned', v: rec.plannedDate != null ? F.dayY(rec.plannedDate) : '—', cls: '' },
        { k: 'Projected', v: eff != null && isFinite(eff) ? F.dayY(eff) : (paused ? 'Not projected while paused' : '—'), cls: eff != null && rec.plannedDate != null && eff > rec.plannedDate && !achieved ? 'tx-bad strong' : '' },
        { k: 'Status', v: achieved ? 'Achieved' : paused ? (st.status === 'paused' ? 'Paused' : 'Deprioritized') : PLAN.word(RD.band(score)), cls: '' }
      ],
      hasReport: true, reportLabel: rec.milestoneReport ? 'Open report' : 'Create report',
      report: () => { if (hasPms) PMS.openReport(C, ctx, rec.id); else { C.setState({ tab: 'milestones', sheets: [] }); C.toast('Reports open from the Milestones tab.', 'info'); } }
    });
  }
  if (type === 'model') {
    const conf = pedModelConf(D, rec.id);
    const meta = pedSpecMeta(D, rec.id);
    const sp = povModelSpecs(D, rec);
    const roll = RD.sliceScore('model', rec.id, P, em, null);
    const badges = [badge(PLAN.nameOf(PLAN.byId(P, 'product', rec.productId)))];
    if (meta.maturity) badges.push(badge(meta.maturity));
    return Object.assign(blank, {
      isModel: true, title: rec.name || rec.id, sub: 'Model', badges: badges,
      specHead: 'Product specifications' + (conf != null ? ', ' + Math.round(conf) + '% conformance' : ''),
      specs: sp.specs, hasSpecs: sp.specs.length > 0, noSpecs: !sp.specs.length,
      comps: sp.comps, hasComps: sp.comps.length > 0, subs: sp.subs, hasSubs: sp.subs.length > 0,
      rollup: 'Overall ' + F.score(roll), rollCls: 'strong tx-' + PLAN.tone(RD.band(roll)), qs: povQuarterScores(ctx, 'model', rec.id),
      hasSpec: true, openSpec: () => C.handoff({ app: 'spec', model: rec.id })
    });
  }
  if (type === 'division') {
    const overall = RD.rollupDivision(rec.id, P, em);
    const c = povCounts(P, rec.id, em);
    const worst = povWorstSlip(P, rec.id, casc);
    const nObj = (P.objectives || []).filter((o) => o.divisionId === rec.id).length;
    const nMs = (P.milestones || []).filter((m) => povMsDiv(P, m) === rec.id).length;
    const aObj = (P.objectives || []).filter((o) => o.divisionId === rec.id && ctx.isActiveObj(o)).length;
    const aMs = (P.milestones || []).filter((m) => povMsDiv(P, m) === rec.id && ctx.isActiveMs(m)).length;
    const delayed = (P.initiatives || []).filter((i) => i.divisionId === rec.id && i.plannedEnd != null)
      .map((i) => ({ i: i, slip: casc.longTermSlip[i.id], pe: casc.initiativeProjectedEnd[i.id] }))
      .filter((r) => r.slip != null && isFinite(r.slip) && r.slip > 0)
      .sort((a, b) => b.slip - a.slip).slice(0, 3)
      .map((r) => ({ name: r.i.name || r.i.id, due: 'Due ' + F.dayY(r.i.plannedEnd), slip: '+' + F.plural(Math.round(r.slip), 'day'), to: r.pe != null && isFinite(r.pe) ? 'Now ' + F.dayY(r.pe) : '' }));
    const models = PLAN.byOrder((P.models || []).filter((m) => { const p = PLAN.byId(P, 'product', m.productId); return p && p.divisionId === rec.id; })).map((m) => {
      const r = RD.sliceScore('model', m.id, P, em, null), cf = pedModelConf(D, m.id);
      return { name: PLAN.nameOf(PLAN.byId(P, 'product', m.productId)) + ', ' + m.name, rollup: 'Rollup ' + F.score(r), rollCls: 'strong tx-' + PLAN.tone(RD.band(r)), conf: 'Conformance ' + (cf != null ? Math.round(cf) + '%' : '—') };
    });
    return Object.assign(blank, {
      isDiv: true, title: rec.name || rec.id, sub: 'Division, ' + rec.id, badges: [badge(PLAN.word(RD.band(overall)), PLAN.tone(RD.band(overall)))],
      sum: [
        { k: 'Overall', v: F.score(overall) + ', ' + PLAN.word(RD.band(overall)).toLowerCase(), cls: 'strong tx-' + PLAN.tone(RD.band(overall)) },
        { k: 'Active now', v: F.plural(aObj, 'objective') + ', ' + F.plural(aMs, 'milestone'), cls: '' },
        { k: 'In the plan', v: F.plural(nObj, 'objective') + ', ' + F.plural(nMs, 'milestone'), cls: '' },
        { k: 'Status mix', v: c['on-track'] + ' on track, ' + c['at-risk'] + ' at risk, ' + c['off-track'] + ' off track, ' + c['no-band'] + ' no score', cls: '' },
        { k: 'Worst slip', v: worst == null ? '—' : worst <= 0 ? 'None' : '+' + F.plural(Math.round(worst), 'day'), cls: worst != null && worst > 0 ? 'tx-bad strong' : '' }
      ],
      delayed: delayed, hasDelayed: delayed.length > 0, noDelayed: !delayed.length,
      models: models, hasModels: models.length > 0
    });
  }
  return Object.assign(blank, { missing: true, title: 'Not found', canEdit: false });
}

/* today's unreachable slicesHtml: product / model conformance and objective rollups, overall and per quarter */
function povSlices(C, ctx) {
  const P = ctx.P, D = C.D, em = ctx.em;
  const qs = PLAN.quarters(P);
  const cell = (v, pct) => ({ v: v == null ? '—' : Math.round(v) + (pct ? '%' : ''), cls: 'num strong tx-' + PLAN.tone(RD.band(v)) });
  const rows = [];
  PLAN.byOrder((P.products || []).filter(ctx.prodShows)).forEach((p) => {
    const ms = (P.models || []).filter((m) => m.productId === p.id);
    const confs = ms.map((m) => pedModelConf(D, m.id)).filter((v) => v != null);
    const pc = confs.length ? confs.reduce((a, b) => a + b, 0) / confs.length : null;
    rows.push({ isProd: true, name: p.name || p.id, id: p.id, maturity: '', hasMaturity: false, conf: cell(pc, true), overall: cell(RD.sliceScore('product', p.id, P, em, null)), qs: qs.map((q) => cell(RD.sliceScore('product', p.id, P, em, q))) });
    PLAN.byOrder(ms).forEach((m) => {
      const meta = pedSpecMeta(D, m.id);
      rows.push({ isProd: false, name: m.name || m.id, id: m.id, maturity: meta.maturity || '', hasMaturity: !!meta.maturity, conf: cell(pedModelConf(D, m.id), true), overall: cell(RD.sliceScore('model', m.id, P, em, null)), qs: qs.map((q) => cell(RD.sliceScore('model', m.id, P, em, q))) });
    });
  });
  return { heads: qs.map((q) => ({ q: F.q(q) })), rows: rows, has: rows.length > 0, none: !rows.length };
}

MODS.pov = {
  state: {},
  vm(C, ctx) {
    const s = C.sheet();
    const detail = s && s.kind === 'pov.detail' ? povDetailVM(C, ctx, s) : null;
    if (ctx.tab !== 'overview') return { detail: detail };
    const P = ctx.P, em = ctx.em;
    const casc = ctx.casc();
    const comp = RD.rollupCompany(P, em);
    const ct = PLAN.tone(RD.band(comp));
    const divs = (P.divisions || []).filter(ctx.divShows);
    const unitOrder = (P.units || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
    const seen = unitOrder.map((u) => u.id);
    divs.forEach((d) => { const u = d.unitId || null; if (u && seen.indexOf(u) < 0) seen.push(u); });
    const units = [];
    const section = (uid, label) => {
      const dvs = divs.filter((d) => (d.unitId || null) === uid);
      if (!dvs.length) return;
      const us = uid == null ? null : RD.rollupUnit(uid, P, em);
      units.push({
        id: uid || 'unassigned', name: label, hasScore: uid != null, score: F.score(us), scoreCls: 'pov-uscore tx-' + PLAN.tone(RD.band(us)),
        stCls: 'st ' + F.tone(PLAN.tone(RD.band(us))), word: PLAN.word(RD.band(us)),
        divs: dvs.map((d) => povDivCard(C, ctx, d, casc))
      });
    };
    seen.forEach((uid) => { const u = PLAN.byId(P, 'unit', uid); section(uid, u ? u.name : uid); });
    section(null, 'Unassigned');
    const noDivs = !(P.divisions || []).length;
    const noMatch = !noDivs && !divs.length;
    const groups = noDivs ? [] : povActive(C, ctx, divs, casc);
    return {
      detail: detail,
      company: { score: F.score(comp), scoreCls: 'pov-hero-score tx-' + ct, stCls: 'st ' + F.tone(ct), word: PLAN.word(RD.band(comp)) },
      units: units, hasDivs: !noDivs && !noMatch, noDivs: noDivs, noMatch: noMatch,
      noMatchText: 'No divisions match the current filter (division ' + (ctx.f.div || 'any') + (ctx.f.unit ? ', unit ' + ctx.f.unit : '') + (ctx.f.prod ? ', product ' + ctx.f.prod : '') + '). The filter matches a division id such as DIV-FC, not its name.',
      qNow: F.q(ctx.qNow),
      groups: groups, hasGroups: groups.length > 0, noActive: !noDivs && !groups.some((g) => g.blocks.length),
      canAdd: !ctx.ro,
      addDiv: () => PED.open(C, ctx, 'division', null),
      goStructure: () => C.setState({ tab: 'structure', sheets: [], menu: '' }),
      slices: povSlices(C, ctx)
    };
  }
};

/* ================= module: pst (mods/pst/mod.js) */
/* ============================================================================
   pst: the Structure view. Hierarchy (Units, Divisions, Products with their
   models, Initiatives with their objectives and milestones) or the custom
   grouping chosen in the shared bar (objectives nested under the dimensions).
   Every add / edit / delete goes through PED; names open the lineage.
   ========================================================================== */
function pstEndBadge(ctx, o) {
  const es = ctx.objEnd(o);
  if (!es) return { hasEnd: false, endText: '', endCls: '', endTitle: '' };
  const ab = es.status === 'abandoned';
  return { hasEnd: true, endText: ab ? 'Abandoned' : 'Achieved', endCls: 'st ' + (ab ? 't-bad' : 't-ok'), endTitle: (ab ? 'Abandoned' : 'Achieved') + (es.endedDay != null ? ' ' + F.dayY(es.endedDay) : '') };
}
function pstXDiv(ctx, o) {
  const P = ctx.P;
  if (!o || !o.initiativeId || !o.divisionId) return { hasX: false, xText: '', xTitle: '' };
  const i = PLAN.byId(P, 'initiative', o.initiativeId);
  if (!i || !i.divisionId || i.divisionId === o.divisionId) return { hasX: false, xText: '', xTitle: '' };
  const dn = PLAN.nameOf(PLAN.byId(P, 'division', o.divisionId));
  const idn = PLAN.nameOf(PLAN.byId(P, 'division', i.divisionId));
  return { hasX: true, xText: 'Executed in ' + dn, xTitle: 'Executed in ' + dn + '. This objective’s key results and stage-gates live in that division’s execution bin, while its initiative sits in ' + idn + '.' };
}
/* the "…" menu of one row */
function pstMenu(C, ctx, ent, rec) {
  const id = rec.id;
  const mid = 'pst:' + ent + ':' + id;
  const open = C.isMenu(mid);
  const items = [];
  const btn = (label, fn, bad) => items.push({ label: label, isLink: false, cls: bad ? 'mi bad' : 'mi', fn: () => { C.closeMenus(); fn(); }, href: '', go: null });
  const link = (label, href, go) => items.push({ label: label, isLink: true, cls: 'mi', fn: null, href: href, go: () => { C.closeMenus(); go(); } });
  if (!ctx.ro) btn('Edit', () => PED.open(C, ctx, ent, id));
  if (!ctx.ro) {
    if (ent === 'division') { btn('Add initiative', () => PED.open(C, ctx, 'initiative', null, { parentId: id })); btn('Add product', () => PED.open(C, ctx, 'product', null, { parentId: id })); }
    if (ent === 'product') btn('Add model', () => PED.open(C, ctx, 'model', null, { parentId: id }));
    if (ent === 'initiative') { btn('Add objective', () => PED.open(C, ctx, 'objective', null, { parentId: id })); btn('Add milestone', () => PED.open(C, ctx, 'milestone', null, { parentId: id })); }
    if (ent === 'milestone') {
      const st = PLAN.msState(ctx.P, id);
      const paused = !!(st && (st.status === 'paused' || st.status === 'deprioritized'));
      if (paused) btn('Resume', () => PED.milestoneStatus(C, ctx, id, 'active'));
      else { btn('Pause', () => PED.milestoneStatus(C, ctx, id, 'paused')); btn('Deprioritize', () => PED.milestoneStatus(C, ctx, id, 'deprioritized')); }
      if (rec.completedDate == null) btn('Mark achieved', () => PED.milestoneStatus(C, ctx, id, 'achieved'));
      else btn('Reopen milestone', () => PED.milestoneStatus(C, ctx, id, 'open'));
    }
  }
  if (ent === 'objective') {
    const app = ctx.appOf(rec.divisionId);
    link(app === 'sales' ? 'Open in Sales' : 'Open in Execution', app === 'sales' ? 'sales_app.html' : 'execution_app.html', () => C.handoff({ app: app, objective: id }));
  }
  if (ent === 'model') link('Open in Product spec', 'product_designer.html', () => C.handoff({ app: 'spec', model: id }));
  btn('Show lineage', () => PED.lineage(C, ctx, ent, id));
  if (!ctx.ro) btn('Delete', () => PED.del(C, ctx, ent, id), true);
  return {
    menuOpen: open, menuExp: open ? 'true' : 'false', menuWrap: open ? 'anchor above' : 'anchor',
    menuLabel: 'More actions for ' + PLAN.nameOf(rec), toggleMenu: () => C.toggleMenu(mid), items: items
  };
}
function pstBandCell(b) { return { stCls: 'st ' + F.tone(PLAN.tone(b)), stWord: PLAN.word(b) }; }

function pstHier(C, ctx) {
  const P = ctx.P, f = ctx.f, D = C.D;
  const lineage = (ent, id) => () => PED.lineage(C, ctx, ent, id);
  const col = C.state.pst_col || {};
  const tog = (key, name, kids) => {
    const open = !col[key];
    return {
      hasToggle: kids, noToggle: !kids, open: open ? 'true' : 'false',
      toggleLabel: (open ? 'Collapse ' : 'Expand ') + name,
      toggle: () => C.setState({ pst_col: Object.assign({}, C.state.pst_col, { [key]: !(C.state.pst_col || {})[key] }) }),
      isOpen: open
    };
  };
  const all = (prefix, ids, closed) => () => {
    const next = Object.assign({}, C.state.pst_col);
    ids.forEach((id) => { next[prefix + id] = closed; });
    C.setState({ pst_col: next });
  };
  /* units: not filtered */
  const units = PLAN.byOrder(P.units || []).map((u) => Object.assign({
    id: u.id, name: u.name || u.id, order: PLAN.ord(u) === 1e9 ? '—' : String(u.order),
    nDivs: String((P.divisions || []).filter((d) => (d.unitId || null) === u.id).length),
    lineage: lineage('unit', u.id)
  }, pstMenu(C, ctx, 'unit', u)));
  /* divisions: unit + division filters */
  const divs = PLAN.byOrder((P.divisions || []).filter(ctx.divShows)).map((d) => {
    const u = PLAN.byId(P, 'unit', d.unitId);
    const sc = RD.rollupDivision(d.id, P, ctx.em);
    return Object.assign({
      id: d.id, name: d.name || d.id, unit: u ? u.name : (d.unitId ? d.unitId : 'Unassigned'),
      kind: RD.divisionKind(d) === 'biz' ? 'Business' : 'R&D', order: PLAN.ord(d) === 1e9 ? '—' : String(d.order),
      score: F.score(sc), scoreCls: 'num strong tx-' + PLAN.tone(RD.band(sc)),
      lineage: lineage('division', d.id)
    }, pstMenu(C, ctx, 'division', d));
  });
  /* products and their models: unit, division and product filters */
  const prows = [];
  const prodList = PLAN.byOrder((P.products || []).filter(ctx.prodShows));
  prodList.forEach((p) => {
    const dv = PLAN.byId(P, 'division', p.divisionId);
    const models = PLAN.byOrder((P.models || []).filter((m) => m.productId === p.id));
    const t = tog('p:' + p.id, p.name || p.id, models.length > 0);
    prows.push(Object.assign({
      isProd: true, isModel: false, id: p.id, name: p.name || p.id, cls: 'pst-prow',
      div: dv ? dv.name : 'No division', code: p.code || '—', order: PLAN.ord(p) === 1e9 ? '—' : String(p.order),
      lineage: lineage('product', p.id), conf: '', hasConf: false, confCls: ''
    }, t, pstMenu(C, ctx, 'product', p)));
    if (!t.isOpen) return;
    models.forEach((m) => {
      const conf = pedModelConf(D, m.id);
      prows.push(Object.assign({
        isProd: false, isModel: true, id: m.id, name: m.name || m.id, cls: 'pst-crow',
        div: '', code: '', order: PLAN.ord(m) === 1e9 ? '—' : String(m.order),
        lineage: lineage('model', m.id),
        hasConf: conf != null, conf: conf != null ? Math.round(conf) + '% conformance' : '', confCls: 'sub tx-' + PLAN.tone(RD.band(conf))
      }, pstMenu(C, ctx, 'model', m)));
    });
  });
  /* initiatives with objectives (filtered) and milestones (never filtered) */
  const objsOf = (i) => {
    let os = (P.objectives || []).filter((o) => o.initiativeId === i.id);
    if (ctx.anyFilter) os = os.filter(ctx.objMatch);
    return PLAN.byOrder(os);
  };
  /* today's table rule (structInitShows), except that an initiative with no objectives falls back to
     its own classification under a product filter (initOwnMatches) instead of disappearing */
  const initShows = (i) => {
    if (f.unit && (RD.unitIdOfDivision(i.divisionId, P) || '') !== f.unit) return false;
    if (f.div && i.divisionId !== f.div) return false;
    if (f.prod || f.q || f.status) {
      const hasObjs = (P.objectives || []).some((o) => o.initiativeId === i.id);
      return hasObjs ? objsOf(i).length > 0 : ctx.initMatch(i);
    }
    return true;
  };
  const irows = [];
  const initList = PLAN.byOrder((P.initiatives || []).filter(initShows));
  initList.forEach((i) => {
    const dv = PLAN.byId(P, 'division', i.divisionId);
    const sc = RD.rollupInitiative(i.id, P, ctx.em);
    const b = RD.band(sc);
    const kids = objsOf(i).length + (P.milestones || []).filter((m) => m.initiativeId === i.id).length;
    const t = tog('i:' + i.id, i.name || i.id, kids > 0);
    irows.push(Object.assign({
      isInit: true, isObj: false, isMs: false, id: i.id, name: i.name || i.id, cls: 'pst-prow',
      div: dv ? dv.name : 'No division',
      when: i.plannedStart != null || i.plannedEnd != null ? F.dayAuto(i.plannedStart, ctx.today) + ' to ' + F.dayAuto(i.plannedEnd, ctx.today) : '—',
      hasScore: sc != null, score: F.score(sc), scoreCls: 'num strong tx-' + PLAN.tone(b),
      lineage: lineage('initiative', i.id),
      dmdCls: '', hasEnd: false, endText: '', endCls: '', endTitle: '', hasX: false, xText: '', xTitle: ''
    }, pstBandCell(b), t, pstMenu(C, ctx, 'initiative', i)));
    if (!t.isOpen) return;
    objsOf(i).forEach((o) => {
      const ob = ctx.objBand(o.id);
      irows.push(Object.assign({
        isInit: false, isObj: true, isMs: false, id: o.id, name: o.statement || o.id, cls: 'pst-crow',
        div: '', when: o.quarter ? F.q(o.quarter) : 'No quarter', hasScore: false, score: '', scoreCls: '',
        lineage: lineage('objective', o.id), dmdCls: ''
      }, pstBandCell(ob), pstEndBadge(ctx, o), pstXDiv(ctx, o), pstMenu(C, ctx, 'objective', o)));
    });
    PLAN.byOrder((P.milestones || []).filter((m) => m.initiativeId === i.id)).forEach((m) => {
      const st = PLAN.msState(P, m.id);
      const done = RD.milestoneAchieved(m, ctx.em);
      const paused = !done && !!(st && (st.status === 'paused' || st.status === 'deprioritized'));
      const mb = ctx.msBand(m.id);
      const cell = done ? { stCls: 'st t-ok', stWord: 'Achieved' } : paused ? { stCls: 'st t-none', stWord: st.status === 'paused' ? 'Paused' : 'Deprioritized' } : pstBandCell(mb);
      irows.push(Object.assign({
        isInit: false, isObj: false, isMs: true, id: m.id, name: m.name || m.id, cls: 'pst-crow' + (paused ? ' pst-dim' : ''),
        div: '', when: m.plannedDate != null ? F.dayAuto(m.plannedDate, ctx.today) : 'No date', hasScore: false, score: '', scoreCls: '',
        lineage: lineage('milestone', m.id), dmdCls: 'ped-dmd ' + F.tone(paused ? 'none' : PLAN.tone(mb)),
        hasEnd: false, endText: '', endCls: '', endTitle: '', hasX: false, xText: '', xTitle: ''
      }, cell, pstMenu(C, ctx, 'milestone', m)));
    });
  });
  const canEdit = !ctx.ro;
  const nPaused = RD.pausedMilestoneIds(P.milestoneState, P.milestones || []).length;
  const prodIds = prodList.filter((p) => (P.models || []).some((m) => m.productId === p.id)).map((p) => p.id);
  const initIds = initList.map((i) => i.id);
  const prodAllClosed = prodIds.length > 0 && prodIds.every((id) => col['p:' + id]);
  const initAllClosed = initIds.length > 0 && initIds.every((id) => col['i:' + id]);
  return {
    canEdit: canEdit,

    prodFold: prodAllClosed ? 'Expand all' : 'Collapse all',
    prodFoldGo: all('p:', prodIds, !prodAllClosed),
    canFoldProds: prodIds.length > 0,
    initFold: initAllClosed ? 'Expand all' : 'Collapse all',
    initFoldGo: all('i:', initIds, !initAllClosed),
    canFoldInits: initIds.length > 0,
    units: units, hasUnits: units.length > 0, noUnits: !units.length,
    addUnit: () => PED.open(C, ctx, 'unit', null),
    divs: divs, hasDivs: divs.length > 0, noDivs: !divs.length,
    divEmpty: (P.divisions || []).length ? 'No divisions match the filter.' : 'No divisions yet. Add one to start the plan.',
    addDiv: () => PED.open(C, ctx, 'division', null),
    prods: prows, hasProds: prows.length > 0, noProds: !prows.length,
    prodEmpty: ctx.anyFilter ? 'No products match the filter.' : 'No products yet. Products sit in a division and hold its models.',
    addProd: () => PED.open(C, ctx, 'product', null),
    inits: irows, hasInits: irows.length > 0, noInits: !irows.length,
    initEmpty: ctx.anyFilter ? 'No initiatives match the filter.' : 'No initiatives yet. An initiative holds a division’s objectives and milestones.',
    addInit: () => PED.open(C, ctx, 'initiative', null)
