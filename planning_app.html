<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R&amp;D Planning</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* ============================================================================
   Calm kit: shared tokens and components for the four calm prototypes.
   Light is the default; [data-theme="dark"] on .cw switches every token.
   Module CSS must use these variables (never raw hex) so dark mode keeps working.
   ========================================================================== */
body{margin:0}
.cw{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F9FB; --surface-3:#FBFCFD; --hover:#F2F5F9; --press:#E9EDF2;
  --line:#E1E5EB; --line-2:#E8ECF1; --line-3:#EEF1F4; --field:#D3D9E1; --field-hover:#B9C2CE;
  --ink:#17202C; --ink-2:#3A4656; --muted:#5B6878; --faint:#8C97A5; --ghost:#B9C2CE;
  --accent:#2B57B5; --accent-ink:#1F4590; --accent-soft:#EAF0FB; --accent-line:#B7C8EC; --accent-ring:rgba(43,87,181,.18); --accent-wash:#F6F8FD;
  --ok:#12784A; --ok-ink:#0E6640; --ok-soft:#E6F3EC; --ok-line:#B9DCC9;
  --warn:#C98A16; --warn-ink:#8A5D07; --warn-soft:#FBF3E1; --warn-line:#EBD3A2;
  --bad:#B4352A; --bad-ink:#9A2C22; --bad-soft:#FBECEA; --bad-line:#EBC0BA;
  --none:#C7CFD9; --track:#E6EAF0; --info-soft:#EEF2F7;
  --pri:#17202C; --pri-hover:#2C3848; --pri-ink:#FFFFFF;
  --shadow-1:0 1px 2px rgba(23,32,44,.06); --shadow-pop:0 12px 32px rgba(23,32,44,.14); --shadow-sheet:-18px 0 48px rgba(23,32,44,.16);
  --scrim:rgba(23,32,44,.28);
  font-family:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink); background:var(--bg); font-size:14px; line-height:1.45;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  color-scheme:light;
  min-height:100vh; display:flex; flex-direction:column;
}
.cw[data-theme="dark"]{
  --bg:#0F141A; --surface:#161C24; --surface-2:#1B222B; --surface-3:#19202A; --hover:#202833; --press:#27303C;
  --line:#2A333F; --line-2:#252E39; --line-3:#222A34; --field:#3A4554; --field-hover:#4C5868;
  --ink:#E6EBF1; --ink-2:#C5CEDA; --muted:#9AA6B4; --faint:#717D8C; --ghost:#55606E;
  --accent:#86A8F2; --accent-ink:#AEC5F7; --accent-soft:#1D2840; --accent-line:#3A5180; --accent-ring:rgba(134,168,242,.25); --accent-wash:#18213A;
  --ok:#4DBE88; --ok-ink:#7FD4AA; --ok-soft:#14291F; --ok-line:#2A5A43;
  --warn:#E0AC4C; --warn-ink:#EBC47A; --warn-soft:#2B2213; --warn-line:#5E4A22;
  --bad:#EC7A6E; --bad-ink:#F2A097; --bad-soft:#2E1816; --bad-line:#6A322C;
  --none:#4A5564; --track:#2A333F; --info-soft:#1E2631;
  --pri:#E6EBF1; --pri-hover:#C9D2DD; --pri-ink:#10161D;
  --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-pop:0 14px 36px rgba(0,0,0,.5); --shadow-sheet:-18px 0 48px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}
.cw *{box-sizing:border-box}
.cw :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cw a{color:var(--accent);text-decoration:none}
.cw a:hover{color:var(--accent-ink)}
.cw svg{flex:none}
.cw h1,.cw h2,.cw h3{margin:0;font-weight:600;letter-spacing:-.005em}

/* ---------- app frame ---------- */
.app{display:flex;align-items:stretch;flex:1 0 auto}
.side{flex:0 0 252px;width:252px;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:18px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center}
.brand-name{display:flex;flex-direction:column;line-height:1.15}
.brand-name b{font-weight:700;font-size:15px}
.nav{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;color:var(--ink-2);font-weight:500}
.cw a.nav{color:var(--ink-2)}
.cw a.nav:hover,.nav:hover{background:var(--hover);color:var(--ink)}
.cw a.nav.on,.nav.on{background:var(--accent-soft);color:var(--accent-ink)}
button.nav{width:100%;border:0;background:transparent;font:inherit;text-align:left;cursor:pointer}
.side-sec{display:flex;flex-direction:column;gap:4px}
.grp{font-size:12px;font-weight:600;color:var(--muted);padding:0 10px}
.grp.gap{margin-top:12px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px 2px;border-top:1px solid var(--line-2)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.avatar.sm{width:22px;height:22px;font-size:10.5px}
.avatar.xs{width:18px;height:18px;font-size:9.5px}
.main{flex:1 1 640px;min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;min-height:60px;padding:10px 32px;border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:5}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted);font-weight:500;min-width:0}
.crumb .sep{color:var(--ghost)}
.page{display:flex;flex-direction:column;gap:20px;padding:24px 32px 64px;min-width:0}
.search{display:flex;align-items:center;gap:8px;height:36px;width:320px;max-width:100%;padding:0 12px;border:1px solid var(--field);border-radius:8px;background:var(--surface);color:var(--faint)}
.search input{border:0;outline:0;flex:1;min-width:0;font:inherit;color:var(--ink);background:transparent}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.saveind{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap}

/* ---------- objective list (sidebar) ---------- */
.obj{display:flex;align-items:flex-start;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--ink);font:inherit;line-height:1.35;text-align:left;cursor:pointer}
.obj:hover{background:var(--hover)}
.obj.on{background:var(--accent-soft)}
.obj .s{margin-left:auto;padding-left:6px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.obj .dot{margin-top:6px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--field);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover);border-color:var(--field-hover)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:default}
.btn.q{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.q:hover{background:var(--press);color:var(--ink)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.pri:hover{background:var(--pri-hover);border-color:var(--pri-hover)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
.cw[data-theme="dark"] .btn.acc{color:#10161D}
.btn.danger{color:var(--bad-ink);border-color:var(--bad-line);background:var(--surface)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#FFFFFF}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:7px}
.btn.xs{height:26px;padding:0 8px;font-size:12.5px;border-radius:6px;gap:5px}
.btn.ic{width:36px;padding:0}
.btn.sm.ic{width:30px}
.btn.xs.ic{width:26px}
.btn.full{width:100%}
.lnk{display:inline;padding:0;border:0;background:transparent;color:var(--accent);font:inherit;font-weight:500;text-align:left;cursor:pointer}
.lnk:hover{color:var(--accent-ink);text-decoration:underline}
.lnk.ink{color:var(--ink)}
.lnk.ink:hover{color:var(--accent-ink)}
.lnk.muted{color:var(--muted)}
.lnk.bad{color:var(--bad-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:500;white-space:nowrap;cursor:pointer}
.chip:hover{border-color:var(--field-hover);color:var(--ink)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.chip.static{cursor:default}
.handle{display:inline-grid;place-items:center;width:18px;height:24px;color:var(--ghost);cursor:grab;flex:none}
.handle:hover{color:var(--muted)}

/* ---------- status ---------- */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:var(--none)}
.dot.lg{width:10px;height:10px}
.t-ok .dot,.dot.t-ok{background:var(--ok)}
.t-warn .dot,.dot.t-warn{background:var(--warn)}
.t-bad .dot,.dot.t-bad{background:var(--bad)}
.t-info .dot,.dot.t-info{background:var(--accent)}
.t-none .dot,.dot.t-none{background:var(--none)}
.st{display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:13px;white-space:nowrap}
.tx-ok{color:var(--ok-ink)} .tx-warn{color:var(--warn-ink)} .tx-bad{color:var(--bad-ink)} .tx-info{color:var(--accent-ink)} .tx-none{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;padding:2px 9px;border-radius:6px;white-space:nowrap;background:var(--info-soft);color:var(--ink-2)}
.pill.t-ok{background:var(--ok-soft);color:var(--ok-ink)}
.pill.t-warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.t-bad{background:var(--bad-soft);color:var(--bad-ink)}
.pill.t-info{background:var(--accent-soft);color:var(--accent-ink)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted);font-size:11.5px;font-weight:600;white-space:nowrap}
.tid{font-size:12px;font-weight:600;color:var(--faint)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#FFFFFF;font-size:11.5px;font-weight:600}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel.flat{border-radius:10px}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 20px}
.ph .act{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.h1{font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.h2{font-size:16px;font-weight:600}
.h3{font-size:14px;font-weight:600}
.cnt{font-size:12px;color:var(--faint);font-weight:600}
.pb{padding:16px 20px}
.sec{border-top:1px solid var(--line-2)}
.li{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line-3);min-width:0}
.li:first-child{border-top:0}
.empty{padding:18px 20px;color:var(--muted)}
.sec>.empty,.ph+.empty{border-top:1px solid var(--line-2)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2);font-size:13.5px}
.note.t-warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn-ink)}
.note.t-bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad-ink)}
.note.t-ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok-ink)}
.note.t-info{background:var(--accent-wash);border-color:var(--accent-line);color:var(--accent-ink)}
.sub{color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.strong{font-weight:600}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row.wrap{flex-wrap:wrap}
.row.top{align-items:flex-start}
.row.g4{gap:4px}.row.g12{gap:12px}.row.g16{gap:16px}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.col.g2{gap:2px}.col.g10{gap:10px}.col.g16{gap:16px}
.grow{flex:1 1 auto;min-width:0}
.push{margin-left:auto}
.hide{display:none}

/* ---------- tabs and segmented controls ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:24px;border-bottom:1px solid var(--line);padding:0 2px}
.tab{height:44px;display:inline-flex;align-items:center;gap:6px;padding:0;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font:inherit;font-weight:500;white-space:nowrap;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;padding:3px;gap:2px;border-radius:9px;background:var(--press)}
.seg button{height:28px;padding:0 11px;border:0;border-radius:7px;background:transparent;font:inherit;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.seg button:disabled{cursor:default;opacity:.5}

/* ---------- forms ---------- */
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
.fld>.lab{display:flex;align-items:center;gap:6px}
.fld .hint{font-weight:400;color:var(--faint)}
.in,.ta,.sel{height:36px;padding:0 10px;border:1px solid var(--field);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:400;min-width:0}
.ta{height:auto;min-height:76px;padding:8px 10px;line-height:1.45;resize:vertical}
.sel{padding-right:6px;cursor:pointer}
.in:hover,.ta:hover,.sel:hover{border-color:var(--field-hover)}
.in:focus,.ta:focus,.sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.in.sm,.sel.sm{height:30px;font-size:13px;padding:0 8px}
.in.bad,.ta.bad,.sel.bad{border-color:var(--bad)}
.in:disabled,.ta:disabled,.sel:disabled{opacity:.6;cursor:default}
.in.num{text-align:right}
.cb{width:16px;height:16px;margin:0;accent-color:var(--accent);flex:none;cursor:pointer}
.cw input[type=range]{accent-color:var(--accent)}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);font-weight:400;cursor:pointer}
.frm{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:14px 20px;border-top:1px solid var(--line-2);background:var(--surface-3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.err{color:var(--bad-ink);font-size:12.5px;font-weight:500}
.okn{color:var(--ok-ink);font-size:12.5px;font-weight:500}
.hint{color:var(--faint);font-size:12.5px}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:500;font-size:12.5px;color:var(--muted);background:var(--surface-2);padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:9px 12px;border-top:1px solid var(--line-3);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.hov:hover td{background:var(--surface-3)}
.tbl tr.sel td{background:var(--accent-wash)}
.tbox{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}

/* ---------- bars and meters ---------- */
.track{position:relative;display:block;height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.track.sm{height:6px}
.track.lg{height:10px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent);transition:width .25s ease}
.fill.t-ok{background:var(--ok)} .fill.t-warn{background:var(--warn)} .fill.t-bad{background:var(--bad)} .fill.t-none{background:var(--none)}
.hatch{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--warn) 0 3px,transparent 3px 6px);opacity:.55}
.hatch.t-bad{background:repeating-linear-gradient(135deg,var(--bad) 0 3px,transparent 3px 6px)}
.hatch.t-ok{background:repeating-linear-gradient(135deg,var(--ok) 0 3px,transparent 3px 6px)}
.tick{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--ink)}
.meter{display:flex;flex-direction:column;gap:6px;min-width:0}

/* ---------- menus and popovers ---------- */
.scrim{position:fixed;inset:0;z-index:25;border:0;margin:0;padding:0;background:transparent;cursor:default}
.above{position:relative;z-index:31}
.anchor{position:relative}
.menu{position:absolute;z-index:32;display:flex;flex-direction:column;gap:2px;min-width:200px;max-height:420px;overflow:auto;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-pop)}
.menu.r{right:0}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:6px 10px;border:0;border-radius:7px;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;text-align:left;cursor:pointer;white-space:nowrap}
.mi:hover{background:var(--hover)}
.mi.on{background:var(--accent-soft);color:var(--accent-ink)}
.mi.bad{color:var(--bad-ink)}
.mi:disabled{opacity:.5;cursor:default}
.mi .sub{margin-left:auto;padding-left:12px}
.mh{padding:6px 10px 2px;font-size:12px;font-weight:600;color:var(--muted)}
.msep{height:1px;margin:4px 6px;background:var(--line-2)}
.pop{position:absolute;z-index:32;width:340px;max-width:calc(100vw - 32px);display:flex;flex-direction:column;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-pop);color:var(--ink);font-size:13.5px;text-align:left;font-weight:400}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;font-size:13px;align-items:baseline}
.kv>.k{color:var(--muted)}

/* ---------- sheets (right-hand editors) and dialogs ---------- */
.sheet-scrim{position:fixed;inset:0;z-index:40;border:0;margin:0;padding:0;background:var(--scrim);cursor:default}
.sheet{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(600px,100%);display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-sheet)}
.sheet.wide{width:min(860px,100%)}
.sh-head{display:flex;align-items:flex-start;gap:12px;padding:18px 22px 14px;border-bottom:1px solid var(--line-2)}
.sh-title{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.sh-title h2{font-size:18px;font-weight:600;line-height:1.3}
.sh-body{flex:1;overflow:auto;padding:18px 22px 28px;display:flex;flex-direction:column;gap:18px}
.sh-sec{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid var(--line-2)}
.sh-sec:first-child{padding-top:0;border-top:0}
.sh-sec>h3{font-size:14px;font-weight:600}
.sh-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 22px;border-top:1px solid var(--line-2);background:var(--surface-3)}
.sh-foot .push{margin-left:auto}
.dlg-scrim{position:fixed;inset:0;z-index:60;border:0;margin:0;padding:0;background:var(--scrim);cursor:default}
.dlg{position:fixed;z-index:61;left:50%;top:22%;transform:translateX(-50%);width:min(460px,calc(100% - 32px));display:flex;flex-direction:column;gap:14px;padding:20px 22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-pop)}
.dlg h2{font-size:17px}
.dlg .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}

/* ---------- toasts and banners ---------- */
.toasts{position:fixed;z-index:70;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:560px;padding:10px 14px;border-radius:10px;background:var(--pri);color:var(--pri-ink);font-size:13.5px;box-shadow:var(--shadow-pop);pointer-events:auto}
.toast.err{background:var(--bad);color:#FFFFFF}
.toast.info{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.toast .x{margin-left:6px;padding:0;border:0;background:transparent;color:inherit;opacity:.7;cursor:pointer;font:inherit}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 32px;border-bottom:1px solid var(--line);font-size:13.5px}
.banner.t-warn{background:var(--warn-soft);color:var(--warn-ink);border-color:var(--warn-line)}
.banner.t-bad{background:var(--bad-soft);color:var(--bad-ink);border-color:var(--bad-line)}
.banner.t-info{background:var(--accent-wash);color:var(--accent-ink);border-color:var(--accent-line)}

/* ---------- facts strip ---------- */
.facts{display:flex;flex-wrap:wrap;gap:14px 0}
.fact{display:flex;flex-direction:column;gap:2px;padding:0 22px;border-left:1px solid var(--line-2);min-width:0}
.fact:first-child{padding-left:0;border-left:0}
.fv{font-weight:600;font-size:15px}

/* ---------- drag feedback ---------- */
.dz{transition:background .12s ease,box-shadow .12s ease}
.dz.hot{background:var(--accent-wash);box-shadow:inset 0 0 0 2px var(--accent-line)}
.lift{opacity:.45}
.dim{opacity:.4}

.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--none);border-top-color:var(--muted);animation:cwspin .8s linear infinite;flex:none}
@keyframes cwspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}.fill,.dz{transition:none}}
@media (max-width: 900px){
  .side{display:none}
  .top,.page{padding-left:16px;padding-right:16px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
}

/* ---- apps/plan/shell.css */
/* Planning shell styles (pl-*). Tokens only, so dark mode keeps working. */
.pl-page{width:100%;max-width:1360px}
.pl-page.wide{max-width:none}
.pl-now{color:var(--ink)}
.cw a.nav.pl-hub{color:var(--muted);font-size:13px}
.pl-present{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:10px 12px 0}

/* shared filter and group-by bar */
.pl-fbar{display:flex;flex-direction:column;gap:10px;padding:12px 16px}
.pl-fb-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 20px}
.pl-fb-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;min-width:0}
.pl-fb-lab{font-size:12.5px;font-weight:500;color:var(--muted)}
.pl-chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pl-chev{color:var(--ghost)}
.pl-lvl{display:inline-flex;align-items:center;gap:2px}
.pl-add{color:var(--muted)}
.pl-fb-sels{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-left:auto}
.pl-fb-f{min-width:130px}
.pl-fb-f .sel{width:100%}
.pl-fb-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:10px;border-top:1px solid var(--line-2)}
.pl-chip{gap:4px;padding-right:4px}
.pl-chip-x{display:inline-grid;place-items:center;width:18px;height:18px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer}
.pl-chip-x:hover{background:var(--press);color:var(--ink)}
.pl-ovf{align-items:center;flex-wrap:wrap;gap:8px}

/* settings */
.pl-tokrow{align-items:flex-end}
.pl-url{padding:9px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;line-height:1.5;word-break:break-all}
/* "View only" banner for people who can't change the plan */
.pl-lock{gap:8px}
.pl-lock svg{flex:none}
/* live builds: the link to the full page (signed out inside a Confluence embed) and the broker banner */
.pl-lock .pl-full{white-space:nowrap}
.pl-load svg,.pl-load .spin{flex:none}

/* ---- mods/pov/mod.css */
/* pov: Overview (tokens only) */
.pov-hero{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:18px 22px}
.pov-hero-score{font-size:44px;font-weight:650;line-height:1;letter-spacing:-.02em;min-width:64px}
.pov-unit{display:flex;flex-direction:column;gap:12px}
.pov-unit-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.pov-uscore{font-size:20px;font-weight:650}
.pov-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pov-card{display:flex;flex-direction:column;gap:10px;padding:16px 18px;cursor:pointer;text-align:left}
.pov-card:hover{border-color:var(--field-hover);box-shadow:var(--shadow-1)}
.pov-card-score{align-items:flex-end;text-align:right}
.pov-big{font-size:30px;font-weight:650;line-height:1;letter-spacing:-.02em}
.pov-qs{gap:4px 12px}
.pov-q{white-space:nowrap}
.pov-mix{gap:4px 14px}
.pov-active{display:flex;flex-direction:column;gap:14px}
.pov-div{display:flex;flex-direction:column;gap:12px}
.pov-div-lab{display:flex;align-items:center;gap:12px}
.pov-rule{flex:1;height:1px;background:var(--line)}
.pov-block{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface-3)}
.pov-plab{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.pov-kid{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
.pov-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:10px}
.pov-tile{position:relative;display:flex;flex-direction:column;gap:8px;padding:14px 14px 14px 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;overflow:hidden;min-width:0}
.pov-tile:hover{border-color:var(--field-hover);box-shadow:var(--shadow-1)}
.pov-bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--none)}
.pov-bar.t-ok{background:var(--ok)} .pov-bar.t-warn{background:var(--warn)} .pov-bar.t-bad{background:var(--bad)}
.pov-score{font-size:20px;font-weight:650;line-height:1.1;white-space:nowrap}
.pov-conf{font-size:20px;font-weight:650;line-height:1.1;white-space:nowrap}
.pov-mat{align-self:flex-start;margin-top:2px}
.pov-kt{display:flex;flex-direction:column;gap:3px;font-size:12.5px;min-width:0}
.pov-kh{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:8px;color:var(--faint);font-size:11.5px;font-weight:600}
.pov-kh span:nth-child(3),.pov-kh span:nth-child(4){text-align:right}
.pov-kr4{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.pov-kr{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.pov-ktgt{color:var(--muted);white-space:nowrap;text-align:right}
.pov-kcur{font-weight:600;white-space:nowrap;text-align:right}
.pov-lane{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.pov-ws{display:inline-grid;place-items:center;width:18px;height:18px;margin-right:2px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted);font-size:11px;font-weight:700}
.pov-gd{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--none);background:var(--surface);color:var(--muted);font-size:10.5px;font-weight:700;flex:none}
.pov-gd.t-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-ink)}
.pov-gd.t-warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn-ink)}
.pov-gd.t-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad-ink)}
.pov-gset{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:4px}
.pov-grow{padding:6px 0;border-top:1px solid var(--line-3)}
.pov-gdate{min-width:56px;text-align:right}
.pov-rpn{display:inline-block;min-width:34px;padding:1px 6px;border-radius:6px;text-align:center;font-weight:600;background:var(--ok-soft);color:var(--ok-ink)}
.pov-rpn.t-warn{background:var(--warn-soft);color:var(--warn-ink)}
.pov-rpn.t-bad{background:var(--bad-soft);color:var(--bad-ink)}
.pov-slices{overflow-x:auto}
.pov-sind{padding-left:18px}

/* ---- mods/pst/mod.css */
/* pst: Structure tables and the grouped tree (tokens only) */
.pst-tbl td{padding-top:8px;padding-bottom:8px}
.pst-tbl th.pst-act,.pst-tbl td.pst-act{width:44px;text-align:right;padding-left:4px;padding-right:12px}
.pst-tbl tr.pst-prow td{background:var(--surface)}
.pst-tbl tr.pst-crow td{border-top-color:var(--line-3)}
.pst-ind{padding-left:34px}
.pst-dim td{opacity:.6}
.pst-menu{top:30px;min-width:220px}
.pst-tree{display:flex;flex-direction:column}
.pst-grp{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:42px;padding-right:16px;border-top:1px solid var(--line-2);background:var(--surface-2)}
.pst-glab{min-width:0}
.pst-orow{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 16px 6px 0;border-top:1px solid var(--line-3)}
.pst-orow .dot{margin-left:30px}
.pst-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- mods/ped/mod.css */
/* ped: editor, targets, lineage, delete (tokens only) */
.ped-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.ped-f{position:relative;display:flex;flex-direction:column;gap:5px;min-width:0}
.ped-f.wide{grid-column:1 / -1}
.ped-f .in,.ped-f .sel,.ped-f .ta{width:100%}
.ped-ftag{position:absolute;top:-1px;right:0}
.ped-checks{display:flex;flex-direction:column;gap:6px;margin:0;padding:8px 12px 10px;border:1px solid var(--line-2);border-radius:10px;max-height:228px;overflow:auto;min-width:0}
.ped-checks legend{padding:0 4px}
.ped-check{align-items:flex-start;padding:2px 0}
.ped-check .cb{margin-top:2px}
.ped-trow{padding:10px 12px;border-top:1px solid var(--line-3)}
.ped-trow:first-child{border-top:0}
.ped-trow-main{align-items:center}
.ped-trow-sub{padding-left:20px;margin-top:4px}
.ped-curbtn{display:inline-flex;align-items:center;min-height:28px;padding:2px 9px;border:1px dashed var(--field);border-radius:7px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.ped-curbtn:hover{border-color:var(--accent-line);background:var(--accent-wash)}
.ped-cur{font-weight:500;white-space:nowrap}
.ped-rv{width:110px}
.ped-dmd{display:inline-block;width:9px;height:9px;margin:0 2px;transform:rotate(45deg);border-radius:1.5px;background:var(--none);flex:none}
.ped-dmd.t-ok{background:var(--ok)}
.ped-dmd.t-warn{background:var(--warn)}
.ped-dmd.t-bad{background:var(--bad)}
.ped-msrow{padding:8px 2px;border-top:1px solid var(--line-3)}
.ped-pause{align-items:flex-end}
.ped-crumb{font-size:13px}
.ped-tree{display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.ped-lrow{display:flex;align-items:center;gap:8px;min-height:34px;padding-right:12px;border-top:1px solid var(--line-3);min-width:0;font-size:13.5px}
.ped-lrow:first-child{border-top:0}
.ped-lname{min-width:0;font-weight:500}
.ped-chev{display:grid;place-items:center;width:22px;height:22px;flex:none;padding:0;border:0;border-radius:5px;background:transparent;color:var(--faint);cursor:pointer}
.ped-chev:hover{background:var(--hover);color:var(--ink)}
.ped-chev[aria-expanded="false"] .ped-chev-ic{transform:rotate(-90deg)}
.ped-chev-sp{display:inline-block;width:22px;flex:none}
.ped-src-obj{margin-top:6px}
.ped-src-kr{padding-left:14px}
.ped-src-kpi{padding-left:28px}
.ped-rel{padding:4px 0}
@media (max-width: 900px){.ped-form{grid-template-columns:minmax(0,1fr)}}

/* ---- mods/pgt/mod.css */
/* P-gantt: the Planning Gantt tab. Tokens only (dark mode follows the kit). */
.pgt{min-width:0}
.pgt-tools{display:flex;flex-direction:column;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line-2)}
.pgt-trow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.pgt-tl{font-size:12.5px;color:var(--muted);font-weight:500}
.pgt-vsep{width:1px;height:22px;margin:0 6px;background:var(--line)}
/* timeframe grid: one unbreakable group per year, the groups flow and wrap */
.pgt-tf{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.pgt-tf.off .pgt-tfg{opacity:.62}
.pgt-tfg{display:flex;align-items:center;gap:3px;flex:0 0 auto}
.pgt-yr{height:28px;min-width:48px;padding:0 6px;border:0;border-radius:6px;background:transparent;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;cursor:pointer}
.pgt-yr:hover{background:var(--hover);color:var(--ink)}
.pgt-yr.on{color:var(--accent-ink)}
.pgt-q{height:28px;min-width:40px;padding:0 8px;border:1px solid var(--field);border-radius:7px;background:var(--surface);font:inherit;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer}
.pgt-q:hover{border-color:var(--accent-line);color:var(--ink)}
.pgt-q.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink);font-weight:600}
.pgt-q.imp{background:var(--accent-wash);border-style:dashed;border-color:var(--accent-line);color:var(--accent-ink);font-weight:400}
.pgt-q.now{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.pgt-tfnote{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-height:28px}
.pgt-range{font-size:13px;font-weight:600;color:var(--ink)}

/* chart: fluid track, positions are percentages of the track */
.pgt-scroll{overflow-x:auto}
/* no containment on the chart itself: layout containment would make it a stacking context and
   trap the details popover under the menu scrim */
.pgt-chart{position:relative;width:100%;min-width:880px;--pg-labelw:240px;font-size:13px}
.pgt-gridl{position:absolute;left:var(--pg-labelw);right:20px;top:0;bottom:0;pointer-events:none}
.pgt-gq{position:absolute;top:26px;bottom:0;width:1px;background:var(--line)}
.pgt-gm{position:absolute;top:26px;bottom:0;width:0;border-left:1px dotted var(--line-2)}
.pgt-today{position:absolute;top:26px;bottom:0;width:2px;margin-left:-1px;background:var(--accent);opacity:.85}
.pgt-todaytag{position:absolute;top:5px;transform:translateX(-50%);padding:1px 7px;border-radius:5px;background:var(--accent);color:var(--surface);font-size:11.5px;font-weight:600;white-space:nowrap}
.pgt-grip{position:absolute;left:var(--pg-labelw);top:0;bottom:0;width:10px;margin-left:-5px;cursor:col-resize;z-index:6;touch-action:none}
.pgt-grip::after{content:"";position:absolute;left:4.5px;top:0;bottom:0;width:1px;background:var(--line)}
.pgt-grip:hover::after,.pgt-grip.drag::after,.pgt-grip:focus-visible::after{left:4px;width:2px;background:var(--accent)}
.pgt-axis{display:flex;align-items:stretch;height:54px;border-bottom:1px solid var(--line);container-type:inline-size;container-name:pgtaxis}
.pgt-axlab{align-items:flex-end;padding:0 8px 8px 16px;font-size:12.5px;font-weight:500;color:var(--muted)}
.pgt-axis .pgt-trk{overflow:visible}
/* quarter and month labels share one line, to the right of their gridline, below the today tag */
.pgt-ql{position:absolute;top:28px;padding-left:6px;font-size:12.5px;font-weight:600;line-height:18px;white-space:nowrap;color:var(--ink)}
.pgt-ml{position:absolute;top:28px;padding-left:6px;font-size:12px;line-height:18px;color:var(--muted);white-space:nowrap;display:none}
/* month labels only once the chart is at least 1100px wide (the axis row spans the chart) */
@container pgtaxis (min-width: 1100px){ .pgt-ml{display:inline} }
@supports not (container-type: inline-size){ @media (min-width: 1400px){ .pgt-ml{display:inline} } }

.pgt-row{position:relative;display:flex;align-items:stretch;height:30px}
.pgt-row:hover{background:var(--surface-3)}
.pgt-row.lv-grp{height:36px;background:var(--surface-2);border-top:1px solid var(--line-2)}
.pgt-row.lv-div{height:34px;border-top:1px solid var(--line-2)}
.pgt-row.sel,.pgt-row.sel:hover{background:var(--accent-wash)}
.pgt-row.paused .pgt-lab{opacity:.7}
.pgt-lab{position:relative;width:var(--pg-labelw);flex:none;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap;padding-right:12px}
.pgt-trk{position:relative;flex:1 1 auto;min-width:0;height:100%;margin-right:20px;overflow:hidden}
.pgt-chev{width:20px;height:20px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:5px;background:transparent;color:var(--faint);cursor:pointer}
.pgt-chev:hover{background:var(--press);color:var(--ink)}
.pgt-chev svg{transition:transform .15s ease}
.pgt-chev.shut svg{transform:rotate(-90deg)}
.pgt-sp{width:20px;flex:none}
.pgt-dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--none)}
.pgt-dot.dia{width:8px;height:8px;border-radius:1px;transform:rotate(45deg)}
.pgt-dot.t-ok{background:var(--ok)}
.pgt-dot.t-warn{background:var(--warn)}
.pgt-dot.t-bad{background:var(--bad)}
.pgt-dot.t-none{background:var(--none)}
.pgt-tag{flex:none;height:18px;font-size:11px}
.pgt-nm{display:block;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500;color:var(--ink);text-align:left}
.pgt-nm.lnk{font-weight:500}
.pgt-nm.lnk:hover{color:var(--accent-ink)}
.pgt-nm.e-division{font-size:13.5px;font-weight:600}
.pgt-nm.e-milestone{font-weight:400;color:var(--ink-2)}
.pgt-nm.grp{font-weight:600}
.pgt-nm.static{font-size:12.5px;font-weight:400;color:var(--muted)}
.pgt-nm.e-stagegateset{font-style:italic}
.pgt-nm.e-milestonekr,.pgt-nm.e-board{font-weight:500;color:var(--ink-2)}
.pgt-sub{flex:none;margin-left:auto;font-size:12px;color:var(--faint)}
/* row actions: quiet buttons that appear on hover or keyboard focus */
.pgt-acts{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;gap:1px;padding:1px 2px;border-radius:7px;background:var(--surface);box-shadow:var(--shadow-1);opacity:0;pointer-events:none}
.pgt-row:hover .pgt-acts,.pgt-row:focus-within .pgt-acts{opacity:1;pointer-events:auto}

/* bars: the band colour is currentColor, so border and fill follow it */
.pgt-bar{position:absolute;top:8px;height:14px;padding:0;border:1.5px solid currentColor;border-radius:4px;background:transparent;color:var(--ghost);font:inherit;overflow:hidden;cursor:pointer;touch-action:none}
.pgt-bar::before{content:"";position:absolute;inset:0;background:currentColor;opacity:.32}
.pgt-bar.t-ok{color:var(--ok)}
.pgt-bar.t-warn{color:var(--warn)}
.pgt-bar.t-bad{color:var(--bad)}
.pgt-bar.t-none{color:var(--ghost)}
.pgt-bar.derived{border-style:dashed}
.pgt-bar.derived::before{opacity:.15}
.pgt-bar.set{top:10px;height:10px;border-style:dashed;opacity:.8}
.pgt-bar.cancelled{color:var(--none);opacity:.55}
.pgt-bar.cancelled::before{background:repeating-linear-gradient(45deg,var(--muted) 0 2px,transparent 2px 5px);opacity:.6}
.pgt-bar.drag{cursor:grabbing;box-shadow:var(--shadow-pop)}
.pgt-bar.sel,.pgt-mk.sel,.pgt-gbar.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.pgt-gbar{position:absolute;top:13px;height:9px;padding:0;border:1.5px dashed var(--field-hover);border-radius:5px;background:transparent;cursor:pointer}
.pgt-kbspan{position:absolute;top:13px;height:4px;padding:0;border:0;border-radius:2px;background:var(--line);cursor:pointer}
.pgt-slip{position:absolute;top:8px;height:14px;border-radius:0 4px 4px 0;background:var(--bad);opacity:.85}
.lv-div .pgt-bar,.lv-div .pgt-slip{top:10px}
.lv-grp .pgt-gbar{top:13px}
.pgt-end{position:absolute;top:4px;width:3px;height:22px;margin-left:-1.5px;border-radius:2px;background:var(--ok)}
.pgt-end.abandoned{background:var(--bad)}
.pgt-conn{position:absolute;top:14px;height:2px;border-radius:1px;background:var(--muted);opacity:.5}
.pgt-conn.committed{background:var(--bad);opacity:.75}
/* markers: a diamond is a milestone, a square is a stage-gate; colour says how it is doing */
.pgt-mk{position:absolute;top:9px;width:12px;height:12px;margin-left:-6px;padding:0;border:1.5px solid var(--muted);border-radius:2px;background:var(--surface);transform:rotate(45deg);font:inherit;color:var(--ink);cursor:pointer;touch-action:none}
div.pgt-mk{cursor:default}
.pgt-mk.sq{transform:none}
.pgt-mk.passed,.pgt-mk.done{background:var(--ok);border-color:var(--ok)}
.pgt-mk.passed-late{background:var(--warn);border-color:var(--warn)}
.pgt-mk.overdue{background:var(--bad);border-color:var(--bad)}
.pgt-mk.pending{background:var(--surface);border-color:var(--muted)}
.pgt-mk.ghost{background:transparent;border:1.5px dashed var(--muted);opacity:.6}
.pgt-mk.ghost.paused{opacity:.75}
.pgt-mk.cancelled{background:repeating-linear-gradient(45deg,var(--none) 0 1.5px,transparent 1.5px 3.5px);border:1px solid var(--none)}
.pgt-mk.cancelled.missed{background:repeating-linear-gradient(45deg,var(--bad) 0 1.5px,transparent 1.5px 3.5px);border-color:var(--bad)}
.pgt-mk.drag{box-shadow:var(--shadow-pop)}
.pgt-sqn{position:absolute;left:50%;top:-13px;transform:translateX(-50%);font-size:10.5px;font-weight:700;line-height:1;color:var(--ink)}

/* details popover */
.pgt-pop{gap:10px}
.pgt-ptitle{font-size:15px;font-weight:600;line-height:1.3}

/* legend */
.pgt-legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:12px 20px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2)}
.pgt-legend .st{font-size:12.5px}
.pgt-lg{display:inline-flex;align-items:center;gap:6px}
.pgt-lgt{font-weight:600;color:var(--muted)}
.pgt-lgbar{display:inline-block;width:22px;height:10px;border:1.5px solid var(--muted);border-radius:3px;background:var(--track)}
.pgt-lgbar.derived{border-style:dashed;background:transparent}
.pgt-lgslip{display:inline-block;width:16px;height:10px;border-radius:0 3px 3px 0;background:var(--bad);opacity:.85}
.pgt-lgmk{display:inline-block;width:9px;height:9px;border:1.5px solid var(--muted);border-radius:1px;transform:rotate(45deg)}
.pgt-lgmk.ghost{border-style:dashed;opacity:.6}
.pgt-lgtoday{display:inline-block;width:2px;height:14px;background:var(--accent)}
.pgt-lgsq{display:inline-block;width:10px;height:10px;border:1.5px solid var(--muted);border-radius:2px}
.pgt-lgsq.passed{background:var(--ok);border-color:var(--ok)}
.pgt-lgsq.passed-late{background:var(--warn);border-color:var(--warn)}
.pgt-lgsq.overdue{background:var(--bad);border-color:var(--bad)}
.pgt-lgsq.ghost{border-style:dashed;opacity:.6}
.pgt-lgsq.cancelled{background:repeating-linear-gradient(45deg,var(--none) 0 1.5px,transparent 1.5px 3.5px);border:1px solid var(--none)}
.pgt-lgsq.cancelled.missed{background:repeating-linear-gradient(45deg,var(--bad) 0 1.5px,transparent 1.5px 3.5px);border-color:var(--bad)}
@media (prefers-reduced-motion: reduce){ .pgt-chev svg{transition:none} }

/* ---- mods/pms/mod.css */
/* P-gantt: the Milestones tab and the milestone report. Tokens only, except the print block at
   the end, which pins the report to light paper whatever the screen theme is. */
.pms-tbl{font-size:13.5px}
.pms-tbl td{padding:8px 12px}
.pms-tbl th:first-child,.pms-tbl td:first-child{padding-left:20px}
.pms-tbl th:last-child,.pms-tbl td:last-child{padding-right:16px}
.pms-row{cursor:pointer}
.pms-row.paused td{opacity:.62}
.pms-row.paused td:last-child{opacity:1}
.pms-num{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.pms-mcell{min-width:220px}
.pms-name{display:inline-flex;align-items:center;gap:9px;max-width:100%;text-align:left}
.pms-nmt{min-width:0}
.pms-dim{color:var(--ink-2)}
.pms-dia{display:inline-block;width:8px;height:8px;flex:none;border-radius:1px;transform:rotate(45deg);background:var(--none)}
.pms-dia.t-ok{background:var(--ok)}
.pms-dia.t-warn{background:var(--warn)}
.pms-dia.t-bad{background:var(--bad)}
.pms-eff{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pms-ok{color:var(--ok)}
.pms-slip{font-size:12.5px;font-weight:600}
.pms-paused{color:var(--warn-ink)}
.pms-hollow{background:transparent!important;border:1.5px dashed var(--warn)}
.pms-acts{display:inline-flex;align-items:center;justify-content:flex-end;gap:2px}
.pms-rep{gap:2px;padding:0 6px}
.pms-menu{top:30px;min-width:220px}
.pms-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pms-grp td{background:var(--surface-2);border-top:1px solid var(--line-2)}
.pms-gbtn{display:inline-flex;align-items:center;gap:6px;padding:2px 6px 2px 2px;border:0;border-radius:6px;background:transparent;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.pms-gbtn:hover{background:var(--press)}
.pms-chev{color:var(--faint);transition:transform .15s ease}
.pms-chev.shut{transform:rotate(-90deg)}

/* report: a document inside the sheet (the wrapper only catches Escape; it adds no box) */
.pms-sheet{display:contents}
.pms-body{background:var(--surface-2)}
.pms-doc{display:flex;flex-direction:column;gap:22px;padding:28px 30px 32px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-1)}
.pms-dhead{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-start;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.pms-lbl{font-size:12px;font-weight:600;color:var(--muted)}
.pms-proj{font-size:20px;font-weight:600;letter-spacing:-.01em}
input.pms-proj{height:40px;width:100%;font-size:18px;font-weight:600}
.pms-tagrow{gap:8px 10px}
.pms-msname{font-size:15px;font-weight:600}
.pms-metas{display:grid;grid-template-columns:repeat(2,minmax(130px,1fr));gap:12px 18px;min-width:280px}
.pms-meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.pms-val{font-weight:500}
.pms-sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.pms-sec>h3{font-size:14px;font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.pms-txt{color:var(--ink)}
.pms-pre{white-space:pre-wrap}
.pms-two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px}
.pms-finding{display:flex;gap:10px;align-items:flex-start}
.pms-fn{flex:none;width:24px;padding-top:7px;font-size:12.5px;font-weight:700;color:var(--faint)}
.pms-fta{flex:1;min-height:52px}
.pms-mt td,.pms-at td{vertical-align:middle}
.pms-meas{width:150px}
.pms-full{width:100%}
.pms-sigs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding-top:26px}
.pms-sigc{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.pms-sig{height:34px;border-bottom:1px solid var(--ink)}
@media (max-width: 760px){ .pms-two{grid-template-columns:minmax(0,1fr)} .pms-sigs{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion: reduce){ .pms-chev{transition:none} }

/* Print / save as PDF: only the report prints, always on light paper. The light values below are
   the kit's light tokens, restated for print only so a dark-mode screen still prints light. */
@media print {
  .cw.cw:has(.pms-doc){
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#FFFFFF; --surface-3:#FFFFFF; --line:#C9D0D9; --line-2:#DDE2E8; --line-3:#E8ECF1;
    --field:#C9D0D9; --ink:#17202C; --ink-2:#3A4656; --muted:#5B6878; --faint:#8C97A5; --ghost:#B9C2CE;
    --ok:#12784A; --ok-ink:#0E6640; --warn:#C98A16; --warn-ink:#8A5D07; --bad:#B4352A; --bad-ink:#9A2C22; --none:#C7CFD9;
    background:#FFFFFF; color:#17202C; color-scheme:light;
  }
  .cw:has(.pms-doc) .app,.cw:has(.pms-doc) .sheet-scrim,.cw:has(.pms-doc) .scrim,.cw:has(.pms-doc) .toasts,.cw:has(.pms-doc) .dlg,.cw:has(.pms-doc) .dlg-scrim{display:none!important}
  .cw:has(.pms-doc) .sheet{position:static;width:auto;border:0;box-shadow:none;background:#FFFFFF}
  .cw:has(.pms-doc) .sh-head,.cw:has(.pms-doc) .sh-foot,.cw .pms-ronote{display:none!important}
  .cw:has(.pms-doc) .sh-body{overflow:visible;padding:0;background:#FFFFFF}
  .cw .pms-doc{border:0;box-shadow:none;padding:0}
  .cw .pms-doc .in,.cw .pms-doc .ta{border-color:transparent;padding-left:0;background:transparent;box-shadow:none;resize:none}
  .cw .pms-doc ::placeholder{color:transparent}
}

      else sum.onTrack++;
    }
    return { perColumn: perColumn, onTrack: sum.onTrack, atRisk: sum.atRisk, breached: sum.breached, closed: sum.closed, backlog: sum.backlog, total: sum.total };
  }

  // Pure transition: move a tile. Advancing to a new column resets days-in-column (enteredCol = today);
  // changing swimlane re-parents its rules. Returns a NEW board (original untouched).
  function dropTile(board, tileId, toCol, toLane, todayIso) {
    var nb = JSON.parse(JSON.stringify(board || {}));
    var tiles = nb.tiles || [], cols = nb.columns || [];
    var colIndex = {}; for (var ci = 0; ci < cols.length; ci++) colIndex[cols[ci].id] = ci;
    for (var i = 0; i < tiles.length; i++) {
      if (tiles[i].id === tileId) {
        if (toCol != null && tiles[i].col !== toCol) { tiles[i].col = toCol; tiles[i].enteredCol = todayIso || tiles[i].enteredCol; }
        if (toLane != null) tiles[i].lane = toLane;
        // reconcile gate-crossing stamps against the tile's (possibly new) position
        var cur = colIndex[tiles[i].col];
        if (cur != null) {
          var gp = tiles[i].gatePassed || {};
          for (var k = 0; k < cols.length; k++) {
            var cid = cols[k].id;
            if (k < cur) { if (!gp[cid]) gp[cid] = todayIso || ''; }   // newly cleared -> stamp today
            else if (gp[cid]) { delete gp[cid]; }                       // retreated past -> un-stamp
          }
          tiles[i].gatePassed = gp;
        }
        break;
      }
    }
    return nb;
  }

  // ---- Kanban gate status for the Gantt ----------------------------------------------------
  // Per (tile, gate-column-index): has the tile cleared this gate, and on time or late? or is it overdue/pending?
  //   'passed-ontime' | 'passed-late' | 'overdue' | 'pending'
  function gateTileState(board, tile, colIndex, todayIso) {
    var cols = (board && board.columns) || [];
    if (colIndex < 0 || colIndex >= cols.length) return 'pending';
    var laneById = {}; ((board && board.swimlanes) || []).forEach(function (l) { laneById[l.id] = l; });
    var lane = laneById[tile.lane];
    var due = gateDueDates(cols, lane, tile).due[colIndex];   // iso or ''
    var curIdx = -1; for (var i = 0; i < cols.length; i++) if (cols[i].id === tile.col) { curIdx = i; break; }
    var col = cols[colIndex];
    if (curIdx > colIndex) {                                  // cleared this gate
      var crossed = (tile.gatePassed || {})[col.id];
      if (crossed && due && crossed > due) return 'passed-late';
      return 'passed-ontime';
    }
    // not cleared
    if (due && todayIso && todayIso > due) return 'overdue';
    return 'pending';
  }

  // Aggregate a gate column across all tiles for the collapsed board row: how many passed, and the WORST state
  // (red = any overdue > orange = any late > green = all passed > none = some pending, none late/overdue).
  function boardGateSummary(board, colIndex, todayIso) {
    var tiles = (board && board.tiles) || [];
    var passed = 0, anyOverdue = false, anyLate = false, allPassed = tiles.length > 0;
    for (var i = 0; i < tiles.length; i++) {
      var st = gateTileState(board, tiles[i], colIndex, todayIso);
      if (st === 'passed-ontime' || st === 'passed-late') passed++; else allPassed = false;
      if (st === 'overdue') anyOverdue = true;
      if (st === 'passed-late') anyLate = true;
    }
    var worst = anyOverdue ? 'red' : (anyLate ? 'orange' : (allPassed ? 'green' : 'none'));
    return { passed: passed, total: tiles.length, worst: worst };
  }

  // Dated milestone-KR steps for the Gantt: only steps WITH a due date, each with a completion-derived status.
  //   'done' (100%) | 'overdue' (<100 & past due) | 'pending'
  function milestoneGanttSteps(kr, todayIso) {
    var steps = (kr && kr.steps) || [];
    var out = [];
    for (var i = 0; i < steps.length; i++) {
      var s = steps[i];
      if (!s.due) continue;                                   // undated steps don't go on the timeline
      var c = Math.max(0, Math.min(100, Number(s.completion) || 0));
      var status = c >= 100 ? 'done' : ((todayIso && todayIso > s.due) ? 'overdue' : 'pending');
      out.push({ id: s.id, name: s.name, due: s.due, completion: c, status: status });
    }
    return out;
  }

  // Where each gate (column) lands on a timeline for a given tile, from its swimlane's rules.
  // due[i] = the date the tile should have CLEARED column i.
  //   no deadline  -> forward:  due[i] = start + (i+1)*maxDaysPerCol
  //   deadline set -> backward: due[last] = deadline; due[i] = deadline - (N-1-i)*maxDaysPerCol
  //                   feasible iff (deadline - start) >= N*maxDaysPerCol
  function gateDueDates(columns, swimlane, tile) {
    var N = (columns || []).length;
    var M = swimlane ? (Number(swimlane.maxDaysPerCol) || 0) : 0;
    var S = _kIsoDay(tile && tile.startDate);
    var due = [], feasible = true;
    if (swimlane && swimlane.deadline) {
      var D = _kIsoDay(swimlane.deadline);
      for (var i = 0; i < N; i++) due.push(D == null ? '' : _kDayIso(D - (N - 1 - i) * M));
      feasible = (D != null && S != null) ? (D - S) >= N * M : true;
    } else {
      for (var j = 0; j < N; j++) due.push(S == null ? '' : _kDayIso(S + (j + 1) * M));
      feasible = true;
    }
    return { due: due, feasible: feasible };
  }

  // `raw` (optional): the undiscounted score, for display beside a partial check-in. Only a KPI-tracked KR
  // can be partial — percentage, sub-KR and milestone tracking have no readings to be short of.
  function keyResultScore(krId, execDocs, raw) {
    var kr = findKr(krId, execDocs);
    var tt = kr ? (kr.trackingType || 'kpi') : 'kpi';
    if (tt === 'percentage') {
      if (!kr || kr.progress == null) return null;
      return clamp(Number(kr.progress), 0, 100);
    }
    if (tt === 'subkr') return subKrScore(kr.subKrs || []);
    if (tt === 'milestone') return milestoneKrScore(kr);
    return meanScorable(kpisFor('keyResult', krId, execDocs), execDocs, raw);
  }
  function keyResultSample(krId, execDocs) {
    var kr = findKr(krId, execDocs);
    if (kr && (kr.trackingType || 'kpi') !== 'kpi') return { partial: false, partialCount: 0, n: 0, expected: 0 };
    return hostSample('keyResult', krId, execDocs);
  }
  // Pace-aware KR status: attainment vs how far the parent objective's timeline has elapsed.
  function keyResultPaceBand(attainment, plannedStart, plannedEnd, today) {
    if (attainment == null) return 'no-band';
    if (attainment >= 100) return 'on-track';                                                        // target met
    if (plannedStart == null || plannedEnd == null || plannedEnd <= plannedStart) return band(attainment); // no dates -> score band
    var elapsed = Math.max(0, Math.min(1, (today - plannedStart) / (plannedEnd - plannedStart))) * 100;
    if (elapsed >= 100) return 'off-track';                                                          // past plannedEnd, unmet
    var gap = elapsed - attainment;                                                                  // pts behind the linear pace
    if (gap <= 10) return 'on-track';
    if (gap <= 30) return 'at-risk';
    return 'off-track';
  }
  function keyResultPace(krId, obj, execDocs, today) {
    var att = keyResultScore(krId, execDocs);
    var ps = obj ? obj.plannedStart : null, pe = obj ? obj.plannedEnd : null;
    var elapsed = (ps != null && pe != null && pe > ps) ? Math.max(0, Math.min(1, (today - ps) / (pe - ps))) * 100 : null;
    return { attainment: att, elapsed: elapsed, gap: (att != null && elapsed != null) ? (elapsed - att) : null, band: keyResultPaceBand(att, ps, pe, today) };
  }
  // stageGateScore -> mean of the gate's KPIs (gating/readiness; NOT in OKR score)
  function stageGateScore(sgId, execDocs, raw) { return meanScorable(kpisFor('stageGate', sgId, execDocs), execDocs, raw); }
  // gateAtTarget -> true iff EVERY target on the gate has been read and is at/above target. Unread targets
  // score 0 (see meanScorable), so a gate cannot pass on the strength of the one target somebody measured.
  // A gate with NO scorable KPIs scores null (not 100), so this is the built-in 0/0 auto-complete guard.
  function gateAtTarget(sgId, execDocs) { return stageGateScore(sgId, execDocs) === 100; }

  // ---- stage-gate SETS (parallel workstreams within an objective) -----------
  // A gate carries setId; sets are declared in execDoc.stageGateSets [{id,objectiveId,name,order,chained}].
  function gatesForSet(setId, execDocs){ var out=[]; for(var d in execDocs){ if(!execDocs.hasOwnProperty(d)||d===PORTFOLIO_KEY) continue; var gs=execDocs[d].stageGates||[]; for(var i=0;i<gs.length;i++) if(gs[i].setId===setId) out.push(gs[i]); } return out; }
  function setsForObjective(objId, execDocs){ var out=[]; for(var d in execDocs){ if(!execDocs.hasOwnProperty(d)||d===PORTFOLIO_KEY) continue; var ss=execDocs[d].stageGateSets||[]; for(var i=0;i<ss.length;i++) if(ss[i].objectiveId===objId) out.push(ss[i]); } return out; }
  // set score = % of the set's gates that are passed (date-based classifyGate). null when the set has no gates.
  function setScore(setId, execDocs, today){ var gs=gatesForSet(setId, execDocs); if(!gs.length) return null; var p=0; for(var i=0;i<gs.length;i++){ var st=classifyGate(gs[i], today); if(st==='passed'||st==='passed-late') p++; } return 100*p/gs.length; }
  // objective gate readiness = MIN over the objective's sets of setScore (weakest workstream wins). null if no scorable sets.
  function objectiveGateReadiness(objId, execDocs, today){ var ss=setsForObjective(objId, execDocs), m=null; for(var i=0;i<ss.length;i++){ var sc=setScore(ss[i].id, execDocs, today); if(sc==null) continue; if(m==null||sc<m) m=sc; } return m; }
  // generic: mean resolved score of every KPI hosted at (hostType, hostId) — used for product/component levels
  function hostScore(hostType, hostId, execDocs) { return meanScorable(kpisFor(hostType, hostId, execDocs), execDocs); }
  // milestoneScore -> mean of the milestone's KPIs (peer of initiative in the KPI tree; a standalone
  // gating/readiness signal, NOT folded into the OKR score — same stance as stageGateScore).
  function milestoneScore(msId, execDocs, raw) { return meanScorable(kpisFor('milestone', msId, execDocs), execDocs, raw); }
  // milestoneAchieved -> manual completion mark (ms.completedDate) OR KPI score at 100.
  // A milestone with no scorable KPIs is achieved only by the manual mark.
  function milestoneAchieved(ms, execDocs) {
    if (ms && ms.completedDate) return true;
    var s = milestoneScore(ms && ms.id, execDocs);
    return s != null && s >= 100;
  }

  // ---- objective & tier scores ---------------------------------------------
  function krsForObjective(objId, execDocs) {
    var out = [];
    for (var div in execDocs) {
      if (!execDocs.hasOwnProperty(div) || div === PORTFOLIO_KEY) continue;
      var krs = execDocs[div].keyResults || [];
      for (var i = 0; i < krs.length; i++) if (krs[i].objectiveId === objId) out.push(krs[i]);
    }
    return out;
  }

  // objectiveScore -> mean of scorable Key Result scores; null when none are
  // scorable (an objective with no Key Result is unscored -> no band, decision #3).
  // An unscored Key Result counts as ZERO, not as absent — the same stance meanScorable takes for an
  // unread KPI, and for the same reason: an objective must not read well because most of its Key
  // Results have nothing behind them yet. Only when NOTHING is scorable is the objective unscored,
  // which keeps "an objective with no Key Result has no band" intact.
  function objectiveScore(objId, execDocs, raw) {
    var krs = krsForObjective(objId, execDocs);
    var scores = [], anyScored = false;
    for (var i = 0; i < krs.length; i++) {
      var s = keyResultScore(krs[i].id, execDocs, raw);
      if (s != null) anyScored = true;
      scores.push(s == null ? 0 : s);
    }
    if (!anyScored) return null;
    return mean(scores);
  }
  // How many of an objective's KRs are partial check-ins — 0 means its score carries no discount.
  function objectivePartialCount(objId, execDocs) {
    var krs = krsForObjective(objId, execDocs), c = 0;
    for (var i = 0; i < krs.length; i++) if (keyResultSample(krs[i].id, execDocs).partial) c++;
    return c;
  }

  // ---- hierarchy lookups (Phase 1) -----------------------------------------
  // A division carries unitId (which unit it sits under) and kind ('rd' | 'biz', absent-means-'rd').
  function _divRow(divId, portfolio) {
    var ds = (portfolio && portfolio.divisions) || [];
    for (var i = 0; i < ds.length; i++) if (ds[i].id === divId) return ds[i];
    return null;
  }
  function unitIdOfDivision(divId, portfolio) {
    var d = _divRow(divId, portfolio);
    return (d && d.unitId) || null;      // null -> Unassigned
  }
  function divisionKind(div) { return (div && div.kind) || 'rd'; }   // absent -> rd
  function divisionsInUnit(unitId, portfolio) {
    var ds = (portfolio && portfolio.divisions) || [], out = [];
    for (var i = 0; i < ds.length; i++) if ((ds[i].unitId || null) === unitId) out.push(ds[i]);
    return out;
  }

  function objectivesInScope(entityType, entityId, portfolio) {
    var objs = portfolio.objectives || [];
    switch (entityType) {
      case 'objective':  return objs.filter(function (o) { return o.id === entityId; });
      case 'initiative': return objs.filter(function (o) { return o.initiativeId === entityId; });
      case 'division':   return objs.filter(function (o) { return o.divisionId === entityId; });
      case 'unit':       return objs.filter(function (o) { return unitIdOfDivision(o.divisionId, portfolio) === entityId; });
      case 'company':    return objs.slice();
      default: return [];
    }
  }

  // score(entityType, entityId, portfolio, execDocs, quarter?)
  //   quarter omitted -> OVERALL (grand mean of the entity's objectives)
  //   quarter given   -> QUARTERLY (objectives stamped that quarter)
  // Returns 0..100 or null (no scorable objectives in the bound -> no band).
  function score(entityType, entityId, portfolio, execDocs, quarter) {
    var objs = objectivesInScope(entityType, entityId, portfolio);
    if (quarter != null) objs = objs.filter(function (o) { return o.quarter === quarter; });
    // ended objectives (abandoned AND achieved) count in every rollup, quarterly and overall alike —
    // an abandoned objective's score is part of the record, not something the aggregate forgets.
    var scores = [];
    for (var i = 0; i < objs.length; i++) {
      var s = objectiveScore(objs[i].id, execDocs);
      if (s != null) scores.push(s);
    }
    return mean(scores);
  }

  // boundsOf -> sorted distinct quarters in scope. length 1 => caller collapses
  // quarterly and overall into a single number.
  function boundsOf(entityType, entityId, portfolio) {
    var objs = objectivesInScope(entityType, entityId, portfolio);
    var seen = {}, out = [];
    for (var i = 0; i < objs.length; i++) {
      var q = objs[i].quarter;
      if (q && !seen[q]) { seen[q] = 1; out.push(q); }
    }
    out.sort();
    return out;
  }

  function rollupObjective(id, portfolio, execDocs) { return score('objective', id, portfolio, execDocs); }
  function rollupInitiative(id, portfolio, execDocs) { return score('initiative', id, portfolio, execDocs); }
  function rollupDivision(id, portfolio, execDocs) { return score('division', id, portfolio, execDocs); }
  // Unit score: FLAT mean of every objective in the unit — "how is the work going in general". A larger
  // division therefore weighs more in its unit's score. Reuses the score() primitive via the 'unit' scope.
  function rollupUnit(id, portfolio, execDocs, quarter) { return score('unit', id, portfolio, execDocs, quarter); }
  // Company score: NESTED — the mean of the DIVISION scores, so every division counts equally regardless of
  // how many objectives it holds ("how are my divisions doing"). This is deliberately NOT the flat mean of all
  // objectives (the old behaviour) and NOT the mean of unit scores; a note in the UI reads "Mean of division
  // scores". A division with no scorable objectives drops out (null), exactly as an objective does in a lower mean.
  function rollupCompany(portfolio, execDocs, quarter) {
    var ds = (portfolio && portfolio.divisions) || [];
    var scores = [];
    for (var i = 0; i < ds.length; i++) {
      var sc = score('division', ds[i].id, portfolio, execDocs, quarter);
      if (sc != null) scores.push(sc);
    }
    return mean(scores);
  }

  // Combine the portfolio doc into a docs map for cross-document KPI resolution.
  // Portfolio KPIs join the resolution pool (their targets/identity cascade down
  // to linked exec members; values cascade up from exec readings). The reserved
  // key is skipped by structural iteration, so KRs/gates/objectives never double.
  function withPortfolio(portfolio, execDocs) {
    var m = {}; m[PORTFOLIO_KEY] = portfolio || {};
    for (var k in execDocs) { if (execDocs.hasOwnProperty(k)) m[k] = execDocs[k]; }
    return m;
  }

  // Band thresholds. Half-open from the top: on-track is 80 and up, at-risk is 65 up to (not including)
  // 80, off-track is everything below 65. Changing these numbers re-bands every score in every app, so
  // the boundaries are pinned by assertion in core.test.js rather than left to interior sample values.
  function band(s) {
    if (s == null) return 'no-band';
    if (s >= 80) return 'on-track';
    if (s >= 65) return 'at-risk';
    return 'off-track';
  }

  // ---- product / model classification (§5) ---------------------------------
  function ownClass(node) {
    if (node.modelId) return { kind: 'model', modelId: node.modelId };
    if (node.productId) return { kind: 'product', productId: node.productId };
    return { kind: 'agnostic' };
  }
  function parentProductOf(modelId, portfolio) {
    var ms = portfolio.models || [];
    for (var i = 0; i < ms.length; i++) if (ms[i].id === modelId) return ms[i].productId;
    return null;
  }
  function initiativeOf(obj, portfolio) {
    var inits = portfolio.initiatives || [];
    for (var i = 0; i < inits.length; i++) if (inits[i].id === obj.initiativeId) return inits[i];
    return null;
  }
  function effClass(obj, portfolio) {
    var c = ownClass(obj);
    if (c.kind === 'agnostic') {
      var init = initiativeOf(obj, portfolio);
      if (init) c = ownClass(init);
    }
    return c;
  }
  function effProduct(obj, portfolio) {
    var c = effClass(obj, portfolio);
    if (c.kind === 'model') return parentProductOf(c.modelId, portfolio);
    if (c.kind === 'product') return c.productId;
    return null;
  }
  function effModel(obj, portfolio) {
    var c = effClass(obj, portfolio);
    return c.kind === 'model' ? c.modelId : null;
  }

  // ---- quarter helpers (calendar quarters, matching YYYY"Q"N) ----
  /* ---- Gantt timeframe: a set of selected quarters -------------------------------------------------
     The selector is a grid of years x quarters and clicking TOGGLES a cell, so the selection can end up
     non-contiguous: 2026Q1 and 2026Q4 with nothing between. A Gantt axis has to be one continuous span,
     so the window is earliest-selected to latest-selected and the quarters in between are IMPLIED — the
     UI shades them differently so the grid never claims a gap it cannot honour.
     An empty selection is not an error state: it falls back to the current quarter. */
  function qKey(y, n){ return String(y) + 'Q' + String(n); }
  function qParse(q){
    var m = /^(\d{4})Q([1-4])$/.exec(String(q == null ? '' : q).trim());
    return m ? { y: +m[1], n: +m[2] } : null;
  }
  function qIndex(q){ var p = qParse(q); return p ? (p.y * 4 + (p.n - 1)) : null; }
  function qFromIndex(i){ return qKey(Math.floor(i / 4), (i % 4) + 1); }

  // the full inclusive run between the earliest and latest selected quarter
  function quarterSpan(sel){
    var idx = (sel || []).map(qIndex).filter(function (i) { return i != null; });
    if (!idx.length) return [];
    var lo = Math.min.apply(null, idx), hi = Math.max.apply(null, idx), out = [];
    for (var i = lo; i <= hi; i++) out.push(qFromIndex(i));
    return out;
  }
  // which of those the user did NOT click — the implied middle
  function quarterSpanImplied(sel){
    var have = {}; (sel || []).forEach(function (q) { if (qIndex(q) != null) have[q] = 1; });
    return quarterSpan(sel).filter(function (q) { return !have[q]; });
  }
  // the day window the axis should show, or null when nothing is selected
  function quarterSpanRange(sel){
    var span = quarterSpan(sel);
    if (!span.length) return null;
    var a = quarterRange(span[0]), b = quarterRange(span[span.length - 1]);
    if (!a || !b) return null;
    return { from: span[0], to: span[span.length - 1], start: a.start, end: b.end };
  }
  /* Toggle: clicking a selected quarter removes it, clicking an unselected one adds it. An IMPLIED
     quarter is not in the set, so clicking it adds it — the window does not move, which is the point. */
  function toggleQuarter(sel, q){
    if (qIndex(q) == null) return (sel || []).slice();
    var out = [], hit = false;
    (sel || []).forEach(function (x) { if (x === q) hit = true; else out.push(x); });
    if (!hit) out.push(q);
    return out.sort(function (a, b) { return qIndex(a) - qIndex(b); });
  }
  // every quarter of a year, for the year button
  function yearQuarters(y){ return [1, 2, 3, 4].map(function (n) { return qKey(y, n); }); }
  /* A year click is the same toggle applied to four cells at once: if the year is ALREADY fully
     selected it clears, otherwise it fills. Anything else would make the year button's effect depend on
     which quarters happened to be on, which is unpredictable to use. */
  function toggleYear(sel, y){
    var qs = yearQuarters(y), have = {};
    (sel || []).forEach(function (x) { have[x] = 1; });
    var full = qs.every(function (q) { return have[q]; });
    var out = (sel || []).filter(function (x) { return qs.indexOf(x) < 0; });
    if (!full) out = out.concat(qs);
    return out.sort(function (a, b) { return qIndex(a) - qIndex(b); });
  }

  function quarterRange(q) {                          // 'YYYYQN' -> { start:'YYYY-MM-DD', end:'YYYY-MM-DD' } | null
    var m = /^(\d{4})Q([1-4])$/.exec(String(q == null ? '' : q).trim());
    if (!m) return null;
    var y = +m[1], sm = (+m[2] - 1) * 3, pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var ey = y, em = sm + 3; if (em >= 12) { ey = y + 1; em = 0; }
    var last = new Date(Date.UTC(ey, em, 1) - 86400000);
    return { start: y + '-' + pad(sm + 1) + '-01',
             end: last.getUTCFullYear() + '-' + pad(last.getUTCMonth() + 1) + '-' + pad(last.getUTCDate()) };
  }
  function quarterList(used, refYear, back, fwd) {    // rolling window ∪ used, sorted; caller adds the blank option
    back = back == null ? 1 : back; fwd = fwd == null ? 2 : fwd;
    var set = {};
    for (var y = refYear - back; y <= refYear + fwd; y++) for (var q = 1; q <= 4; q++) set[y + 'Q' + q] = 1;
    (used || []).forEach(function (u) { if (/^\d{4}Q[1-4]$/.test(u)) set[u] = 1; });
    return Object.keys(set).sort();
  }

  // ---- layered grouping of objectives by an ordered list of dimensions ----
  // dims ⊂ ['division','product','model','quarter','owner','initiative']; product/model resolve
  // through the initiative (effProduct/effModel), so a blank objective inherits its initiative.
  // returns a nested tree: [{ key, dim, objs? , children? }] with '' (none) buckets ordered last.
  // owner was free text and is now a list of roster emails. Read BOTH shapes: a legacy string is a
  // one-element list, so nothing needs migrating and old data keeps grouping exactly as it did.
  /* Who can be assigned a kanban tile, and who is worth offering FIRST.
     The narrow set is the people who own an active objective in this division: they are the ones who
     would plausibly pick the work up, so that is the useful default rather than a restriction. The wide
     set is everyone known, for the deliberate case of assigning outside it.
     The current assignee is ALWAYS included, marked, whatever the filter says. Someone whose objective
     has since closed would otherwise vanish from the picker that shows their own assignment — the list
     would quietly disagree with the tile. */
  function divisionOwnerEmails(portfolio, divisionId, todayDay, objectiveState) {

      if (projEndEarliest[id] != null) return projEndEarliest[id];
      var o = objById[id];
      if (!o) return 0;
      if (objEStack[id]) return intrinsicEarliest[id];
      objEStack[id] = true;
      var cs = o.plannedStart, preds = objPreds[id];
      for (var i = 0; i < preds.length; i++) {
        if (objEStack[preds[i].from]) continue;
        cs = Math.max(cs, computeProjEndEarliest(preds[i].from) + preds[i].lag);
      }
      // Mirror the committed projEnd floor EXACTLY (line above uses cs + dur): an objective occupies its full
      // planned duration regardless of how early its gates could finish, so acceleration reflects ONLY genuine
      // early upstream work (a gate/task or predecessor ahead of plan), never the objective's own span slack.
      var res = Math.max(intrinsicEarliest[id], cs + (o.plannedEnd - o.plannedStart));
      objEStack[id] = false;
      projEndEarliest[id] = res;
      return res;
    }
    objs.forEach(function (o) { computeProjEndEarliest(o.id); });
    var objectiveAcceleration = {};
    objs.forEach(function (o) { objectiveAcceleration[o.id] = Math.max(0, projEnd[o.id] - projEndEarliest[o.id]); });

    // Stage 3: vertical lift into milestones
    var effective = {};
    miles.forEach(function (m) { effective[m.id] = m.plannedDate; });
    objs.forEach(function (o) {
      (o.milestoneIds || []).forEach(function (mid) {
        if (effective[mid] != null) effective[mid] = Math.max(effective[mid], projEnd[o.id]);
      });
    });

    // Stage 4: lateral MS->MS forward pass (topological, cycle-guarded)
    var msById = {}; miles.forEach(function (m) { msById[m.id] = m; });
    var msPreds = {}; miles.forEach(function (m) { msPreds[m.id] = []; });
    (portfolio.milestoneEdges || []).forEach(function (e) {
      if (msPreds[e.toMs]) msPreds[e.toMs].push({ from: e.fromMs, lag: e.lagDays || 0 });
    });
    var msDone = {}, msStack = {};
    function liftMilestone(id) {
      if (msDone[id]) return effective[id];
      if (!msById[id]) return effective[id] || 0;
      if (msStack[id]) { cycles.push('MS:' + id); return effective[id]; }
      msStack[id] = true;
      var preds = msPreds[id];
      for (var i = 0; i < preds.length; i++) {
        if (msStack[preds[i].from]) { cycles.push('MS:' + preds[i].from); continue; }
        effective[id] = Math.max(effective[id], liftMilestone(preds[i].from) + preds[i].lag);
      }
      msStack[id] = false;
      msDone[id] = true;
      return effective[id];
    }
    miles.forEach(function (m) { liftMilestone(m.id); });

    // Stage 5: initiative projected end + headline slip
    var initProjEnd = {}, slip = {};
    inits.forEach(function (I) {
      var vals = [I.plannedEnd];
      miles.forEach(function (m) { if (m.initiativeId === I.id) vals.push(effective[m.id]); });
      objs.forEach(function (o) {
        if (o.initiativeId === I.id && (!o.milestoneIds || o.milestoneIds.length === 0)) {
          vals.push(projEnd[o.id]);
        }
      });
      var pe = Math.max.apply(null, vals);
      initProjEnd[I.id] = pe;
      slip[I.id] = pe - I.plannedEnd;
    });

    return {
      objectiveProjectedEnd: projEnd,
      objectiveEarliestEnd: projEndEarliest,
      objectiveAcceleration: objectiveAcceleration,
      objectiveWorkForecast: objectiveWorkForecast,
      objectiveScheduleSlip: objectiveScheduleSlip,
      milestoneEffective: effective,
      initiativeProjectedEnd: initProjEnd,
      longTermSlip: slip,
      gateEffective: gateEff,
      gateForecastEarliest: gateEarliest,
      gateAcceleration: gateAcceleration,
      gateSlipped: gateSlipped,
      objectiveRevisionDay: revDay,
      cycles: cycles

  }

  // ---- cross-doc linkage scope (execution → product/model KPIs) -----------
  // The product/model KPI targets a division's execution can report against: the products/models its objectives
  // are classified to (own or inherited from their initiative), the models under any classified product, and
  // every sub-product reachable by composition (transitive). Pure over the portfolio + the composition edges.
  // Returns { products:[ids], models:[ids] } (deduped; order not significant).
  function classifiedTargets(portfolio, composition, divisionId) {
    var models = (portfolio && portfolio.models) || [];
    var objs = ((portfolio && portfolio.objectives) || []).filter(function (o) { return o.divisionId === divisionId; });
    var prod = {}, mod = {};

    }
    return out;
  }

  // ---- FMEA / risk register (pure) -----------------------------------------

  // detection (each 1–10). "Unresolved" RPN skips resolved nodes and is zeroed
  // once the problem is resolved or its linked stage-gate has passed. Scoped to
  // an objective via objectiveId; optional gateId links to a stage-gate.

    occurrence: ['Unlikely','Remote','Very low','Low','Moderate','Medium-high','High','Very high','Very high+','Almost certain'],

  // ---- FMEA evidence -------------------------------------------------------------------------

  // experiment does (hypothesis, toggle, test, key reads) but lives ON the FMEA node rather than in the
  // experiment tree, so recording evidence against a cause never creates a Gantt bar or a gate
  // dependency. Values are sample -> keyReadId -> number.
  function fmeaNodeExperiments(node) { return (node && Array.isArray(node.experiments)) ? node.experiments : []; }

  }

  // Every experiment on a problem, tagged with the node it hangs off, so the section view can place a
  // chip in the right cell and the rollup can count evidence without walking the tree again.
  function fmeaAllExperiments(problem) {
    var out = [];
    ((problem && problem.modes) || []).forEach(function (m) {
      fmeaNodeExperiments(m).forEach(function (x) { out.push({ x: x, level: 'mode', mid: m.mid }); });
      (m.effects || []).forEach(function (e) {
        fmeaNodeExperiments(e).forEach(function (x) { out.push({ x: x, level: 'effect', mid: m.mid, eid: e.eid }); });
        (e.causes || []).forEach(function (c) {
          fmeaNodeExperiments(c).forEach(function (x) { out.push({ x: x, level: 'cause', mid: m.mid, eid: e.eid, cid: c.cid }); });
        });

  }

  // Codes are unique within a problem and stable once assigned, so deleting one never renumbers the
  // others out from under a reader who wrote "see EXP-4" in a note.
  // ---- Multiple logic trees ---------------------------------------------------------------------
  // An objective used to hold exactly one experiment tree. It now holds several INDEPENDENT trees:
  // each owns its own `experiments` map, so an id in one tree is invisible to another and
  // reachability physically cannot cross between them. Schema 1 (a bare tree object) is wrapped as a
  // single tree named "Main" on read, so old documents keep working and are rewritten on next save.
  //

  // FMEA evidence on every load and cost several sessions to find; this normaliser must never repeat it.
  function etbTreesOf(bag) {

      var active = bag.activeTid && ts.some(function (t) { return t.tid === bag.activeTid; })

  }

  // How many experiments still lie ahead of `expId`, shortest and longest path to termination.
  //   - a result whose branch ends in a terminal (FMEA, halt, target achieved) contributes 0
  //   - a result targeting experiment E contributes 1 + depth(E)
  //   - max is the longest such path, min the shortest
  // `unplanned` flags a result with neither a target nor a terminal: it counts as 0, but it means
  // "not thought through yet" rather than "ends here", and the UI should say so.
  // Cycles are possible via repeat_of, so the walk is depth-capped and reports `capped`.
  var ETB_DEPTH_CAP = 8;

      var next = {}; next[id] = 1;

        if (!targets.length) {
