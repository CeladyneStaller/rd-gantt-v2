    const out = [];
    for (let i = 0; i < 400; i++) {
      const day = Math.round((Date.UTC(ty, tm, 1) - Date.UTC(2020, 0, 1)) / 86400000);
      if (day > hi) break;
      if (day >= lo) out.push({ day: day, label: F.MON[tm], q: tm % 3 === 0 });
      tm++; if (tm >= 12) { tm -= 12; ty++; }
    }
    return out;
  }
};

/* ============================================================== the view */
function pgtGateWord(st) { return { passed: 'Passed', 'passed-late': 'Passed late', overdue: 'Overdue', pending: 'Pending', done: 'Done', 'passed-ontime': 'Passed' }[st] || F.cap(st || ''); }

function pgtRowVM(C, ctx, M, n, x, pw, sel, y) {
  const fin = PGT.fin, ro = !!ctx.ro, present = !!ctx.present;
  const g = n.g, S = C.state;
  const hasKids = n.kids.length > 0;
  const collapsed = PGT.isCollapsed(C, n);
  const dk = n.key;
  const ent = n.synthetic ? 'group' : n.entity;
  const drag = S.pg_drag && S.pg_drag.key === n.key && S.pg_drag.moved ? S.pg_drag : null;
  const dd = drag ? drag.dd : 0;
  const lvCls = n.synthetic ? 'lv-grp' : n.entity === 'division' ? 'lv-div' : 'lv-row';
  const r = {
    key: n.key, dk: dk, ent: ent,
    cls: 'pgt-row ' + lvCls + ' e-' + ent + (sel ? ' sel' : '') + (n.entity === 'milestone' && PGT.paused(ctx.P, n.rec) ? ' paused' : ''),
    pad: 'padding-left: ' + (n.depth * 16 + 6) + 'px',
    hasChev: hasKids, open: hasKids ? !collapsed : false, chevLabel: '', toggle: null, chevCls: 'pgt-chev' + (collapsed ? ' shut' : ''),
    noChev: !hasKids,
    dotCls: 'pgt-dot none', hasDot: false,
    hasTag: false, tag: '',
    link: false, plain: false, name: '', nameCls: 'pgt-nm', pick: null,
    acts: [], hasActs: false,
    shapes: [], hit: null, hasHit: false, sub: '', hasSub: false,
    y: y, h: n.synthetic ? PGT.H.grp : n.entity === 'division' ? PGT.H.div : PGT.H.row
  };
  const nameText = n.synthetic ? n.label : M.nameOf(n.rec);
  r.name = nameText;
  if (hasKids) {
    r.chevLabel = (collapsed ? 'Expand ' : 'Collapse ') + nameText;
    r.toggle = () => {
      const m = Object.assign({}, C.state.pg_col || {});
      m[n.key] = !PGT.isCollapsed(C, n);
      C.setState({ pg_col: m, pg_level: null, menu: '' });
    };
  }
  /* ---- label column ---- */
  if (n.synthetic) {
    r.hasDot = true; r.dotCls = 'pgt-dot ' + F.tone(n.tone);
    r.plain = true; r.nameCls = 'pgt-nm grp';
    r.hasSub = true; r.sub = F.plural(n.nObj, 'objective');
  } else {
    const e = n.entity;
    if (e === 'division' || e === 'initiative' || e === 'objective' || e === 'milestone' || e === 'stagegateset') {
      const tone = PGT.TONE[PGT.band(C, ctx, e === 'stagegateset' ? 'stagegateset' : e, n.rec.id)] || 'none';
      r.hasDot = true;
      r.dotCls = 'pgt-dot ' + (e === 'milestone' ? 'dia ' : '') + 't-' + tone;
    }
    if (e === 'division' || e === 'initiative' || e === 'objective' || e === 'milestone') {
      r.link = true;
      r.nameCls = 'pgt-nm lnk ink e-' + e + (e === 'milestone' ? ' dim' : '');
      r.pick = () => PGT.ped.lineage(C, ctx, e, n.rec.id);
    } else {
      r.plain = true; r.nameCls = 'pgt-nm static e-' + e;
      if (e === 'stagegate') { r.hasTag = true; r.tag = M.gateLabel(n.rec); }
      else if (e === 'milestonekr') { r.hasTag = true; r.tag = 'KR'; }
      else if (e === 'mstep') { r.hasTag = true; r.tag = 'KR-M' + n.rec.__krm; }
    }
    /* hover actions: edit, add a child here, delete (all through the Planning editor) */
    if (!ro && !present) {
      const word = PGT.ENT_WORD[e];
      if (e === 'division' || e === 'initiative' || e === 'objective' || e === 'milestone') {
        r.acts.push({ label: 'Edit ' + word, icon: 'edit', isEdit: true, isAdd: false, isDel: false, fn: () => PGT.ped.edit(C, ctx, e, n.rec.id) });
      }
      if (e === 'division') r.acts.push({ label: 'Add initiative here', icon: 'add', isEdit: false, isAdd: true, isDel: false, fn: () => PGT.addHere(C, ctx, 'initiative', n.rec.id) });
      if (e === 'initiative') {
        r.acts.push({ label: 'Add objective here', icon: 'add', isEdit: false, isAdd: true, isDel: false, fn: () => PGT.addHere(C, ctx, 'objective', n.rec.id) });
        r.acts.push({ label: 'Add milestone here', icon: 'addms', isEdit: false, isAdd: true, isDel: false, fn: () => PGT.addHere(C, ctx, 'milestone', n.rec.id) });
      }
      if (e === 'division' || e === 'initiative' || e === 'objective' || e === 'milestone') {
        r.acts.push({ label: 'Delete ' + word, icon: 'del', isEdit: false, isAdd: false, isDel: true, fn: () => PGT.ped.del(C, ctx, e, n.rec.id) });
      }
    }
  }
  r.acts.forEach((a) => { a.isAddMs = a.icon === 'addms'; a.isAdd = a.icon === 'add'; });
  r.hasActs = r.acts.length > 0;

  /* ---- track ---- */
  const shapes = [];
  const sh = (cls, style, title, txt) => shapes.push({ cls: cls, style: style, title: title || '', txt: txt == null ? '' : String(txt), hasTxt: txt != null && txt !== '' });
  const X = (d) => PGT.r3(x(d));
  const pick = () => {
    if (C._pgNoClick && Date.now() - C._pgNoClick < 600) { C._pgNoClick = 0; return; }
    const open = C.state.pg_sel === n.key && C.isMenu('pgt.pop');
    C.setState({ pg_sel: open ? '' : n.key, menu: open ? '' : 'pgt.pop' });
  };
  let hit = null;
  const dateFacts = (a, b) => PGT.span(a, b, ctx);
  if (n.synthetic) {
    if (fin(g.ds) && fin(g.de)) hit = { cls: 'pgt-gbar', style: 'left: ' + X(g.ds) + '%; width: ' + pw(X(g.de) - X(g.ds)), label: nameText + ', ' + dateFacts(g.ds, g.de), title: dateFacts(g.ds, g.de) };
  } else if (n.entity === 'board' || n.entity === 'boardtile') {
    const rec = n.rec;
    if (fin(g.ds) && fin(g.de)) hit = { cls: 'pgt-kbspan', style: 'left: ' + X(g.ds) + '%; width: ' + pw(X(g.de) - X(g.ds)), label: nameText + ', ' + dateFacts(g.ds, g.de), title: dateFacts(g.ds, g.de) };
    const todayIso = F.iso(ctx.today);
    if (n.entity === 'board') {
      const WORST = { red: 'overdue', orange: 'passed-late', green: 'passed', none: 'pending' };
      (rec.columns || []).forEach((c, k) => {
        let latest = null;
        (rec.tiles || []).forEach((t) => {
          const lane = (rec.swimlanes || []).find((l) => l.id === t.lane);
          const d = F.fromIso(RD.gateDueDates(rec.columns, lane, t).due[k]);
          if (d != null) latest = latest == null || d > latest ? d : latest;
        });
        if (latest == null) return;
        const sm = RD.boardGateSummary(rec, k, todayIso);
        sh('pgt-mk sq ' + (WORST[sm.worst] || 'pending'), 'left: ' + X(latest) + '%', c.name + ': ' + sm.passed + ' of ' + sm.total + ' passed', sm.passed);
      });
    } else {
      const b = rec.__board, lane = (b.swimlanes || []).find((l) => l.id === rec.lane);
      const due = RD.gateDueDates(b.columns, lane, rec).due;
      (b.columns || []).forEach((c, k) => {
        const d = F.fromIso(due[k]);
        if (d == null) return;
        const st = RD.gateTileState(b, rec, k, todayIso);
        sh('pgt-mk sq ' + (st === 'passed-ontime' ? 'passed' : st), 'left: ' + X(d) + '%', c.name + ': ' + pgtGateWord(st).toLowerCase() + ', due ' + PGT.date(d, ctx));
      });
    }
  } else if (g.kind === 'bar') {
    const ds = g.ds + dd, de = g.de + dd;
    const tone = PGT.TONE[n.entity === 'milestonekr' ? 'no-band' : PGT.band(C, ctx, n.entity, n.rec.id)] || 'none';
    const oEnd = n.entity === 'objective' ? g.ended : (n.entity === 'stagegateset' ? PGT.objEnd(ctx, M.objById[n.rec.objectiveId]) : null);
    const cancelled = !!(g.set && oEnd);
    const bits = [];
    if (g.set) bits.push(cancelled ? 'Cancelled' : 'Workstream');
    bits.push(dateFacts(ds, de));
    if (g.slip > 0 && fin(g.pe)) bits.push('projected ' + PGT.date(g.pe, ctx) + ' (+' + F.plural(g.slip, 'day') + ')');
    if (g.derived && (n.entity === 'objective' || n.entity === 'initiative')) bits.push('dates inferred');
    hit = {
      cls: 'pgt-bar t-' + tone + (g.derived ? ' derived' : '') + (g.set ? ' set' : '') + (cancelled ? ' cancelled' : '') + (drag ? ' drag' : '') + (sel ? ' sel' : ''),
      style: 'left: ' + X(ds) + '%; width: ' + pw(X(de) - X(ds)),
      label: nameText + ', ' + bits.join(', '), title: F.cap(bits.join(', '))
    };
    if (g.slip > 0 && fin(g.pe) && !drag) {
      const sx = X(fin(g.slipFrom) ? g.slipFrom : g.de);
      sh('pgt-slip', 'left: ' + sx + '%; width: ' + pw(PGT.r3(X(g.pe) - sx)), 'Slip: projected ' + PGT.date(g.pe, ctx) + ', ' + F.plural(g.slip, 'day') + ' past the planned end');
    }
    if (n.entity === 'objective' && oEnd && fin(oEnd.endedDay)) {
      sh('pgt-end ' + (oEnd.status === 'abandoned' ? 'abandoned' : 'achieved'), 'left: ' + X(oEnd.endedDay) + '%', (oEnd.status === 'abandoned' ? 'Abandoned ' : 'Achieved ') + PGT.date(oEnd.endedDay, ctx));
    }
  } else if (g.gate) {
    const st = g.state || 'pending';
    const oEnd = PGT.objEnd(ctx, M.objById[n.rec.objectiveId]);
    const cnl = !!oEnd && st !== 'passed' && st !== 'passed-late';
    const missed = cnl && oEnd.status === 'abandoned';
    const ex = X(fin(g.eff) ? g.eff : g.planned);
    if (!cnl && g.slipped && fin(g.baseline)) {
      const bx = X(g.baseline);
      sh('pgt-conn committed', 'left: ' + Math.min(bx, ex) + '%; width: ' + pw(PGT.r3(Math.abs(ex - bx))), 'Committed ' + PGT.date(g.baseline, ctx));
      sh('pgt-mk sq ghost', 'left: ' + bx + '%', 'Committed ' + PGT.date(g.baseline, ctx));
    } else if (!cnl && fin(g.eff) && fin(g.planned) && g.eff !== g.planned) {
      const px = X(g.planned);
      sh('pgt-conn', 'left: ' + Math.min(px, ex) + '%; width: ' + pw(PGT.r3(Math.abs(ex - px))), 'Planned ' + PGT.date(g.planned, ctx));
      sh('pgt-mk sq ghost', 'left: ' + px + '%', 'Planned ' + PGT.date(g.planned, ctx));
    }
    const word = missed ? 'Missed' : cnl ? 'Cancelled' : pgtGateWord(st);
    const t = word + (!cnl && fin(g.eff) ? ', forecast ' + PGT.date(g.eff, ctx) : '') + (fin(g.planned) ? ', planned ' + PGT.date(g.planned, ctx) : '');
    hit = { cls: 'pgt-mk sq ' + st + (cnl ? ' cancelled' : '') + (missed ? ' missed' : '') + (sel ? ' sel' : ''), style: 'left: ' + ex + '%', label: nameText + ': ' + t, title: t };
  } else if (n.entity === 'mstep') {
    const st = g.msStatus === 'done' ? 'done' : g.msStatus === 'overdue' ? 'overdue' : 'pending';
    const t = nameText + ', due ' + PGT.date(g.planned, ctx) + ', ' + pgtGateWord(g.msStatus).toLowerCase();
    hit = { cls: 'pgt-mk ' + st + (sel ? ' sel' : ''), style: 'left: ' + X(g.planned) + '%', label: t, title: t };
  } else {
    /* milestones read like stage-gates: a ghost at the planned date, a connector, and a status
       marker at the completion date (or the projection) */
    const ms = n.rec;
    const pausedMs = PGT.paused(ctx.P, ms);
    const st = PGT.msDia(ctx, ms);
    const planned = fin(g.planned) ? g.planned + dd : null;
    let mark = fin(g.actual) ? g.actual : fin(g.eff) ? g.eff : null;
    if (pausedMs) mark = planned;                       // paused: the intended date as a ghost
    else if (drag && !fin(g.actual)) mark = planned;    // dragging: preview the new planned date
    const px = X(planned), ex = fin(mark) ? X(mark) : px;
    if (!pausedMs && fin(mark) && fin(planned) && mark !== planned) {
      sh('pgt-conn', 'left: ' + Math.min(px, ex) + '%; width: ' + pw(PGT.r3(Math.abs(ex - px))), 'Planned ' + PGT.date(planned, ctx));
      sh('pgt-mk ghost', 'left: ' + px + '%', 'Planned ' + PGT.date(planned, ctx));
    }
    const slip = fin(g.actual) && fin(g.planned) ? g.actual - g.planned : null;
    let t = fin(g.actual) ? 'Completed ' + PGT.date(g.actual, ctx) : (fin(mark) ? 'Projected ' + PGT.date(mark, ctx) : 'Planned');
    if (slip != null && slip !== 0) t += ' (' + (slip > 0 ? '+' : '') + F.plural(slip, 'day') + ')';
    if (pausedMs) {
      const stt = RD.milestoneState(ctx.P.milestoneState, ms.id) || {};
      t = (stt.status === 'deprioritized' ? 'Deprioritized' : 'Paused') + ', was planned ' + PGT.date(g.planned, ctx);
    }
    hit = { cls: 'pgt-mk ' + (pausedMs ? 'ghost paused' : st) + (drag ? ' drag' : '') + (sel ? ' sel' : ''), style: 'left: ' + ex + '%', label: nameText + ': ' + t, title: t };
  }
  if (hit) {
    hit.click = pick;
    /* pointer drag: objectives and initiatives with their own planned dates, milestones with a
       planned date, never in read-only and never for ended work. Writes plannedStart / plannedEnd
       (plannedDate for a milestone) through C.mutate; "Week earlier / later" in the details do the
       same without a pointer. */
    const canDrag = PGT.canShift(C, ctx, n);
    hit.drag = canDrag;
    hit.down = canDrag ? (e) => {
      if (e && e.button != null && e.button !== 0) return;
      let w = 0;
      try {
        const el = e.currentTarget;
        const par = el && el.parentElement;
        w = (par && par.getBoundingClientRect ? par.getBoundingClientRect().width : 0) || (el.getBoundingClientRect ? el.getBoundingClientRect().width : 0);
        if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
      } catch (err) { w = 0; }
      C.setState({ pg_drag: { key: n.key, x0: (e && e.clientX) || 0, w: w || 800, span: M.hi - M.lo, dd: 0, moved: false } });
    } : null;
    hit.move = canDrag ? (e) => {
      const d0 = C.state.pg_drag;
      if (!d0 || d0.key !== n.key) return;
      const dx = ((e && e.clientX) || 0) - d0.x0;
      const ddn = Math.round((dx / d0.w) * d0.span);
      const moved = d0.moved || Math.abs(dx) > 4;
      if (ddn !== d0.dd || moved !== d0.moved) C.setState({ pg_drag: Object.assign({}, d0, { dd: ddn, moved: moved }) });
    } : null;
    hit.up = canDrag ? () => {
      const d0 = C.state.pg_drag;
      if (!d0 || d0.key !== n.key) return;
      C.setState({ pg_drag: null });
      if (d0.moved) {
        C._pgNoClick = Date.now();                   // the click that follows a drag is not a selection
        if (d0.dd) PGT.shift(C, n.entity, n.rec.id, d0.dd);
      }
    } : null;
    hit.cancel = canDrag ? () => C.setState({ pg_drag: null }) : null;
    hit.bar = /pgt-(bar|gbar|kbspan)/.test(hit.cls);
    hit.mk = !hit.bar;
  }
  r.shapes = shapes;
  r.hit = hit || { cls: '', style: '', label: '', title: '', click: null, down: null, move: null, up: null, cancel: null, bar: false, mk: false, drag: false };
  r.hasHit = !!hit;
  r.hitBar = !!hit && hit.bar;
  r.hitMk = !!hit && !hit.bar;
  return r;
}

PGT.canShift = function (C, ctx, n) {
  if (ctx.ro || ctx.present || n.synthetic) return false;
  const r = n.rec;
  if (n.entity === 'objective') return PGT.fin(r.plannedStart) && PGT.fin(r.plannedEnd) && !PGT.objEnd(ctx, r);
  if (n.entity === 'initiative') return PGT.fin(r.plannedStart) && PGT.fin(r.plannedEnd);
  if (n.entity === 'milestone') return PGT.fin(r.plannedDate) && r.completedDate == null && !PGT.paused(ctx.P, r);
  return false;
};

/* details popover for the selected row (the Calm replacement for today's hover titles) */
function pgtPopVM(C, ctx, M, n, row, rowsH) {
  const fin = PGT.fin, P = ctx.P, em = ctx.em, ro = !!ctx.ro || !!ctx.present;
  const facts = [];
  const fact = (k, v, cls) => facts.push({ k: k, v: v == null || v === '' ? '—' : String(v), cls: cls || '' });
  const acts = [];
  const act = (label, fn, cls) => acts.push({ label: label, fn: fn, cls: 'btn sm' + (cls ? ' ' + cls : '') });
  let name = n.synthetic ? n.label : M.nameOf(n.rec), where = '';
  let handoff = null, handoffApp = '';
  const g = n.g;
  const scoreFact = (s) => { const t = F.band(s); return s == null ? 'No score yet' : F.score(s) + ', ' + F.bandWord(t).toLowerCase(); };
  const divName = (id) => { const d = (P.divisions || []).find((x) => x.id === id); return d ? d.name : id; };
  const initOf = (id) => (P.initiatives || []).find((x) => x.id === id) || null;
  const shiftActs = () => {
    if (!PGT.canShift(C, ctx, n)) return;
    act('Week earlier', () => PGT.shift(C, n.entity, n.rec.id, -7));
    act('Week later', () => PGT.shift(C, n.entity, n.rec.id, 7));
  };
  if (n.synthetic) {
    where = F.cap(PGT.LEVEL_WORD[n.dim] ? PGT.LEVEL_WORD[n.dim].replace(/s$/, '') : 'Group');
    fact('Objectives', String(n.nObj));
    const vs = [];
    (function walk(list) { list.forEach((k) => { if (k.entity === 'objective') { const s = RD.rollupObjective(k.rec.id, P, em); if (s != null) vs.push(s); } walk(k.kids); }); })(n.kids);
    fact('Score', vs.length ? scoreFact(K.sum(vs) / vs.length) : 'No score yet');
    fact('Spans', PGT.span(g.ds, g.de, ctx));
  } else if (n.entity === 'division') {
    const d = n.rec;
    const u = (P.units || []).find((x) => x.id === d.unitId);
    where = 'Division' + (u ? ', ' + u.name : '');
    fact('Score', scoreFact(RD.rollupDivision(d.id, P, em)));
    fact('Initiatives', String((P.initiatives || []).filter((i) => i.divisionId === d.id).length));
    fact('Spans', PGT.span(g.ds, g.de, ctx));
    if (!ro) { act('Edit division', () => PGT.ped.edit(C, ctx, 'division', d.id)); act('Add initiative', () => PGT.addHere(C, ctx, 'initiative', d.id)); }
    act('Show lineage', () => PGT.ped.lineage(C, ctx, 'division', d.id), 'q');
  } else if (n.entity === 'initiative') {
    const i = n.rec;
    where = 'Initiative, ' + divName(i.divisionId);
    fact('Planned', fin(i.plannedStart) || fin(i.plannedEnd) ? PGT.span(i.plannedStart, i.plannedEnd, ctx) : 'No dates yet');
    if (fin(g.pe) && g.slip > 0) fact('Projected end', PGT.date(g.pe, ctx) + ' (+' + F.plural(g.slip, 'day') + ')', 'tx-bad');
    else if (fin(g.pe)) fact('Projected end', PGT.date(g.pe, ctx));
    if (g.container) fact('Bar ends', 'With its work: no targets of its own');
    fact('Score', scoreFact(RD.rollupInitiative(i.id, P, em)));
    const nObj = (P.objectives || []).filter((o) => o.initiativeId === i.id).length;
    const mils = (P.milestones || []).filter((m) => m.initiativeId === i.id);
    const nP = mils.filter((m) => PGT.paused(P, m)).length;
    fact('Contains', F.plural(nObj, 'objective') + ', ' + F.plural(mils.length, 'milestone') + (nP ? ' (' + nP + ' paused)' : ''));
    shiftActs();
    if (!ro) {
      act('Edit initiative', () => PGT.ped.edit(C, ctx, 'initiative', i.id));
      act('Add objective', () => PGT.addHere(C, ctx, 'objective', i.id));
      act('Add milestone', () => PGT.addHere(C, ctx, 'milestone', i.id));
    }
    act('Show lineage', () => PGT.ped.lineage(C, ctx, 'initiative', i.id), 'q');
  } else if (n.entity === 'objective') {
    const o = n.rec, ini = initOf(o.initiativeId);
    where = 'Objective, ' + (ini ? M.nameOf(ini) : divName(o.divisionId));
    const own = Array.isArray(o.owner) ? o.owner : (o.owner ? [o.owner] : []);
    fact('Owner', own.length ? F.people(own) : 'No owner yet');
    fact('Quarter', o.quarter ? F.q(o.quarter) : 'No quarter');
    fact('Planned', fin(o.plannedStart) && fin(o.plannedEnd) ? PGT.span(o.plannedStart, o.plannedEnd, ctx) : 'Inferred: ' + PGT.span(g.ds, g.de, ctx));
    if (g.ended) {
      fact(g.ended.status === 'abandoned' ? 'Abandoned' : 'Achieved', PGT.date(g.ended.endedDay, ctx) + (g.slip > 0 ? ' (+' + F.plural(g.slip, 'day') + ' past the planned end)' : ''), g.ended.status === 'abandoned' ? 'tx-bad' : 'tx-ok');
    } else if (fin(g.pe)) {
      fact('Projected end', PGT.date(g.pe, ctx) + (g.slip > 0 ? ' (+' + F.plural(g.slip, 'day') + ')' : ''), g.slip > 0 ? 'tx-bad' : '');
    }
    fact('Score', scoreFact(RD.rollupObjective(o.id, P, em)));
    const qr = o.quarter ? F.qRange(o.quarter) : null;
    if (qr && fin(o.plannedStart) && fin(o.plannedEnd) && (o.plannedEnd > qr.end || o.plannedStart < qr.start)) {
      fact('Heads-up', 'Its dates run outside ' + F.q(o.quarter) + ', its quarter tag', 'tx-warn');
    }
    shiftActs();
    if (!ro) act('Edit objective', () => PGT.ped.edit(C, ctx, 'objective', o.id));
    act('Show lineage', () => PGT.ped.lineage(C, ctx, 'objective', o.id), 'q');
    handoffApp = PGT.divKind(ctx, o.divisionId) === 'biz' ? 'sales' : 'exec';
    handoff = () => PGT.openIn(C, ctx, o.id);
  } else if (n.entity === 'milestone') {
    const ms = n.rec, ini = initOf(ms.initiativeId);
    where = 'Milestone, ' + (ini ? M.nameOf(ini) : 'no initiative');
    const pausedMs = PGT.paused(P, ms);
    const stt = pausedMs ? (RD.milestoneState(P.milestoneState, ms.id) || {}) : null;
    const achieved = RD.milestoneAchieved(ms, em);
    fact('Planned', PGT.date(ms.plannedDate, ctx));
    if (fin(ms.completedDate)) fact('Completed', PGT.date(ms.completedDate, ctx) + (fin(ms.plannedDate) && ms.completedDate !== ms.plannedDate ? ' (' + (ms.completedDate > ms.plannedDate ? '+' : '') + F.plural(ms.completedDate - ms.plannedDate, 'day') + ')' : ''));
    else if (!pausedMs && fin(g.eff) && fin(ms.plannedDate) && g.eff > ms.plannedDate && !achieved) fact('Effective', PGT.date(g.eff, ctx) + ' (+' + F.plural(g.eff - ms.plannedDate, 'day') + ')', 'tx-bad');
    let status = '', cls = '';
    if (achieved) { status = fin(ms.completedDate) ? 'Achieved' : 'Achieved on its targets'; cls = 'tx-ok'; }
    else if (pausedMs) { status = (stt.status === 'deprioritized' ? 'Deprioritized' : 'Paused') + (fin(stt.day) ? ' on ' + PGT.date(stt.day, ctx) : '') + (stt.note ? '. ' + stt.note : ''); cls = 'tx-warn'; }
    else { const st = PGT.msDia(ctx, ms); status = st === 'overdue' ? 'Overdue' : 'Pending, ' + F.rel(ms.plannedDate, ctx.today); cls = st === 'overdue' ? 'tx-bad' : ''; }
    fact('Status', status, cls);
    const s = RD.milestoneScore(ms.id, em);
    fact('Score', s == null ? 'No reading yet' : scoreFact(s));
    fact('TRL / MRL', (ms.trl ? ms.trl : '—') + ' / ' + (ms.mrl ? ms.mrl : '—'));
    shiftActs();
    if (!ro) {
      if (!achieved) act('Mark achieved', () => PGT.setAchieved(C, ctx, ms.id, true));
      else if (fin(ms.completedDate)) act('Reopen milestone', () => PGT.setAchieved(C, ctx, ms.id, false));
      if (pausedMs) act('Resume milestone', () => PGT.msStatus(C, ctx, ms.id, 'active', ''));
    }
    if (ms.milestoneReport || !ro) act(ms.milestoneReport ? 'Open report' : 'Create report', () => { if (typeof PMS !== 'undefined') PMS.openReport(C, ctx, ms.id); });
    if (!ro) act('Edit milestone', () => PGT.ped.edit(C, ctx, 'milestone', ms.id));
    act('Show lineage', () => PGT.ped.lineage(C, ctx, 'milestone', ms.id), 'q');
  } else if (n.entity === 'stagegate' || n.entity === 'stagegateset') {
    const objId = n.rec.objectiveId, o = M.objById[objId];
    where = (n.entity === 'stagegate' ? 'Stage-gate ' + M.gateLabel(n.rec) : 'Workstream') + ', ' + (o ? M.nameOf(o) : objId);
    if (n.entity === 'stagegate') {
      const gt = n.rec, st = g.state;
      const oEnd = PGT.objEnd(ctx, o);
      const cnl = !!oEnd && st !== 'passed' && st !== 'passed-late';
      fact('Planned', PGT.date(gt.plannedDate, ctx));
      if (fin(gt.baselineDate)) fact('Committed', PGT.date(gt.baselineDate, ctx) + (gt.locked ? ', locked' : ''), g.slipped ? 'tx-bad' : '');
      if (fin(gt.actualDate)) fact('Passed', PGT.date(gt.actualDate, ctx));
      else if (!cnl && fin(g.eff)) fact('Forecast', PGT.date(g.eff, ctx), g.eff > gt.plannedDate ? 'tx-warn' : '');
      fact('Status', cnl ? (oEnd.status === 'abandoned' ? 'Missed: the objective was abandoned' : 'Cancelled: the objective ended') : pgtGateWord(st), st === 'overdue' || (cnl && oEnd.status === 'abandoned') ? 'tx-bad' : st === 'passed' ? 'tx-ok' : st === 'passed-late' ? 'tx-warn' : '');
    } else {
      const gts = n.rec.__gates || [];
      const passed = gts.filter((x) => { const st = RD.classifyGate(x, ctx.today); return st === 'passed' || st === 'passed-late'; }).length;
      fact('Stage-gates', passed + ' of ' + gts.length + ' passed');
      fact('Spans', PGT.span(g.ds, g.de, ctx));
    }
    handoffApp = o && PGT.divKind(ctx, o.divisionId) === 'biz' ? 'sales' : 'exec';
    handoff = () => PGT.openIn(C, ctx, objId, 'gates');
  } else if (n.entity === 'milestonekr' || n.entity === 'mstep') {
    const objId = n.entity === 'mstep' ? n.rec.__objId : n.rec.objectiveId, o = M.objById[objId];
    where = (n.entity === 'mstep' ? 'Milestone step, KR-M' + n.rec.__krm : 'Milestone key result') + ', ' + (o ? M.nameOf(o) : objId);
    if (n.entity === 'mstep') {
      fact('Due', PGT.date(g.planned, ctx));
      fact('Completion', F.pct(n.rec.completion));
      fact('Status', pgtGateWord(n.rec.status), n.rec.status === 'overdue' ? 'tx-bad' : n.rec.status === 'done' ? 'tx-ok' : '');
    } else {
      const steps = M.krSteps(n.rec);
      fact('Dated steps', steps.filter((s) => s.status === 'done').length + ' of ' + steps.length + ' done');
      fact('Spans', PGT.span(g.ds, g.de, ctx));
    }
    handoffApp = o && PGT.divKind(ctx, o.divisionId) === 'biz' ? 'sales' : 'exec';
    handoff = () => PGT.openIn(C, ctx, objId, 'krs');
  } else if (n.entity === 'board' || n.entity === 'boardtile') {
    const b = n.entity === 'board' ? n.rec : n.rec.__board, o = M.objById[b.objectiveId];
    where = (n.entity === 'board' ? 'Kanban board' : 'Workstream on ' + (b.name || 'a board')) + ', ' + (o ? M.nameOf(o) : b.objectiveId);
    const todayIso = F.iso(ctx.today);
    if (n.entity === 'board') {
      (b.columns || []).forEach((c, k) => { const sm = RD.boardGateSummary(b, k, todayIso); fact(c.name, sm.passed + ' of ' + sm.total + ' passed'); });
    } else {
      const t = n.rec, lane = (b.swimlanes || []).find((l) => l.id === t.lane);
      const due = RD.gateDueDates(b.columns, lane, t).due;
      (b.columns || []).forEach((c, k) => { const st = RD.gateTileState(b, t, k, todayIso); fact(c.name, pgtGateWord(st) + (due[k] ? ', due ' + PGT.date(F.fromIso(due[k]), ctx) : '')); });
    }
    handoffApp = o && PGT.divKind(ctx, o.divisionId) === 'biz' ? 'sales' : 'exec';
    handoff = () => PGT.openIn(C, ctx, b.objectiveId, 'gates');
  }
  /* placement: below the row when there is room, else above; horizontally at the bar */
  const actRows = Math.ceil((acts.length + (handoff ? 1 : 0)) / 3);
  const popH = 66 + facts.length * 22 + actRows * 38;
  const below = row.y + row.h + 4 + popH <= rowsH + 8 || row.y - 4 < popH;
  const lx = (d) => (PGT.fin(d) ? Math.max(0, Math.min(1, (d - M.lo) / (M.hi - M.lo))) : 0);
  let f0 = 0, f1 = 0;
  if (g.kind === 'bar') { f0 = lx(g.ds); f1 = lx(g.de); } else { f0 = lx(fin(g.actual) ? g.actual : fin(g.eff) ? g.eff : g.planned); f1 = f0; }
  const horiz = f0 < 0.5
    ? 'left: calc(var(--pg-labelw) + (100% - var(--pg-labelw) - 20px) * ' + f0.toFixed(4) + ')'
    : 'right: calc(20px + (100% - var(--pg-labelw) - 20px) * ' + (1 - f1).toFixed(4) + ')';
  const vert = below ? 'top: ' + (row.y + row.h + 4) + 'px' : 'bottom: calc(100% - ' + (row.y - 4) + 'px)';
  return {
    name: name, where: where, facts: facts, acts: acts, hasActs: acts.length > 0 || !!handoff,
    style: horiz + '; ' + vert, below: below, popH: popH,
    hasHandoff: !!handoff, handoff: handoff || (() => {}), handoffLabel: handoffApp === 'sales' ? 'Open in Sales' : 'Open in Execution',
    handoffHref: handoffApp === 'sales' ? 'sales_app.html' : 'execution_app.html',
    close: () => C.setState({ pg_sel: '', menu: '' }),
    minH: below ? row.y + row.h + 12 + popH : 0
  };
}

/* Per-viewer Gantt preferences live in this browser under today's keys (rd_gantt_quarters,
   rd_gantt_showpaused, rd_gantt_labelw), never in the plan. Blocked storage leaves them for the visit. */
function pgtLS(key, val) {
  try {
    const ls = window.localStorage;
    if (!ls) return null;
    if (val === undefined) return ls.getItem(key);
    if (val === null) ls.removeItem(key); else ls.setItem(key, String(val));
  } catch (e) { /* storage blocked: the choice lasts for this visit only */ }
  return null;
}
function pgtSetQuarters(C, list) {
  pgtLS('rd_gantt_quarters', JSON.stringify(list || []));
  C.setState({ pg_quarters: list || [], pg_timeframe: true, pg_sel: '', menu: '' });
}

MODS.pgt = {
  state() {
    let qs = [];
    try { const raw = pgtLS('rd_gantt_quarters'); const a = raw ? JSON.parse(raw) : null; qs = Array.isArray(a) ? a.filter((q) => RD.quarterRange(q)) : []; } catch (e) { qs = []; }
    const lw = parseInt(pgtLS('rd_gantt_labelw') || '', 10);
    return {
      pg_active: false, pg_timeframe: false,          // the shell seeds these from the URL simulation
      pg_quarters: qs, pg_showPaused: pgtLS('rd_gantt_showpaused') === '1',
      pg_labelw: isFinite(lw) ? K.clamp(lw, PGT.LMIN, PGT.LMAX) : PGT.LDEF,
      pg_col: {}, pg_level: null, pg_sel: '', pg_drag: null, pg_rz: null
    };
  },
  vm(C, ctx) {
    const S = C.state, fin = PGT.fin;
    const M = PGT.model(C, ctx);
    const ro = !!ctx.ro, present = !!ctx.present;
    const P = ctx.P;
    /* ---- toolbar ---- */
    const levels = M.levels.map((l) => ({
      label: l.label, on: S.pg_level === l.id ? 'true' : 'false',
      pick: () => C.setState({ pg_col: PGT.collapseMap(M, l.id), pg_level: l.id, pg_sel: '', menu: '' })
    }));
    const nPaused = (function () { try { return RD.pausedMilestoneIds(P.milestoneState, P.milestones).length; } catch (e) { return 0; } })();
    const tfOn = !!S.pg_timeframe;
    /* ---- timeframe grid ---- */
    const eff = PGT.effQuarters(C, ctx);
    const effSet = {}; eff.forEach((q) => { effSet[q] = 1; });
    const impSet = {}; RD.quarterSpanImplied(eff).forEach((q) => { impSet[q] = 1; });
    const chosen = {}; (S.pg_quarters || []).forEach((q) => { chosen[q] = 1; });
    const nowQ = PGT.curQ(ctx);
    const years = PGT.gridYears(C, ctx).map((y) => {
      const qs = RD.yearQuarters(y);
      const full = qs.every((q) => chosen[q]);
      return {
        label: String(y), on: full ? 'true' : 'false', cls: 'pgt-yr' + (full ? ' on' : ''),
        title: full ? 'Clear this year' : 'Select the whole year', aria: (full ? 'Clear ' : 'Select all of ') + y,
        pick: () => pgtSetQuarters(C, RD.toggleYear(PGT.effQuarters(C, C.ctx || ctx), y)),
        qs: qs.map((q) => {
          const on = !!effSet[q], imp = !!impSet[q];
          return {
            label: 'Q' + q.slice(-1), aria: F.q(q), on: on ? 'true' : 'false',
            cls: 'pgt-q' + (on ? ' on' : '') + (imp ? ' imp' : '') + (q === nowQ ? ' now' : ''),
            title: imp ? 'Spanned by your selection. Click to select it explicitly.' : on ? 'Click to remove' : 'Click to add',
            pick: () => pgtSetQuarters(C, RD.toggleQuarter(PGT.effQuarters(C, C.ctx || ctx), q))
          };
        })
      };
    });
    const rr = RD.quarterSpanRange(eff);
    const rangeLabel = rr ? (rr.from === rr.to ? F.q(rr.from) : F.q(rr.from) + ' to ' + F.q(rr.to)) : '';
    const none = !(S.pg_quarters || []).length;
    /* ---- chart ---- */
    const rowsN = PGT.flatRows(C, M);
    const lo = M.lo, hi = M.hi;
    const x = (d) => (d - lo) / (hi - lo) * 100;
    const pw = (v) => 'max(' + PGT.r3(v) + '%, 2px)';
    const ticks = PGT.quarterTicks(lo, hi);
    const months = PGT.monthTicks(lo, hi);
    const grid = ticks.filter((t) => t.day >= lo && t.day <= hi).map((t) => ({ cls: 'pgt-gq', style: 'left: ' + PGT.r3(x(t.day)) + '%' }))
      .concat(months.filter((t) => !t.q).map((t) => ({ cls: 'pgt-gm', style: 'left: ' + PGT.r3(x(t.day)) + '%' })));
    /* the quarter that starts before the axis is labelled at its left edge, unless the next
       quarter starts so close that the two labels would collide */
    const axis = ticks.filter((t, i) => t.day >= lo || !ticks[i + 1] || x(ticks[i + 1].day) >= 9)
      .map((t) => ({ cls: 'pgt-ql', style: 'left: ' + PGT.r3(Math.max(0, x(t.day))) + '%', text: t.label }))
      .concat(months.filter((t) => !t.q).map((t) => ({ cls: 'pgt-ml', style: 'left: ' + PGT.r3(Math.max(0, x(t.day))) + '%', text: t.label })));
    const td = ctx.today;
    const todayIn = td >= lo && td <= hi;
    const sel = S.pg_sel && C.isMenu('pgt.pop') ? S.pg_sel : '';
    let y = PGT.H.axis;
    const rows = rowsN.map((n) => {
      const rv = pgtRowVM(C, ctx, M, n, x, pw, sel === n.key, y);
      y += rv.h;
      return rv;
    });
    const rowsH = y;
    const hasGates = rowsN.some((n) => n.entity === 'stagegate');
    const hasMs = rowsN.some((n) => n.entity === 'milestone' || n.entity === 'mstep');
    const hasKb = rowsN.some((n) => n.entity === 'board' || n.entity === 'boardtile');
    let pop = null, minH = 0;
    if (sel) {
      const i = rowsN.findIndex((n) => n.key === sel);
      if (i >= 0) { pop = pgtPopVM(C, ctx, M, rowsN[i], rows[i], rowsH); minH = pop.minH; }
    }
    const lw = K.clamp(Math.round(fin(S.pg_labelw) ? S.pg_labelw : PGT.LDEF), PGT.LMIN, PGT.LMAX);
    const filtered = M.anyFilter || M.activeOnly || !!M.qWin;
    return {
      toolbar: !present,
      levels: levels,
      expandOn: S.pg_level === '' ? 'true' : 'false',
      expandAll: () => C.setState({ pg_col: PGT.collapseMap(M, null), pg_level: '', pg_sel: '', menu: '' }),
      activeOn: S.pg_active ? 'true' : 'false', activeCls: 'chip' + (S.pg_active ? ' on' : ''),
      toggleActive: () => C.setState({ pg_active: !C.state.pg_active, pg_sel: '', menu: '' }),
      hasPaused: nPaused > 0, pausedLabel: nPaused + ' paused',
      pausedOn: S.pg_showPaused ? 'true' : 'false', pausedCls: 'chip' + (S.pg_showPaused ? ' on' : ''),
      pausedTitle: (S.pg_showPaused ? 'Hide' : 'Show') + ' paused and deprioritized milestones. They are kept, and never affect dates or scores.',
      togglePaused: () => { const on = !C.state.pg_showPaused; pgtLS('rd_gantt_showpaused', on ? '1' : '0'); C.setState({ pg_showPaused: on, pg_sel: '', menu: '' }); },
      tfOn: tfOn ? 'true' : 'false', tfCls: 'chip' + (tfOn ? ' on' : ''),
      toggleTf: () => C.setState({ pg_timeframe: !C.state.pg_timeframe, pg_sel: '', menu: '' }),
      tfGridCls: 'pgt-tf' + (tfOn ? '' : ' off'),
      years: years, rangeLabel: rangeLabel,
      tfHintOff: !tfOn, tfHintNone: tfOn && none, tfCanClear: tfOn && !none,
      clearTf: () => { pgtLS('rd_gantt_quarters', '[]'); C.setState({ pg_quarters: [], pg_sel: '', menu: '' }); },
      /* chart */
      empty: !rows.length,
      emptyText: filtered ? 'No matching items to chart. Clear a filter, turn off Active only, or widen the timeframe.' : 'No scheduled, dated items to chart.',
      chartStyle: '--pg-labelw: ' + lw + 'px' + (minH ? '; min-height: ' + minH + 'px' : ''),
      labelw: lw,
      grid: grid, axis: axis, todayIn: todayIn,
      todayStyle: 'left: ' + PGT.r3(x(td)) + '%',
      todayLabel: 'Today, ' + F.day(td),
      rows: rows,
      pop: pop, hasPop: !!pop,
      /* name-column resize: pointer drag on the divider, double-click resets, arrows nudge */
      gripCls: 'pgt-grip' + (S.pg_rz ? ' drag' : ''),
      gripDown: (e) => {
        if (e && e.button != null && e.button !== 0) return;
        try { if (e.preventDefault) e.preventDefault(); if (e.currentTarget && e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
        C.setState({ pg_rz: { x0: (e && e.clientX) || 0, w0: lw } });
      },
      gripMove: (e) => {
        const z = C.state.pg_rz;
        if (!z) return;
        const w = K.clamp(Math.round(z.w0 + (((e && e.clientX) || 0) - z.x0)), PGT.LMIN, PGT.LMAX);
        if (w !== C.state.pg_labelw) C.setState({ pg_labelw: w });
      },
      gripUp: () => { if (C.state.pg_rz) { pgtLS('rd_gantt_labelw', K.clamp(Math.round(C.state.pg_labelw || PGT.LDEF), PGT.LMIN, PGT.LMAX)); C.setState({ pg_rz: null }); } },
      gripReset: () => { pgtLS('rd_gantt_labelw', null); C.setState({ pg_labelw: PGT.LDEF, pg_rz: null }); },
      gripKey: (e) => {
        const k = e && e.key;
        const cur = K.clamp(C.state.pg_labelw || PGT.LDEF, PGT.LMIN, PGT.LMAX);
        if (k === 'ArrowLeft' || k === 'ArrowRight') {
          if (e.preventDefault) e.preventDefault();
          const w = K.clamp(cur + (k === 'ArrowLeft' ? -20 : 20), PGT.LMIN, PGT.LMAX);
          pgtLS('rd_gantt_labelw', w);
          C.setState({ pg_labelw: w });
        } else if (k === 'Home' || k === 'Enter') { pgtLS('rd_gantt_labelw', null); C.setState({ pg_labelw: PGT.LDEF }); }
      },
      /* legend */
      hasGates: hasGates, hasMsLegend: hasMs, hasKb: hasKb,
      canDrag: !ro && !present,
      lo: lo, hi: hi,
      axisTitle: M.custom ? (M.dims.length ? M.dims.map((d) => (PGT.LEVEL_WORD[d] || d).toLowerCase()).join(', ') + ' and objectives' : 'Objectives') : 'Units, divisions, initiatives and objectives'
    };
  }
};

/* ================= module: pms (mods/pms/mod.js) */
/* ============================================================================
   P-gantt: the Planning Milestones tab and the milestone report (mods/pms).
   Ported from planning_app.template.html renderMilestones (L2366-2463) and the
   milestone report modal (L2464-2608). Shares PGT (mods/pgt) for the schedule
   cascade, pause state and the editor hand-offs.

   Public namespace PMS:
     PMS.openReport(C, ctx, msId)   open the report sheet ('pms.report', wide); stacks over an open
                                    sheet (the milestone editor's Report button)
     PMS.number(P, ms)              '<ABBR>-NN', ranked by planned date within the product
     PMS.productOf(P, ms)           the milestone's product (through its initiative, a model resolves
                                    to its product)
   UI state: pm_col (group collapse map).
   ========================================================================== */
const PMS = {
  /* today's prodAbbrev: the product code, else a short form of its name, else "MS" */
  abbrev(P, prodId) {
    const p = (P.products || []).find((x) => x.id === prodId);
    if (!p) return 'MS';
    if (p.code) return p.code;
    const nm = String(p.name || '').trim();
    if (!nm) return 'MS';
    if (!/\s/.test(nm) && nm.length <= 10) return nm;
    const words = nm.split(/\s+/).filter(Boolean);
    const trailingNum = nm.match(/(\d+)\s*$/);
    let base = words[0];
    if (base.length <= 3 && words.length > 1) base = words[0] + words[1].charAt(0).toUpperCase() + words[1].slice(1);
    if (base.length > 6) base = base.slice(0, 6);
    if (trailingNum && base.indexOf(trailingNum[1]) < 0) base += trailingNum[1];
    return base;
  },
  initOf(P, ms) { return ms ? (P.initiatives || []).find((i) => i.id === ms.initiativeId) || null : null; },
  productOf(P, ms) {
    const i = PMS.initOf(P, ms);
    if (!i) return null;
    try { return RD.effProduct(i, P) || null; } catch (e) { return i.productId || null; }
  },
  /* Ranked by planned date among the milestones of the same product. Today the siblings are found
     through the initiative's own productId, so milestones under a model-pinned initiative all read
     "-01" (inventory §19.14); here every milestone resolves its product the same way. */
  number(P, ms) {
    const prodId = PMS.productOf(P, ms);
    const sibs = (P.milestones || []).filter((m) => PMS.initOf(P, m) && (PMS.productOf(P, m) || null) === (prodId || null))
      .sort((a, b) => ((a.plannedDate == null ? 1e15 : a.plannedDate) - (b.plannedDate == null ? 1e15 : b.plannedDate)) || String(a.id).localeCompare(String(b.id)));
    const idx = sibs.findIndex((m) => m.id === ms.id);
    return PMS.abbrev(P, prodId) + '-' + String((idx >= 0 ? idx : 0) + 1).padStart(2, '0');
  },
  quarter(ms) { return ms && PGT.fin(ms.plannedDate) ? F.qOfDay(ms.plannedDate) : ''; },
  /* the shared filters: unit and division of its initiative, its product, the quarter of its
     planned date, its band (today's tab ignores the Unit filter: inventory §19.6) */
  matches(ctx, ms) {
    if (typeof ctx.msMatch === 'function') return ctx.msMatch(ms);
    const P = ctx.P, f = ctx.f || {};
    const ini = PMS.initOf(P, ms), div = ini ? ini.divisionId : null;
    if (f.unit && (RD.unitIdOfDivision(div, P) || '') !== f.unit) return false;
    if (f.div && div !== f.div) return false;
    if (f.prod && PMS.productOf(P, ms) !== f.prod) return false;
    if (f.q && PMS.quarter(ms) !== f.q) return false;
    if (f.status && PGT.band({ memo: (k, fn) => fn() }, ctx, 'milestone', ms.id) !== f.status) return false;
    return true;
  },
  pool(ctx) {
    if (ctx.pool) return ctx.pool;
    const out = [];
    Object.keys(ctx.em || {}).forEach((k) => { ((ctx.em[k] && ctx.em[k].kpis) || []).forEach((x) => out.push(x)); });
    return out;
  },
  kpisOf(P, msId) { return (P.kpis || []).filter((k) => k.hostType === 'milestone' && k.hostId === msId); },
  /* the objectives whose key-result KPIs feed this milestone's targets (through value sources) */
  linkedObjectives(ctx, msId) {
    const P = ctx.P, srcIds = [];
    PMS.kpisOf(P, msId).forEach((k) => (k.sources || []).forEach((id) => { if (srcIds.indexOf(id) < 0) srcIds.push(id); }));
    if (!srcIds.length) return [];
    const objIds = [];
    const docs = ctx.execDocs || {};
    Object.keys(docs).forEach((key) => {
      const doc = docs[key] || {};
      (doc.kpis || []).forEach((k) => {
        if (srcIds.indexOf(k.id) < 0 || k.hostType !== 'keyResult') return;
        const kr = (doc.keyResults || []).find((r) => r.id === k.hostId);
        if (kr && kr.objectiveId && objIds.indexOf(kr.objectiveId) < 0) objIds.push(kr.objectiveId);
      });
    });
    return objIds.map((id) => (P.objectives || []).find((o) => o.id === id)).filter(Boolean);
  },
  result(score) { if (score == null) return 'N/A'; if (score >= 100) return 'Met'; if (score >= 70) return 'Partial'; return 'Missed'; },
  resultTone(r) { return r === 'Met' ? 't-ok' : r === 'Partial' ? 't-warn' : r === 'Missed' ? 't-bad' : 't-none'; },
  /* one row of "Performance vs. targets": target, measured (live), result, source */
  metric(ctx, k) {
    const pool = PMS.pool(ctx), em = ctx.em;
    const s = RD.kpiScoreResolved(k, pool, em), val = RD.effValue(k, pool, em), tgt = RD.effTarget(k, pool);
    const unit = RD.kpiUnit(k, pool) || k.unit || '';
    const dir = k.direction;
    const sym = (dir === 'down' || dir === 'decrease') ? '≤' : dir === 'maintain' ? '~' : '≥';
    let target = '—';
    if (k.targetType === 'binary') target = 'Pass';
    else if (tgt != null && typeof tgt === 'object') target = F.n(tgt.lo) + ' to ' + F.u(tgt.hi, unit);
    else if (tgt != null) target = sym + ' ' + F.u(tgt, unit);
    let src = '';
    const e = RD.effValueSource(k, pool, em);
    if (e) {
      if (e.src === k.id) src = 'manual entry';
      else {
        const sk = pool.find((x) => x.id === e.src), n = (k.sources || []).length;
        src = (sk ? (sk.name || sk.id) : e.src) + (n > 1 ? ' (best of ' + n + ')' : '');
      }
    }
    const res = PMS.result(s);
    return { id: k.id, name: RD.kpiName(k, pool) || k.name || k.id, target: target, live: val == null ? '' : F.u(val, unit), result: res, tone: PMS.resultTone(res), src: src };
  },
  blank() {
    return { kpiOverrides: {}, findings: ['', '', '', ''], project: '', author: '', version: '', demonstrated: '',
      context: { budget: '', buildNo: '', linkedOkr: '' },
      actions: [{ item: '', owner: '', due: '' }, { item: '', owner: '', due: '' }, { item: '', owner: '', due: '' }], locked: false };
  },
  /* the draft a report opens with: additive, so a report saved before a field existed comes back
     with that field blank */
  draftOf(ms) {
    const rep = (ms && ms.milestoneReport) || {}, bl = PMS.blank();
    const d = {
      kpiOverrides: K.clone(rep.kpiOverrides || {}),
      findings: (rep.findings && rep.findings.length ? rep.findings.slice() : bl.findings).map((x) => (x == null ? '' : String(x))),
      project: rep.project || '', author: rep.author || '', version: rep.version || '', demonstrated: rep.demonstrated || '',
      context: Object.assign({}, bl.context, rep.context || {}),
      actions: (rep.actions && rep.actions.length ? K.clone(rep.actions) : bl.actions).slice(0, 3).map((a) => ({ item: (a && a.item) || '', owner: (a && a.owner) || '', due: (a && a.due) || '' })),
      locked: !!rep.locked
    };
    while (d.findings.length < 4) d.findings.push('');
    while (d.actions.length < 3) d.actions.push({ item: '', owner: '', due: '' });
    return d;
  },
  openReport(C, ctx, msId) {
    const ms = (ctx.P.milestones || []).find((m) => m.id === msId);
    if (!ms) { C.toast('That milestone no longer exists.', 'err'); return; }
    const d = PMS.draftOf(ms);
    const data = { msId: msId, d0: JSON.stringify(d) };
    if (C.sheet()) C.pushSheet('pms.report', data, d); else C.openSheet('pms.report', data, d);
  },
  /* Saving records what the report says now: a Measured cell left untouched is written as the live
     value it showed, as today (a saved report is a record, not a live view). */
  record(C, ctx, ms, d, locked) {
    const t = (v) => String(v == null ? '' : v).trim();
    const ov = {};
    Object.keys(d.kpiOverrides || {}).forEach((id) => { ov[id] = { measured: t((d.kpiOverrides[id] || {}).measured) }; });
    PMS.kpisOf(ctx.P, ms.id).forEach((k) => {
      const typed = t((d.kpiOverrides[k.id] || {}).measured);
      ov[k.id] = { measured: typed || PMS.metric(ctx, k).live };
    });
    return {
      kpiOverrides: ov,
      findings: (d.findings || []).map(t),
      project: t(d.project), author: t(d.author), version: t(d.version), demonstrated: t(d.demonstrated),
      context: Object.assign({}, d.context || {}),
      actions: (d.actions || []).map((a) => ({ item: t(a.item), owner: t(a.owner), due: t(a.due) })),
      locked: !!locked, savedAt: C.now()
    };
  },
  save(C, ctx, msId, close) {
    const ms = (ctx.P.milestones || []).find((m) => m.id === msId);
    if (!ms) return;
    const d = C.draft();
    const rec = PMS.record(C, ctx, ms, d, !!d.locked);
    const ok = C.mutate((D) => {
      const m = (D.portfolio.milestones || []).find((x) => x.id === msId);
      if (!m) return false;
      m.milestoneReport = rec;
    }, { msg: 'Report saved.' });
    if (ok && close) C.closeSheet();
  },
  /* Lock and Unlock save at once, with whatever is in the form */
  toggleLock(C, ctx, msId) {
    const ms = (ctx.P.milestones || []).find((m) => m.id === msId);
    if (!ms) return;
    const d = C.draft();
    const locked = !d.locked;
    const rec = PMS.record(C, ctx, ms, d, locked);
    const ok = C.mutate((D) => {
      const m = (D.portfolio.milestones || []).find((x) => x.id === msId);
      if (!m) return false;
      m.milestoneReport = rec;
    }, { msg: locked ? 'Report locked.' : 'Report unlocked.' });
    if (ok) {
      const nd = PMS.draftOf(Object.assign({}, ms, { milestoneReport: rec }));
      C.setDraft(nd);
      C.setSheetData({ d0: JSON.stringify(nd) });
    }
  },
  close(C) {
    const s = C.sheet();
    if (s && s.data && typeof s.data.d0 === 'string' && JSON.stringify(s.d || {}) !== s.data.d0) {
      C.confirm({ title: 'Discard your changes?', body: 'Your edits to this report are not saved yet.', ok: 'Discard changes', danger: true, onOk: () => C.closeSheet() });
      return;
    }
    C.closeSheet();
  },
  print(C) {
    try { window.print(); } catch (e) { C.toast('Printing isn’t available here. Use your browser’s Print command.', 'info'); }
  }
};

/* ---------------------------------------------------------- the table rows */
function pmsRows(C, ctx) {
  const P = ctx.P, em = ctx.em, S = C.state, ro = !!ctx.ro;
  const casc = PGT.cascade(C, ctx);
  const all = P.milestones || [];
  const list = all.filter((m) => PMS.matches(ctx, m));
  /* Hierarchy groups by division; Custom follows the shared dimension chain. Today the tab always
     follows the custom chain, even in Hierarchy mode (inventory §19.6). */
  const grp = ctx.group || { mode: 'hierarchy', dims: ['division'] };
  const custom = grp.mode !== 'hierarchy';
  const dims = custom ? (grp.dims || []) : ['division'];
  const tree = RD.groupMilestones(list, dims, P);
  const col = S.pm_col || {};
  const out = [];
  const msSort = (l) => l.slice().sort((a, b) => ((a.plannedDate == null ? 1e15 : a.plannedDate) - (b.plannedDate == null ? 1e15 : b.plannedDate)) || String(a.id).localeCompare(String(b.id)));
  const collect = (n) => (n.children ? n.children.reduce((acc, c) => acc.concat(collect(c)), []) : (n.objs || []));
  const label = (dim, key) => {
    if (dim === 'unit') { const u = (P.units || []).find((x) => x.id === key); return u ? u.name : key; }
    if (dim === 'quarter') return F.q(key);
    if (dim === 'owner') return F.name(key);
    const arr = { division: P.divisions, product: P.products, model: P.models, initiative: P.initiatives }[dim] || [];
    const r = arr.find((x) => x.id === key);
    return r ? (r.name || r.statement || r.id) : key;
  };
  const pathKey = (path) => path.map((p) => p[0] + ':' + p[1]).join('/');
  const date = (d) => PGT.date(d, ctx);
  function msRow(ms) {
    const ini = PMS.initOf(P, ms), prodId = PMS.productOf(P, ms);
    const prod = prodId ? (P.products || []).find((p) => p.id === prodId) : null;
    const eff = casc.milestoneEffective ? casc.milestoneEffective[ms.id] : null;
    const done = RD.milestoneAchieved(ms, em);
    const s = RD.milestoneScore(ms.id, em);
    const band = PGT.band(C, ctx, 'milestone', ms.id);
    const nk = PMS.kpisOf(P, ms.id).length;
    const fin = PGT.fin;
    const completed = fin(ms.completedDate);
    const effDay = completed ? ms.completedDate : (fin(eff) ? eff : (fin(ms.plannedDate) ? ms.plannedDate : null));
    const slip = (!done && fin(eff) && fin(ms.plannedDate)) ? eff - ms.plannedDate : null;
    const st = RD.milestoneState(P.milestoneState, ms.id);
    const pausedMs = !done && !!(st && (st.status === 'paused' || st.status === 'deprioritized'));
    let status, stCls, stTitle = '';
    if (done) { status = 'Achieved'; stCls = 'st t-ok'; stTitle = completed ? 'Marked complete ' + F.dayY(ms.completedDate) : 'Every target met'; }
    else if (pausedMs) {
      status = st.status === 'paused' ? 'Paused' : 'Deprioritized';
      stCls = 'st pms-paused';
      stTitle = status + (fin(st.day) ? ' on ' + F.dayY(st.day) : '') + '.' + (st.note ? ' ' + st.note + (/[.!?]$/.test(st.note) ? '' : '.') : '') + ' Kept, and excluded from dates and scores.';
    } else { const tone = PGT.TONE[band] || 'none'; status = F.bandWord(tone); stCls = 'st ' + F.tone(tone); }
    const rep = ms.milestoneReport;
    const locked = !!(rep && rep.locked);
    const repLabel = (rep ? 'Open report' : 'Create report') + (locked ? ' (locked)' : '');
    const menuId = 'pms.m:' + ms.id;
    const stop = (e) => { if (e && e.stopPropagation) e.stopPropagation(); };
    const items = [];
    if (!ro) {
      items.push({ label: 'Edit milestone', cls: 'mi', fn: (e) => { stop(e); PGT.ped.edit(C, ctx, 'milestone', ms.id); } });
      if (!done) items.push({ label: 'Mark achieved', cls: 'mi', fn: (e) => { stop(e); C.closeMenus(); PGT.setAchieved(C, ctx, ms.id, true); } });
      else if (completed) items.push({ label: 'Reopen milestone', cls: 'mi', fn: (e) => { stop(e); C.closeMenus(); PGT.setAchieved(C, ctx, ms.id, false); } });
      if (PGT.paused(P, ms)) items.push({ label: 'Resume milestone', cls: 'mi', fn: (e) => { stop(e); C.closeMenus(); PGT.msStatus(C, ctx, ms.id, 'active', ''); } });
      else {
        items.push({ label: 'Pause milestone', cls: 'mi', fn: (e) => { stop(e); PGT.askStatus(C, ctx, ms, 'paused'); } });
        items.push({ label: 'Deprioritize milestone', cls: 'mi', fn: (e) => { stop(e); PGT.askStatus(C, ctx, ms, 'deprioritized'); } });
      }
      items.push({ label: 'Delete milestone', cls: 'mi bad', fn: (e) => { stop(e); C.closeMenus(); PGT.ped.del(C, ctx, 'milestone', ms.id); } });
    }
    return {
      isGroup: false, isMs: true, id: ms.id,
      cls: 'pms-row hov' + (pausedMs ? ' paused' : ''),
      num: PMS.number(P, ms),
      name: ms.name || ms.id,
      dotCls: 'pms-dia t-' + (PGT.TONE[band] || 'none'),
      nameTitle: ro ? 'Show lineage' : 'Edit milestone',
      edit: (e) => { stop(e); if (ro) PGT.ped.lineage(C, ctx, 'milestone', ms.id); else PGT.ped.edit(C, ctx, 'milestone', ms.id); },
      rowClick: ro ? null : () => PGT.ped.edit(C, ctx, 'milestone', ms.id),
      init: ini ? (ini.name || ini.id) : '—',
      prod: prod ? (prod.name || prod.id) : '—',
      planned: fin(ms.plannedDate) ? date(ms.plannedDate) : '—',
      eff: effDay == null ? '—' : date(effDay),
      effDone: completed, effLabel: completed ? 'Completed ' + F.dayY(ms.completedDate) : '',
      hasSlip: slip != null && slip > 0, slip: slip != null && slip > 0 ? '+' + F.plural(slip, 'day') : '',
      slipTitle: slip != null && slip > 0 ? F.plural(slip, 'day') + ' later than planned' : '',
      status: status, stCls: stCls, stTitle: stTitle, stDotCls: pausedMs ? 'dot pms-hollow' : 'dot',
      score: F.score(s), kpis: nk ? String(nk) : '—',
      repLabel: repLabel, locked: locked,
      repBtn: !!rep || !ro,
      openReport: (e) => { stop(e); PMS.openReport(C, ctx, ms.id); },
      hasMenu: items.length > 0, menuOpen: C.isMenu(menuId), menuExp: C.isMenu(menuId) ? 'true' : 'false',
      /* only the open menu's wrapper sits above the scrim, so the next rows cannot paint over it */
      wrapCls: C.isMenu(menuId) ? 'above' : 'anchor',
      toggleMenu: (e) => { stop(e); C.toggleMenu(menuId); },
      items: items,
      /* unused on a milestone row */
      label: '', count: '', pad: '', open: 'true', toggle: null, chevCls: ''
    };
  }
  function walk(nodes, depth, path) {
    nodes.forEach((n) => {
      const under = collect(n);
      if (!under.length) return;
      const bare = n.key === '' || n.key === '__all__';
      const np = bare ? path : path.concat([[n.dim, n.key]]);
      const gk = bare ? '' : pathKey(np);
      const shut = !bare && !!col[gk];
      if (!bare) {
        const lab = label(n.dim, n.key);
        out.push({
          isGroup: true, isMs: false, id: 'grp:' + gk,
          label: lab, count: F.plural(under.length, 'milestone'),
          pad: 'padding-left: ' + (12 + depth * 18) + 'px',
          open: shut ? 'false' : 'true', chevCls: 'pms-chev' + (shut ? ' shut' : ''),
          toggleLabel: (shut ? 'Expand ' : 'Collapse ') + lab,
          toggle: () => { const m = Object.assign({}, C.state.pm_col || {}); m[gk] = !m[gk]; C.setState({ pm_col: m, menu: '' }); }
        });
      }
      if (shut) return;
      if (n.children) { walk(n.children, bare ? depth : depth + 1, np); return; }
      msSort(n.objs || []).forEach((ms) => out.push(msRow(ms)));
    });
  }
  walk(tree, 0, []);
  const word = custom ? (dims.length ? 'Grouped by ' + dims.map((d) => PGT.LEVEL_WORD[d] ? PGT.LEVEL_WORD[d].replace(/s$/, '').toLowerCase() : d).join(', then ') : 'Not grouped') : 'Grouped by division';
  return {
    rows: out, n: list.length, total: all.length,
    groupNote: word
  };
}

/* ------------------------------------------------------- the report sheet */
function pmsSheet(C, ctx) {
  const sh = C.sheetOf('pms');
  if (!sh || sh.kind !== 'pms.report') return null;
  const P = ctx.P, em = ctx.em, ro = !!ctx.ro;
  const msId = sh.data.msId;
  const ms = (P.milestones || []).find((m) => m.id === msId);
  if (!ms) {
    return {
      missing: true, ok: false, title: 'Milestone report', sub: '', canLock: false, lockAria: '', lockLabel: '', toggleLock: null,
      roNote: false, lockedNote: false, editable: false, readonly: true, savedText: '', print: null, save: null,
      close: () => C.closeSheet(),
      key: (e) => { if (e && e.key === 'Escape') { if (e.stopPropagation) e.stopPropagation(); C.closeSheet(); } }
    };
  }
  const d = sh.d || PMS.draftOf(ms);
  const locked = !!d.locked;
  const editable = !locked && !ro;
  const ini = PMS.initOf(P, ms), prodId = PMS.productOf(P, ms);
  const prod = prodId ? (P.products || []).find((p) => p.id === prodId) : null;
  const done = RD.milestoneAchieved(ms, em);
  const num = PMS.number(P, ms);
  const fin = PGT.fin;
  const txt = (v, empty) => { const t = String(v == null ? '' : v).trim(); return t || (empty == null ? '—' : empty); };
  const field = (key, ph, label) => ({
    value: d[key] || '', ph: ph, label: label, text: txt(d[key]),
    set: (e) => C.setDraft({ [key]: e && e.target ? e.target.value : '' })
  });
  const metrics = PMS.kpisOf(P, ms.id).map((k) => {
    const m = PMS.metric(ctx, k);
    const typed = ((d.kpiOverrides || {})[k.id] || {}).measured;
    const shown = typed != null && String(typed).trim() !== '' ? String(typed) : (m.live || '—');
    return {
      id: k.id, name: m.name, src: m.src ? 'Source: ' + m.src : '', hasSrc: !!m.src,
      target: m.target, measured: typed == null ? '' : String(typed), measuredPh: m.live || 'No reading yet',
      measuredText: shown, measuredLabel: 'Measured, ' + m.name,
      result: m.result, resultCls: 'st ' + m.tone,
      set: (e) => {
        const v = e && e.target ? e.target.value : '';
        const cur = C.draft().kpiOverrides || {};
        C.setDraft({ kpiOverrides: Object.assign({}, cur, { [k.id]: Object.assign({}, cur[k.id] || {}, { measured: v }) }) });
      }
    };
  });
  const findings = (d.findings || []).map((f, i) => ({
    n: String(i + 1).padStart(2, '0'), value: f || '', text: txt(f, ''), label: 'Finding ' + (i + 1),
    set: (e) => C.setDraftPath('findings.' + i, e && e.target ? e.target.value : '')
  }));
  const actions = (d.actions || []).map((a, i) => ({
    item: a.item || '', owner: a.owner || '', due: a.due || '',
    itemText: txt(a.item, ''), ownerText: txt(a.owner, ''), dueText: txt(a.due, ''),
    itemLabel: 'Action ' + (i + 1), ownerLabel: 'Owner of action ' + (i + 1), dueLabel: 'Due date of action ' + (i + 1),
    setItem: (e) => C.setDraftPath('actions.' + i + '.item', e && e.target ? e.target.value : ''),
    setOwner: (e) => C.setDraftPath('actions.' + i + '.owner', e && e.target ? e.target.value : ''),
    setDue: (e) => C.setDraftPath('actions.' + i + '.due', e && e.target ? e.target.value : '')
  }));
  /* TRL and MRL are 1 to 9; a stored 0 is today's "blank saves as 0" bug (inventory §19.11) */
  const lvl = (v) => (v != null && v !== '' && Number(v) !== 0 ? String(v) : '');
  const linked = PMS.linkedObjectives(ctx, ms.id).map((o) => ({ text: o.statement || o.id, q: o.quarter ? F.q(o.quarter) : '', hasQ: !!o.quarter }));
  const rep = ms.milestoneReport;
  const s0 = sh.data && typeof sh.data.d0 === 'string' ? sh.data.d0 : '';
  const dirty = !!s0 && JSON.stringify(d) !== s0;
  return {
    ok: true, missing: false,
    title: 'Milestone report', sub: num + ', ' + (ms.name || ms.id),
    ro: ro, locked: locked, editable: editable, readonly: !editable,
    canLock: !ro, lockLabel: locked ? 'Unlock' : 'Lock', lockAria: locked ? 'Unlock the report' : 'Lock the report',
    toggleLock: () => PMS.toggleLock(C, ctx, ms.id),
    roNote: ro, lockedNote: locked && !ro,
    project: field('project', prod ? (prod.name || prod.id) : (ini ? (ini.name || ini.id) : 'Project or product name'), 'Project'),
    author: field('author', 'Name', 'Author'),
    version: field('version', 'v1.0', 'Version'),
    demonstrated: field('demonstrated', 'Describe what was physically demonstrated, tested, or shown: setup conditions, operating envelope, duration, and any observers present.', 'What was demonstrated'),
    tag: num, msName: ms.name || ms.id,
    achText: done ? 'Achieved' : 'Not achieved', achCls: 'st ' + (done ? 't-ok' : 't-none'),
    dateAchieved: fin(ms.completedDate) ? F.dayY(ms.completedDate) : '—',
    trlmrl: (lvl(ms.trl) || '—') + ' / ' + (lvl(ms.mrl) || '—'),
    metrics: metrics, hasMetrics: metrics.length > 0, noMetrics: !metrics.length,
    findings: findings,
    planned: fin(ms.plannedDate) ? F.dayY(ms.plannedDate) : '—',
    actual: fin(ms.completedDate) ? F.dayY(ms.completedDate) : '—',
    trl: lvl(ms.trl) ? 'TRL ' + lvl(ms.trl) : '—',
    mrl: lvl(ms.mrl) ? 'MRL ' + lvl(ms.mrl) : '—',
    linked: linked, hasLinked: linked.length > 0, noLinked: !linked.length,
    actions: actions,
    savedText: rep && rep.savedAt ? 'Last saved ' + F.stamp(rep.savedAt) : 'Not saved yet',
    dirty: dirty,
    print: () => PMS.print(C),
    save: () => PMS.save(C, ctx, ms.id, true),
    close: () => PMS.close(C),
    /* Escape closes the report, asking first when there are unsaved edits */
    key: (e) => { if (e && e.key === 'Escape') { if (e.stopPropagation) e.stopPropagation(); PMS.close(C); } }
  };
}

MODS.pms = {
  state: { pm_col: {} },
  wide: ['pms.report'],
  vm(C, ctx) {
    const sheet = pmsSheet(C, ctx);
    if (ctx.tab !== 'milestones') return { sheet: sheet, rows: [], empty: true, emptyText: '', countText: '', groupNote: '' };
    const T = pmsRows(C, ctx);
    const total = T.total;
    return {
      sheet: sheet,
      rows: T.rows,
      empty: !T.rows.length,
      emptyText: total ? 'No milestones match the current filters.' : 'No milestones yet. Add one from an initiative in the Structure tab.',
      countText: T.n === total ? F.plural(total, 'milestone') : T.n + ' of ' + F.plural(total, 'milestone'),
      groupNote: T.groupNote
    };
  }
};

/* ================= app: apps/plan/shell.js */
/* ============================================================================
   Planning shell (P-core). Owns the frame, the shared filter / group-by bar,
   Settings (theme, access, present mode, broker + sync simulations, URL links),
   the simulated save cycle, and the context every Planning module reads.

   ctx (read-only for modules; recomputed every render):
     today, nowMs     sample "today" (day number) and the simulated clock (ms)
     qNow             the current calendar quarter, '2026Q4' (what ?quarter=active means)
     D, P             the whole dataset and the portfolio document (C.D.portfolio)
     ro               editing is off (read-only preview, or present mode)
     present          present mode (sidebar, top bar and filter bars hidden)
     tab              'overview' | 'structure' | 'gantt' | 'milestones'
     execDocs         D.docs keyed 'EXEC-DIV-EL' / 'BIZ-DIV-BD'
     execMap          the same docs keyed by division id (what the live app hands the engine)
     em               RD.withPortfolio(P, execMap)            — scores, rollups, cascade
     specMap          D.spec keyed 'SPEC-DIV-EL'
     fullEm           RD.withPortfolio(P, execMap + spec docs) — product/model KPI currents
     pool             every KPI in em (the engine's resolution pool, like the live app's poolOf)
     docOf(divId)     that division's execution doc (EXEC- or BIZ- by the division's kind) or null
     appOf(divId)     'exec' | 'sales' — the app that executes that division
     objEnd(o)        RD.objectiveEndState for objective o (achieved / abandoned) or null
     f                shared filters { unit, div, prod, q, status } — '' = all; status is an RD.band
                      value ('on-track' | 'at-risk' | 'off-track' | 'no-band')
     group            { mode: 'hierarchy' | 'custom', dims: [...] }  (dims ⊂ unit, division, product,
                      model, quarter, owner, initiative; feed RD.groupObjectives / RD.groupMilestones)
     anyFilter        any filter is set;  workFilter: quarter or status is set
     objMatch(o)      objective passes the filters (today's rules: unit via its division, its own
                      division, effective product, quarter tag, band of its score)
     initMatch(i)     an initiative WITHOUT objectives passes: judged on its own unit, division and
                      product; always false while a quarter or status filter is set
     initHasMatch(i)  initiative shows: any of its objectives match, else initMatch(i)
     msMatch(m)       milestone passes: unit and division of its initiative, its effective product,
                      the quarter of its planned date, its band (fixes today's ignored Unit filter)
     prodShows(p)     product passes the unit / division / product filters
     divShows(d)      division passes the unit / division filters
     objBand(id)      RD.band of the objective's rollup;  msBand(id): 'on-track' when achieved, else
                      RD.band(RD.milestoneScore)
     paused(msId)     milestone is paused or deprioritized (RD.milestonePaused)
     casc()           RD.cascade once per render, with paused / deprioritized milestones left out
                      (they are "kept, and excluded from dates and scores")
     isActiveObj(o)   today's Overview "active" rule: score below 100 and (quarter = qNow or today
                      inside its planned window);  isActiveMs(m): not achieved, not paused, planned
                      in qNow

   Shell state other modules may read or set:
     C.state.f, C.state.group      the filters and grouping above (use the bar; it closes sheets)
     C.state.pg_active             Gantt "Active only" (?ganttActive)       — owned by mods/pgt
     C.state.pg_timeframe          Gantt "Timeframe" on (?ganttQuarter)    — owned by mods/pgt
     C.state.focus                 { type, id } handed over from another app, or null

   Cross-module entry points (defined in mods/ped/mod.js):
     PED.open(C, ctx, type, id, opts)   editor; id null = add; opts.parentId pre-fills the parent
                                        (division for initiative/product, initiative for
                                        objective/milestone, product for model); opts.prefill;
                                        opts.push stacks it over the current sheet
     PED.lineage(C, ctx, type, id)      lineage sheet;   PED.del(C, ctx, type, id)  delete flow
     PED.milestoneStatus(C, ctx, msId, status, note)
                                        status: 'paused' | 'deprioritized' | 'active' (resume) |
                                        'achieved' (completed today) | 'open' (clears completion)
   The milestone editor's Report button calls PMS.openReport(C, ctx, msId) when mods/pms defines it.

   Hand-off into Planning (C.handoff({ app: 'plan', ... }) from another board):
     tab: 'overview' | 'structure' | 'gantt' | 'milestones';  objective / initiative / milestone /
     division / product / model: <id> opens that item's lineage at load.

   Live builds (LIVE = true: kit/net.js loads and saves through the broker; see LIVE.md):
     APP_LIVE_PLAN     every division's execution document (EXEC-<div>, BIZ-<div> for a business division)
                       and SPEC-<div> for every R&D division are read; only the portfolio is written, as
                       today ('gantt-view' is neither read nor written: Calm keeps Gantt choices per browser)
     APP_INIT          no documents and no hand-off yet: the page's parameters (?tab, ?present, ?division…)
                       set the view from the first frame, as today's app reads them when the page starts
     APP_LIVE_READY    the first successful load opens the view the parameters ask for (exactly like opening
                       a link), or else the hand-off from another app; later loads keep the current view
     APP_LIVE_STATUS   load phases in a banner under the top bar (C.state.pl_load) and in the save indicator;
                       nothing can be edited until something is loaded
     Settings          theme, read-only preview, present mode, the link builder (its links open by going to
                       them), the broker token (NET.saveToken), "Load from the broker" (NET.reload) and the
                       connection's status (NET.info). None of the sample's simulations.
     Signed out inside a Confluence embed, the View only banner links to the full page, where the Hub

const PLAN_TABS = [['overview', 'Overview'], ['structure', 'Structure'], ['gantt', 'Gantt'], ['milestones', 'Milestones']];
const PLAN_HUB = 'https://celadynestaller.github.io/CeladyneHQ/';
const PLAN_URL = PLAN_HUB + 'planning_app.html';
const PLAN_DIMS = [['unit', 'Unit'], ['division', 'Division'], ['product', 'Product'], ['model', 'Model'], ['quarter', 'Quarter'], ['owner', 'Owner'], ['initiative', 'Initiative']];
const PLAN_STATUS = [['on-track', 'On track'], ['at-risk', 'At risk'], ['off-track', 'Off track'], ['no-band', 'No score yet']];
const PLAN_TOKEN = 'rdb_live_7Qx2mK9p';   // the sample build's simulated token (a live page uses the stored one, NET.token())
/* the parameters a link to Planning can carry (today's URLP); names are case-insensitive, values exact */
const PLAN_PARAMS = ['tab', 'present', 'readonly', 'division', 'product', 'unit', 'quarter', 'ganttActive', 'ganttQuarter'];

/* ---------------------------------------------------------------- helpers */
const PLAN = {
  ENT: { unit: 'Unit', division: 'Division', product: 'Product', model: 'Model', initiative: 'Initiative', milestone: 'Milestone', objective: 'Objective' },
  KEY: { unit: 'units', division: 'divisions', product: 'products', model: 'models', initiative: 'initiatives', milestone: 'milestones', objective: 'objectives' },
  list(P, ent) { return (P && P[PLAN.KEY[ent]]) || []; },
  byId(P, ent, id) { if (id == null || id === '') return null; return PLAN.list(P, ent).find((x) => x.id === id) || null; },
  nameOf(r) { return r ? (r.name || r.statement || r.id) : '(missing)'; },
  ord(x) { return x && x.order != null && x.order !== '' && isFinite(x.order) ? Number(x.order) : 1e9; },
  byOrder(arr) { return (arr || []).slice().sort((a, b) => PLAN.ord(a) - PLAN.ord(b)); },
  kindOf(P, divId) { return RD.divisionKind(PLAN.byId(P, 'division', divId)); },
  docKey(P, divId) { return (PLAN.kindOf(P, divId) === 'biz' ? 'BIZ-' : 'EXEC-') + divId; },
  docOf(D, divId) { return divId ? (D.docs || {})[PLAN.docKey(D.portfolio, divId)] || null : null; },
  appOf(P, divId) { return PLAN.kindOf(P, divId) === 'biz' ? 'sales' : 'exec'; },
  objEnd(D, o) { const doc = o ? PLAN.docOf(D, o.divisionId) : null; return doc ? RD.objectiveEndState(doc.objectiveState, o.id) : null; },
  tone(b) { return { 'on-track': 'ok', 'at-risk': 'warn', 'off-track': 'bad' }[b] || 'none'; },
  word(b) { return { 'on-track': 'On track', 'at-risk': 'At risk', 'off-track': 'Off track' }[b] || 'No score yet'; },
  msPaused(P, id) { try { return !!RD.milestonePaused(P.milestoneState, id); } catch (e) { return false; } },
  msState(P, id) { try { return RD.milestoneState(P.milestoneState, id); } catch (e) { return null; } },
  msQuarter(ms) { return ms && ms.plannedDate != null && isFinite(ms.plannedDate) ? F.qOfDay(ms.plannedDate) : ''; },
  msProduct(P, ms) {
    const i = ms ? PLAN.byId(P, 'initiative', ms.initiativeId) : null;
    if (!i) return null;
    try { return RD.effProduct(i, P) || null; } catch (e) { return i.productId || null; }
  },
  divCode(divId) { const t = String(divId || ''); const i = t.indexOf('-'); return i >= 0 ? t.slice(i + 1) : t; },
  quarters(P) { const s = {}; (P.objectives || []).forEach((o) => { if (o.quarter) s[o.quarter] = 1; }); return Object.keys(s).sort(); },
  dimLabel(P, dim, key) {
    if (key === '' || key == null || key === '__all__') return 'None';
    if (dim === 'unit') { const u = PLAN.byId(P, 'unit', key); return u ? u.name : key; }
    if (dim === 'division' || dim === 'product' || dim === 'model' || dim === 'initiative') { const r = PLAN.byId(P, dim, key); return r ? PLAN.nameOf(r) : key; }
    if (dim === 'quarter') return F.q(key);
    if (dim === 'owner') return F.name(key);
    return String(key);
  },
  dimWord(dim) { const d = PLAN_DIMS.find((x) => x[0] === dim); return d ? d[1] : dim; },
  pathKey(path) { return path.map((p) => p[0] + ':' + p[1]).join('/'); },
  /* a new record created from a group lands in that group (today's groupPrefill) */
  groupPrefill(path) {
    const pre = {};
    path.forEach((p) => {
      const dim = p[0], key = p[1];
      if (key === '' || key === '__all__') return;
      if (dim === 'division') pre.divisionId = key;
      else if (dim === 'product') pre.productId = key;
      else if (dim === 'model') pre.modelId = key;
      else if (dim === 'quarter') pre.quarter = key;
      else if (dim === 'owner') pre.owner = key ? [key] : [];
      else if (dim === 'initiative') pre.initiativeId = key;
    });
    return pre;
  },
  owners(o) { return RD.ownersOf(o); },
  /* the plan with paused / deprioritized milestones left out, for the schedule cascade */
  liveP(P) {
    const ids = {};
    (P.milestones || []).forEach((m) => { if (PLAN.msPaused(P, m.id)) ids[m.id] = 1; });
    if (!Object.keys(ids).length) return P;
    return Object.assign({}, P, {
      milestones: (P.milestones || []).filter((m) => !ids[m.id]),
      objectives: (P.objectives || []).map((o) => (o.milestoneIds && o.milestoneIds.some((x) => ids[x]) ? Object.assign({}, o, { milestoneIds: o.milestoneIds.filter((x) => !ids[x]) }) : o))
    });
  },
  ago(ms, now) { return F.ago(ms, now); }
};

function planExecMap(D) {
  const m = {};
  Object.keys(D.docs || {}).forEach((k) => { m[k.replace(/^(EXEC|BIZ)-/, '')] = D.docs[k]; });
  return m;
}
function planPool(em) {
  const out = [];
  Object.keys(em).forEach((k) => { ((em[k] && em[k].kpis) || []).forEach((x) => out.push(x)); });
  return out;
}

/* ------------------------------------------------------------ state */
function APP_INIT(C, st) {
  const D = C.D;
  st.tab = 'overview';
  st.present = false;
  st.roByPresent = false;
  st.f = { unit: '', div: '', prod: '', q: '', status: '' };
  st.group = { mode: 'hierarchy', dims: ['division'] };
  st.pg_active = false;
  st.pg_timeframe = false;
  st.focus = null;
  /* live: bk.token only says WHETHER a token is stored (mods/ped words a hint by it); the token is never shown */
  st.bk = LIVE ? { token: !!NET.token() } : { token: PLAN_TOKEN, reject: false, conflict: '', loadedAt: D.nowMs, last: '' };
  st.bkDraft = '';
  st.lk = { tab: 'overview', division: '', product: '', unit: '', quarter: '', readonly: false, present: false, ganttActive: false, ganttQuarter: false, token: false };
  st.lkPaste = '';
  try { const t = window.localStorage.getItem('rd_theme'); if (t === 'light' || t === 'dark' || t === 'system') st.theme = t; } catch (e) { /* storage blocked */ }
  if (LIVE) { planLiveInit(C, st); return; }
  C._server = K.clone(D.portfolio);
  C._pending = false;
  C._teamNext = 0;
  planInstallSync(C);
  const h = C.takeHandoff(APP);
  if (h) Object.assign(st, planHandoffPatch(C, h));
}
/* the view a hand-off from another board opens: its tab, and the lineage of the item it names (when the plan has it) */
function planHandoffPatch(C, h) {
  const patch = {};
  if (h.tab && PLAN_TABS.some((x) => x[0] === h.tab)) patch.tab = h.tab;
  const types = ['objective', 'initiative', 'milestone', 'division', 'product', 'model', 'unit'];
  const ty = types.find((t) => h[t]);
  if (ty && PLAN.byId(C.D.portfolio, ty, h[ty])) {
    patch.focus = { type: ty, id: h[ty] };
    patch.sheets = [{ kind: 'ped.lineage', data: { type: ty, id: h[ty] }, d: {}, err: '' }];
  }
  return patch;
}
function APP_RESET(C) {
  const st = {};
  APP_INIT(C, st);
  st.sim = { offline: false, hub: true };
  st.ro = false;
  C.setState(st);
}

/* ------------------------------------------------- simulated broker + save */
function planInstallSync(C) {
  if (C._plSync) return;
  C._plSync = true;
  C.markDirty = function (msg) { planMarkDirty(this, msg); };
  C.saveNow = function () { planSaveNow(this); };
}
function planSetBk(C, patch) { C.setState({ bk: Object.assign({}, C.state.bk, patch) }); }
/* every C.mutate ends here: today's auto-save, with its messages */
function planMarkDirty(C, msg) {
  const S = C.state, bk = S.bk || {};
  const now = C.now();
  const seq = (C._saveSeq = (C._saveSeq || 0) + 1);
  const rev = (S.rev || 0) + 1;
  if (!bk.token) {
    C.setState({ rev: rev, save: { state: 'local', at: now } });
    C.toast('Saved locally — add a broker token in Settings to sync.', 'info');
    return;
  }
  if (S.sim && S.sim.offline) {
    C._pending = true;
    C.setState({ rev: rev, save: { state: 'offline', at: now, pending: true } });
    C.toast('Auto-save failed (no connection). Your change is local — use Save to retry.', 'err');
    return;
  }
  if (bk.conflict === 'fail') {
    /* re-fetch, re-apply, save again — and that retry fails: reload their version, the change is lost */
    C.D.portfolio = K.clone(C._server);
    const what = planTeamEdit(C);
    C._server = K.clone(C.D.portfolio);
    C._pending = false;
    C.setState({ rev: rev + 1, bk: Object.assign({}, bk, { conflict: '', last: what }), save: { state: 'conflict', at: now } });
    C.toast('Auto-save hit a conflict and couldn’t merge (412) — reloaded; re-apply and use Save.', 'err');
    return;
  }
  let text = msg || 'Saved.';
  const patch = { rev: rev, save: { state: 'saving', at: now } };
  if (bk.conflict === 'merge') {
    /* 412: re-fetch their version, re-apply this one change on top, save again */
    const what = planTeamEdit(C);
    patch.bk = Object.assign({}, bk, { conflict: '', last: what });
    text = text + ' (merged with a concurrent change)';
  }
  C._server = K.clone(C.D.portfolio);
  C._pending = false;
  C.later(() => { if (seq === C._saveSeq && !(C.state.sim && C.state.sim.offline)) C.setState({ save: { state: 'saved', at: C.now() } }); }, 700);
  C.setState(patch);
  C.toast(text, 'ok');
}
/* the top bar's Save button: full save of the portfolio (and the gantt-view doc) */
function planSaveNow(C) {
  if (!C.guard()) return;
  const S = C.state, bk = S.bk || {};
  if (!bk.token) { C.toast('Add a broker token in Settings before saving.', 'err'); return; }
  if (S.sim && S.sim.offline) { C.toast('Save failed (no connection).', 'err'); return; }
  C._saveSeq = (C._saveSeq || 0) + 1;
  if (bk.conflict) {
    C.toast('Someone else saved first — reloading their version, then re-apply your change.', 'err');
    C.D.portfolio = K.clone(C._server);
    const what = planTeamEdit(C);
    C._server = K.clone(C.D.portfolio);
    C._pending = false;
    C.setState({ rev: (S.rev || 0) + 1, bk: Object.assign({}, bk, { conflict: '', last: what, loadedAt: C.now() }), save: { state: 'conflict', at: C.now() } });
    C.toast(planLoadedText(C), 'ok');
    return;
  }
  C._server = K.clone(C.D.portfolio);
  C._pending = false;
  C.setState({ save: { state: 'saved', at: C.now() } });
  C.toast('Saved.', 'ok');
}
function planLoadedText(C) {
  const D = C.D, P = D.portfolio;
  const nx = (P.divisions || []).filter((d) => PLAN.docOf(D, d.id)).length;
  const ns = (P.divisions || []).filter((d) => (D.spec || {})['SPEC-' + d.id]).length;
  return 'Loaded portfolio + ' + nx + ' exec + ' + ns + ' spec docs.';
}
/* load from the broker: replaces what is in this browser with the broker's copy */
function planLoad(C) {
  const S = C.state, bk = S.bk || {};
  if (!bk.token) { C.toast('No broker token yet — add one in Settings to load live data. Showing local scratch.', 'info'); return; }
  if (bk.reject) { C.toast('Load failed (401). Check the token in Settings.', 'err'); return; }
  if (S.sim && S.sim.offline) { C.toast('Load failed (no connection). Check the token in Settings.', 'err'); return; }
  C.D.portfolio = K.clone(C._server);
  C._pending = false;
  C._saveSeq = (C._saveSeq || 0) + 1;
  C.setState({ rev: (S.rev || 0) + 1, bk: Object.assign({}, bk, { loadedAt: C.now() }), save: { state: 'saved', at: C.now() } });
  C.toast(planLoadedText(C), 'ok');
}
function planSaveToken(C, value) {
  const tok = String(value == null ? C.state.bkDraft || '' : value).trim();
  planSetBk(C, { token: tok });
  C.setState({ bkDraft: '' });
  C.toast('Token saved.', 'ok');
  planLoad(C);
}
/* what a teammate's save looks like when it arrives (25 s polling) or wins a race (412) */
const PLAN_TEAM = [

/* apply the next teammate edit straight to the data; returns "Toru Hayashi moved …" */
