/* ---- delete a specification (L729): cascades to its metrics and readings */
function sspecDeleteSpec(C, ctx, krId) {
  if (!C.guard()) return;
  const doc = ctx.doc;
  const kr = (doc.keyResults || []).find((r) => r.id === krId);
  if (!kr) return;
  const AK = sspecAK(ctx);
  const kids = (doc.kpis || []).filter((k) => k.hostType === 'keyResult' && k.hostId === krId);
  const kidSet = {};
  kids.forEach((k) => { kidSet[k.id] = 1; });
  const nReads = (doc.kpiUpdates || []).filter((u) => kidSet[u.kpiId]).length;
  const nLinked = (doc.kpis || []).filter((m) => m.linkParent != null && kidSet[m.linkParent] && !kidSet[m.id]).length;
  const nGates = (doc.kpis || []).filter((k) => k.gates === krId).length;
  const nImp = (doc.kpis || []).filter((k) => k.linkSpec === krId).length;
  const idx = (ctx.specs || []).findIndex((r) => r.id === krId);
  const lines = [];
  lines.push(kids.length ? 'Its ' + F.plural(kids.length, 'metric') + (nReads ? ' and ' + F.plural(nReads, 'reading') : '') + (kids.length === 1 && !nReads ? ' is' : ' are') + ' deleted.' : 'It has no metrics.');
  if (nLinked) lines.push(F.plural(nLinked, 'metric') + ' linked to it ' + (nLinked === 1 ? 'keeps its' : 'keep their') + ' current target and ' + (nLinked === 1 ? 'is' : 'are') + ' unlinked.');
  if (nGates) lines.push(F.plural(nGates, 'component specification') + ' stop' + (nGates === 1 ? 's' : '') + ' gating it.');
  if (nImp) lines.push(F.plural(nImp, 'imported sub-product spec') + ' stop' + (nImp === 1 ? 's' : '') + ' linking to it.');
  lines.push('This cannot be undone.');
  const docKey = ctx.docKey;
  C.confirm({
    title: 'Delete ' + (idx >= 0 ? 'S' + (idx + 1) + ', ' : '') + '“' + (kr.statement || kr.id) + '”?',
    body: lines.join(' '),
    ok: 'Delete specification', danger: true,
    onOk: () => C.mutate((D) => {
      const d2 = D.spec[docKey];
      if (!d2.keyResults.some((r) => r.id === krId)) return false;
      const AK2 = sspecAllK(D, docKey);
      const ks = {};
      d2.kpis.filter((k) => k.hostType === 'keyResult' && k.hostId === krId).forEach((k) => { ks[k.id] = 1; });
      d2.kpis.forEach((m) => { if (m.linkParent != null && ks[m.linkParent] && !ks[m.id]) sspecMaterialize(m, AK2); });
      d2.kpis = d2.kpis.filter((k) => !ks[k.id]);
      d2.kpiUpdates = d2.kpiUpdates.filter((u) => !ks[u.kpiId]);
      /* fixed: no dangling references to the deleted specification */
      d2.kpis.forEach((k) => { if (k.gates === krId) delete k.gates; if (k.linkSpec === krId) delete k.linkSpec; });
      d2.keyResults = d2.keyResults.filter((r) => r.id !== krId);
    }, { msg: 'Specification deleted.' })
  });
}
/* reorder specifications within this model (L1589) */
function sspecMoveSpec(C, ctx, fromId, toId, after) {
  const docKey = ctx.docKey, modelId = ctx.modelId;
  C.mutate((D) => {
    const doc = D.spec[docKey];
    const next = sspecReorder(doc.keyResults, (r) => r.objectiveId === modelId, fromId, toId, after);
    if (!next) return false;
    doc.keyResults = next;
  }, { msg: 'Reordered.' });
}

/* resolve an imported sub-product spec for the "From sub-products" line (L586 resolveRef) */
function sspecResolveRef(C, ctx, member) {
  if (typeof SSUB !== 'undefined' && SSUB && typeof SSUB.resolveRef === 'function') return SSUB.resolveRef(C, ctx, member);
  if (typeof ctx.resolveRef === 'function') return ctx.resolveRef(member);
  return { name: member.name, score: null };
}

/* ============================================================ the list */
function sspecSpecList(C, ctx) {
  const ro = C.isRo();
  const AK = sspecAK(ctx);
  const em = ctx.em;
  const specs = ctx.specs || (ctx.doc.keyResults || []).filter((r) => r.objectiveId === ctx.modelId);
  const S = C.state;
  const drag = C._drag && C._drag.kind === 'sspec.spec' ? C._drag : null;
  return specs.map((kr, i) => {
    const s = RD.keyResultScore(kr.id, em);
    const tt = kr.trackingType || 'kpi';
    const menuId = 'sspec.s.' + kr.id;
    const gates = AK.filter((k) => k.gates === kr.id);
    const subIn = AK.filter((k) => k.hostType === 'component' && k.refKr && k.linkSpec === kr.id);
    const subs = tt === 'subkr' ? (kr.subKrs || []) : [];
    const isHot = !!drag && S.sspec_hot === 'spec:' + kr.id && drag.id !== kr.id;
    const tag = 'S' + (i + 1);
    let trackText = 'Single metric';
    if (tt === 'percentage') trackText = '% completion';
    else if (tt === 'subkr') trackText = F.plural(subs.length, 'sub-specification') + ', weighted';
    const pct = sspecClampPct(kr.progress);
    return {
      id: kr.id, tag,
      aria: 'Specification ' + tag + ': ' + (kr.statement || kr.id),
      statement: kr.statement || kr.id,
      canEdit: !ro,
      edit: () => { C.closeMenus(); sspecOpenSpec(C, ctx, kr.id); },
      editLabel: 'Edit ' + tag,
      trackText,
      score: F.score(s), scoreCls: sspecScoreCls(s) + ' sspec-score',
      scoreTitle: 'Specification score: ' + (s == null ? 'no score yet' : F.score(s) + ', ' + sspecBandText(s).toLowerCase()),
      hasProgress: tt === 'percentage',
      progressText: pct + '% complete',
      progressStyle: 'width: ' + pct + '%',
      progressCls: 'fill ' + F.tone(F.band(s)),
      hasSubs: subs.length > 0,
      subs: subs.map((x, j) => {
        let sc = null;
        if ((x.trackingType || 'percentage') === 'kpi') { const v = (x.kpis || []).map((k) => RD.scoreEmbeddedKpi(k)).filter((v2) => v2 != null); sc = v.length ? K.mean(v) : null; }
        else sc = x.progress == null ? null : sspecClampPct(x.progress);
        const nm = x.name || 'Sub-spec ' + (j + 1);
        return {
          name: nm, meta: sspecSubMeta(x), score: F.score(sc), scoreCls: sspecScoreCls(sc),
          canEdit: !ro,
          editLabel: 'Edit sub-spec “' + nm + '” of ' + tag,
          /* opens the specification editor with this sub-spec on top (Back returns to the specification) */
          edit: () => { C.closeMenus(); sspecOpenSpec(C, ctx, kr.id); sspecOpenSub(C, j); }
        };
      }),
      metricsNote: tt === 'kpi' ? '' : 'Metrics here do not count toward this score while it is tracked by ' + (tt === 'percentage' ? '% completion' : 'sub-specifications') + '.',
      hasMetricsNote: tt !== 'kpi' && AK.some((k) => k.hostType === 'keyResult' && k.hostId === kr.id && k.objectiveId === ctx.modelId),
      mt: sspecMetricTable(C, ctx, { type: 'keyResult', id: kr.id }, { key: 'page' }),
      addKpi: () => sspecOpenMetric(C, ctx, { type: 'keyResult', id: kr.id }, null),
      addKpiLabel: 'Add KPI to ' + tag,
      addLink: () => sspecOpenLink(C, ctx, { type: 'keyResult', id: kr.id }),
      addLinkLabel: 'Link a metric to ' + tag,
      menuId, menuOpen: C.isMenu(menuId), toggleMenu: () => C.toggleMenu(menuId),
      menuLabel: 'More actions for ' + tag,
      canUp: i > 0, canDown: i < specs.length - 1,
      up: () => { C.closeMenus(); if (i > 0) sspecMoveSpec(C, ctx, kr.id, specs[i - 1].id, false); },
      down: () => { C.closeMenus(); if (i < specs.length - 1) sspecMoveSpec(C, ctx, kr.id, specs[i + 1].id, true); },
      del: () => { C.closeMenus(); sspecDeleteSpec(C, ctx, kr.id); },
      gated: gates.map((g) => {
        const gs = RD.kpiScoreResolved(g, AK, em);
        return {
          name: RD.kpiName(g, AK) || g.id,
          score: F.score(gs), scoreCls: sspecScoreCls(gs),
          title: 'On ' + sspecCompName(ctx, g.hostId) + ': a different measure of this requirement',
          canOpen: !ro,
          open: () => SSPEC.openEdit(C, ctx, g.id)
        };
      }),
      hasGated: gates.length > 0,
      fromSubs: subIn.map((k) => {
        const r = sspecResolveRef(C, ctx, k);
        return { name: (r && r.name) || k.name || k.id, score: F.score(r ? r.score : null), scoreCls: sspecScoreCls(r ? r.score : null) };
      }),
      hasFromSubs: subIn.length > 0,
      hasNotes: !!String(kr.notes || '').trim(),
      notes: String(kr.notes || '').trim(),
      notesOpen: !!(S.sspec_notes || {})[kr.id],
      notesLabel: (S.sspec_notes || {})[kr.id] ? 'Hide notes' : 'Notes',
      toggleNotes: () => C.setState({ sspec_notes: Object.assign({}, C.state.sspec_notes, { [kr.id]: !(C.state.sspec_notes || {})[kr.id] }) }),
      canDrag: !ro && specs.length > 1,
      dragLabel: 'Drag ' + tag + ' to reorder',
      dragStart: (e) => {
        C._drag = { kind: 'sspec.spec', id: kr.id };
        try { if (e && e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', kr.id); } } catch (x) { /* ignore */ }
        C.setState({ sspec_hot: '' });
      },
      dragEnd: () => { C._drag = null; C.setState({ sspec_hot: '' }); },
      dragOver: (e) => {
        const d = C._drag;
        if (!d || d.kind !== 'sspec.spec') return;
        if (e && e.preventDefault) e.preventDefault();
        try { if (e && e.dataTransfer) e.dataTransfer.dropEffect = 'move'; } catch (x) { /* ignore */ }
        if (C.state.sspec_hot !== 'spec:' + kr.id) C.setState({ sspec_hot: 'spec:' + kr.id });
      },
      drop: (e) => {
        const d = C._drag;
        if (!d || d.kind !== 'sspec.spec') return;
        if (e && e.preventDefault) e.preventDefault();
        C._drag = null;
        C.setState({ sspec_hot: '' });
        if (d.id !== kr.id) sspecMoveSpec(C, ctx, d.id, kr.id, false);
      },
      cardCls: 'sspec-card dz' + (isHot ? ' hot' : '') + (drag && drag.id === kr.id ? ' lift' : '')
    };
  });
}

/* ============================================================ public namespace */
const SSPEC = {
  metricTable: sspecMetricTable,
  openMetric: sspecOpenMetric,
  openLink: sspecOpenLink,
  openOverride: sspecOpenOverride,
  openEdit(C, ctx, kpiId) {
    const k = (ctx.doc.kpis || []).find((x) => x.id === kpiId);
    if (!k) return;
    if (sspecIsMember(k, sspecAK(ctx))) sspecOpenOverride(C, ctx, kpiId);
    else sspecOpenMetric(C, ctx, { type: k.hostType, id: k.hostId }, kpiId);
  },
  openSpec: sspecOpenSpec,
  post: sspecPost,
  unlink: sspecUnlink,
  deleteMetric: sspecDeleteMetric,
  targetText: sspecTargetText,
  fmtTarget: sspecFmtTarget,
  hostOf: sspecHost,
  importSource: sspecImportSource,
  linkDefaultFor: sspecLinkDefaultFor,
  linkCandidates: sspecLinkCandidates
};

MODS.sspec = {
  state: { sspec_open: true, sspec_reads: {}, sspec_notes: {}, sspec_hot: '' },
  vm(C, ctx) {
    const ro = C.isRo();
    const top = C.sheetOf('sspec');
    const out = {
      specSheet: top && top.kind === 'sspec.spec' ? sspecSpecSheetVM(C, ctx, top) : null,
      subSheet: top && top.kind === 'sspec.sub' ? sspecSubSheetVM(C, ctx, top) : null,
      metricSheet: top && top.kind === 'sspec.metric' ? sspecMetricSheetVM(C, ctx, top) : null,
      linkSheet: top && top.kind === 'sspec.link' ? sspecLinkSheetVM(C, ctx, top) : null,
      overrideSheet: top && top.kind === 'sspec.override' ? sspecOverrideSheetVM(C, ctx, top) : null
    };
    if (!ctx.model) return Object.assign(out, { specs: [], count: '0', empty: true, has: false, open: true, canEdit: false });
    const specs = sspecSpecList(C, ctx);
    const open = C.state.sspec_open !== false;
    return Object.assign(out, {
      specs,
      count: String(specs.length),
      empty: !specs.length,
      has: specs.length > 0,
      open,
      chevStyle: 'transform: rotate(' + (open ? 0 : -90) + 'deg)',
      toggleOpen: () => C.setState({ sspec_open: !open }),
      canEdit: !ro,
      add: () => sspecOpenSpec(C, ctx, null)
    });
  }
};

/* ================= module: scomp (mods/scomp/mod.js) */
/* ============================================================================
   scomp: Product spec, Components (inventory spec §8). Sub-products, component
   owners and cross-product dependencies live in mods/ssub.

   Today: product_designer.template.html L1018-1040 (component modal),
   L1661-1686 (panel), L729-743 (delete cascade), L1579-1606 (drag reorder).

   Shared with the specifications panel (mods/sspec, S-core), so every metric
   table and metric editor on the board looks and behaves the same:
     SSPEC.metricTable   the component's specification table (post a reading, edit,
                         unlink, delete, reorder rows, notes), §11
     SSPEC.openMetric    "Add / Edit component specification" (§9: target type, read
                         count, statistic, direction incl. range, target or range,
                         unit, "Gates a product specification", notes)
     SSPEC.openLink      "Link a metric" (§10); SSPEC.openOverride for linked metrics
   Every SSPEC.open* pushes onto the sheet stack when the component sheet is open,
   so closing it returns to the component sheet (today L642-643).

   Public interface (other modules: guard with typeof SCOMP !== 'undefined'):
     SCOMP.openComponent(C, ctx, id)  the component sheet; '' adds a component, a
                                      sub-product host id opens "Edit sub-product"
     SCOMP.score(ctx, id)             component conformance, RD.hostScore('component', id, ctx.em)
     SCOMP.word(tone)                 band words from today's legend: Meets, Marginal, Off target, No data
   ========================================================================== */

const SCOMP = {
  WORD: { ok: 'Meets', warn: 'Marginal', bad: 'Off target', none: 'No data' },
  word(tone) { return SCOMP.WORD[tone] || SCOMP.WORD.none; },
  T(v) { return String(v == null ? '' : v).trim(); },

  /* ---------------------------------------------------------------- lookups */
  akOf(doc, P) { const ks = (doc && doc.kpis) || []; return P && P.kpis && P.kpis.length ? ks.concat(P.kpis) : ks; },
  comps(ctx) { return ((ctx.doc && ctx.doc.stageGates) || []).filter((g) => g.objectiveId === ctx.modelId && !g.refModel); },
  gate(ctx, id) { return ((ctx.doc && ctx.doc.stageGates) || []).find((g) => g.id === id) || null; },
  score(ctx, id) { return RD.hostScore('component', id, ctx.em); },
  hasSspec(fn) { return typeof SSPEC !== 'undefined' && !!SSPEC && typeof SSPEC[fn] === 'function'; },

  /* ------------------------------------------------- shared metric table and sheets */
  table(C, ctx, id, key) {
    if (!SCOMP.hasSspec('metricTable')) return null;
    try { return SSPEC.metricTable(C, ctx, { type: 'component', id: id }, { key: key }) || null; } catch (e) { console.error('[scomp] metric table', e); return null; }
  },
  addSpec(C, ctx, id) {
    if (!C.guard()) return;
    if (SCOMP.hasSspec('openMetric')) { SSPEC.openMetric(C, ctx, { type: 'component', id: id }, null); return; }
    C.toast('Adding a component specification is not available in this build.', 'info');
  },
  link(C, ctx, id) {
    if (!C.guard()) return;
    if (SCOMP.hasSspec('openLink')) { SSPEC.openLink(C, ctx, { type: 'component', id: id }); return; }
    C.toast('Linking a metric is not available in this build.', 'info');
  },

  /* --------------------------------------------------------- component sheet */
  openComponent(C, ctx, id) {
    if (!C.guard()) return;
    const g = id ? SCOMP.gate(ctx, id) : null;
    if (id && !g) return;
    const d = { name: g ? g.name || '' : '', ctype: g ? g.ctype || '' : '', status: g ? g.status || '' : '', notes: g ? g.notes || '' : '' };
    C[C.sheet() ? 'pushSheet' : 'openSheet']('scomp.comp', { id: id || '' }, d);
  },
  compSheet(C, ctx, sh) {
    const id = (sh.data && sh.data.id) || '';
    const g = id ? SCOMP.gate(ctx, id) : null;
    const d = sh.d || {};
    const isAdd = !id, gone = !!id && !g, isSub = !!(g && g.refModel), T = SCOMP.T;
    const fields = isSub ? ['name', 'notes'] : ['name', 'ctype', 'status', 'notes'];
    const dirty = isAdd ? fields.some((k) => T(d[k]) !== '') : (g ? fields.some((k) => T(d[k]) !== T(g[k])) : false);
    const set = (k) => (e) => C.setDraft({ [k]: e && e.target ? e.target.value : e });
    const save = () => SCOMP.saveComp(C, ctx);
    const mt = g && !isSub ? SCOMP.table(C, ctx, g.id, 'sheet') : null;
    const model = ctx.model ? ctx.model.name : '';
    return {
      title: isAdd ? 'Add component' : isSub ? 'Edit sub-product' : 'Edit component',
      sub: isAdd ? 'New component of ' + model : g ? (isSub ? 'Sub-product of ' : 'Component of ') + model : '',
      d: { name: d.name || '', ctype: d.ctype || '', status: d.status || '', notes: d.notes || '' },
      onName: set('name'), onType: set('ctype'), onStatus: set('status'), onNotes: set('notes'),
      onKey: (e) => { if (!e) return; if (e.key === 'Enter') { if (e.preventDefault) e.preventDefault(); save(); } else if (e.key === 'Escape') C.dismissSheet(e); },
      namePh: isSub ? 'e.g. Tera stack · Tera 25-30-R5' : 'e.g. Membrane Electrode Assembly (MEA)',
      isPlain: !isSub, isSub: isSub, isAdd: isAdd, gone: gone,
      goneText: 'This component was deleted, so there is nothing to save.',
      showSpecs: !!g && !isSub,
      addSpec: () => SCOMP.addSpec(C, ctx, id),
      link: () => SCOMP.link(C, ctx, id),
      mt: mt, hasMt: !!mt,
      saveLabel: isAdd ? 'Add component' : isSub ? 'Save sub-product' : 'Save component',
      saveOff: gone,
      cancelLabel: dirty ? 'Cancel' : 'Close',
      save: save
    };
  },
  saveComp(C, ctx) {
    const sh = C.sheet();
    if (!sh || sh.kind !== 'scomp.comp') return;
    const id = (sh.data && sh.data.id) || '';
    const g = id ? SCOMP.gate(ctx, id) : null;
    if (id && !g) { C.sheetErr('This component was deleted, so there is nothing to save.'); return; }
    const d = sh.d || {}, T = SCOMP.T, isSub = !!(g && g.refModel);
    /* today (readSubEditor, L668) stores a blank field as null; the name is not required (the card then shows the id) */
    const vals = { name: T(d.name) || null, notes: T(d.notes) || null };
    if (!isSub) { vals.ctype = T(d.ctype) || null; vals.status = T(d.status) || null; }
    const docKey = ctx.docKey, modelId = ctx.modelId;
    if (!id) {
      let newId = '';
      const ok = C.mutate((D) => {
        const doc = D.spec[docKey];
        if (!doc || !modelId) return false;
        doc.stageGates = doc.stageGates || [];
        newId = RD.allocId('stageGate', modelId, doc.stageGates.map((x) => x.id));
        doc.stageGates.push(Object.assign({ id: newId, objectiveId: modelId }, vals));
      }, { msg: 'Component added. You can add its specifications now.' });
      /* changed: the sheet stays open on the new component so its specifications can be added straight away */
      if (ok) {
        C.setDraft({ name: vals.name || '', ctype: vals.ctype || '', status: vals.status || '', notes: vals.notes || '' });
        /* the new component is saved: its draft is the new baseline, so Escape or the dimmed page close without asking */
        C.setSheetData({ id: newId, d0: JSON.stringify(C.draft()) });
      }
      return;
    }
    const ok = C.mutate((D) => {
      const doc = D.spec[docKey];
      const rec = doc && (doc.stageGates || []).find((x) => x.id === id);
      if (!rec) return false;
      Object.assign(rec, vals);
    }, { msg: isSub ? 'Sub-product saved.' : 'Component saved.' });
    if (ok) C.closeSheet();
  },

  /* ------------------------------------------------- delete and reorder components */
  /* what today's delSub('stageGate') (L729-743) takes with it */
  delImpact(ctx, id) {
    const doc = ctx.doc || {};
    const AK = SCOMP.akOf(doc, ctx.P);
    const kid = {};
    (doc.kpis || []).forEach((k) => { if (k.hostType === 'component' && k.hostId === id) kid[k.id] = 1; });
    const specs = Object.keys(kid).length;
    const reads = (doc.kpiUpdates || []).filter((u) => kid[u.kpiId]).length;
    const linked = (doc.kpis || []).filter((m) => { const p = RD.linkOf(m, AK).parent; return !kid[m.id] && p != null && kid[p]; }).length;
    const gating = (doc.kpis || []).filter((k) => kid[k.id] && k.gates).length;
    return { specs: specs, reads: reads, linked: linked, gating: gating };
  },
  confirmDelete(C, ctx, id) {
    if (!C.guard()) return;
    const g = SCOMP.gate(ctx, id);
    if (!g) return;
    const im = SCOMP.delImpact(ctx, id);
    const name = g.name || g.id;
    const parts = [im.specs ? 'Deletes ' + name + ' with its ' + F.plural(im.specs, 'specification') + (im.reads ? ' and ' + F.plural(im.reads, 'reading') : '') + '.' : 'Deletes ' + name + '. It has no specifications.'];
    if (im.gating) parts.push(im.gating === 1 ? 'One of them gates a product specification; that gate goes too.' : im.gating + ' of them gate product specifications; those gates go too.');
    if (im.linked) parts.push(im.linked === 1 ? 'One metric elsewhere is linked to them: it keeps its current name, unit and target and is unlinked.' : im.linked + ' metrics elsewhere are linked to them: they keep their current name, unit and target and are unlinked.');
    parts.push('This cannot be undone.');
    const docKey = ctx.docKey;
    C.confirm({
      title: 'Delete ' + name + '?', body: parts.join(' '), ok: 'Delete component', danger: true,
      onOk: () => C.mutate((D) => {
        const doc = D.spec[docKey];
        if (!doc || !(doc.stageGates || []).some((x) => x.id === id)) return false;
        const AK = SCOMP.akOf(doc, D.portfolio);
        const kid = {};
        (doc.kpis || []).forEach((k) => { if (k.hostType === 'component' && k.hostId === id) kid[k.id] = 1; });
        (doc.kpis || []).forEach((m) => {
          const p = RD.linkOf(m, AK).parent;
          if (p != null && kid[p] && !kid[m.id]) {
            m.name = RD.kpiName(m, AK); m.direction = RD.kpiDirection(m, AK); m.unit = RD.kpiUnit(m, AK);
            if (m.target == null) m.target = RD.effTarget(m, AK);
            m.linkParent = null; m.linkType = null; delete m.linkPriority;
          }
        });
        doc.kpis = (doc.kpis || []).filter((k) => !kid[k.id]);
        doc.kpiUpdates = (doc.kpiUpdates || []).filter((u) => !kid[u.kpiId]);
        doc.stageGates = doc.stageGates.filter((x) => x.id !== id);
      }, { msg: 'Component deleted.' })
    });
  },
  /* today's reorderWithin (L1583): `fromId` moves to sit before `toId` (or to the end) among this model's plain components */
  reorder(C, ctx, fromId, toId, msg) {
    const docKey = ctx.docKey, modelId = ctx.modelId;
    C.mutate((D) => {
      const doc = D.spec[docKey];
      if (!doc || fromId === toId) return false;
      const isMine = (r) => r.objectiveId === modelId && !r.refModel;
      const arr = doc.stageGates || [];
      const mine = arr.filter(isMine);
      const fi = mine.findIndex((r) => r.id === fromId);
      if (fi < 0) return false;
      const m = mine.splice(fi, 1)[0];
      let ti = toId ? mine.findIndex((r) => r.id === toId) : -1;
      if (ti < 0) ti = mine.length;
      mine.splice(ti, 0, m);
      let i = 0;
      doc.stageGates = arr.map((r) => (isMine(r) ? mine[i++] : r));
    }, { msg: msg || 'Reordered.' });
  },
  /* keyboard alternative to dragging */
  step(C, ctx, id, delta) {
    const comps = SCOMP.comps(ctx);
    const i = comps.findIndex((g) => g.id === id);
    if (i < 0) return;
    if (delta < 0 && i > 0) SCOMP.reorder(C, ctx, id, comps[i - 1].id, 'Component moved up.');
    else if (delta > 0 && i < comps.length - 1) SCOMP.reorder(C, ctx, id, i + 2 < comps.length ? comps[i + 2].id : '', 'Component moved down.');
  },

  /* --------------------------------------------------------------- the card */
  card(C, ctx, g, i, n, ro) {
    const s = SCOMP.score(ctx, g.id);
    const tone = F.band(s);
    const menuId = 'scomp:c:' + g.id;
    const notes = SCOMP.T(g.notes);
    const notesOpen = !!(C.state.scomp_notes || {})[g.id];
    const label = g.name || 'Unnamed component (' + g.id + ')';
    const tag = 'C' + (i + 1);
    const mt = SCOMP.table(C, ctx, g.id, 'page');
    const drag = C._drag && C._drag.kind === 'scomp.comp' ? C._drag : null;
    return {
      id: g.id, tag: tag, name: label, aria: 'Component ' + tag + ', ' + label,
      cls: 'scomp-card dz' + (drag && C.state.scomp_over === g.id && drag.id !== g.id ? ' hot' : '') + (drag && drag.id === g.id ? ' lift' : ''),
      canEdit: !ro, edit: () => SCOMP.openComponent(C, ctx, g.id), editLabel: 'Edit ' + tag + ', ' + label,
      hasType: !!g.ctype, ctype: g.ctype || '', hasStatus: !!g.status, status: g.status || '',
      word: SCOMP.word(tone), score: s == null ? '' : F.score(s), scoreCls: 'st ' + F.tone(tone),
      scoreTitle: 'Conformance to component specifications' + (s == null ? ': no data yet' : ': ' + F.score(s) + ', ' + SCOMP.word(tone).toLowerCase()),
      addSpec: () => SCOMP.addSpec(C, ctx, g.id), addSpecLabel: 'Add a specification to ' + tag,
      link: () => SCOMP.link(C, ctx, g.id), linkLabel: 'Link a metric to ' + tag,
      menuOpen: C.isMenu(menuId), toggleMenu: () => C.toggleMenu(menuId), moreAria: 'More actions for ' + tag,
      canUp: i > 0, canDown: i < n - 1,
      up: () => { C.closeMenus(); SCOMP.step(C, ctx, g.id, -1); },
      down: () => { C.closeMenus(); SCOMP.step(C, ctx, g.id, 1); },
      del: () => SCOMP.confirmDelete(C, ctx, g.id),
      hasNotes: !!notes, notes: notes, notesOpen: notesOpen,
      notesLabel: notesOpen ? 'Hide notes' : 'Notes',
      toggleNotes: () => C.setState({ scomp_notes: Object.assign({}, C.state.scomp_notes, { [g.id]: !notesOpen }) }),
      mt: mt, hasMt: !!mt,
      canDrag: !ro && n > 1, dragLabel: 'Drag ' + tag + ' to reorder',
      dragStart: (e) => {
        C._drag = { kind: 'scomp.comp', id: g.id };
        try { if (e && e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', g.id); } } catch (x) { /* some browsers refuse */ }
        C.setState({ scomp_over: '' });
      },
      dragEnd: () => { if (C._drag && C._drag.kind === 'scomp.comp') C._drag = null; C.setState({ scomp_over: '' }); },
      dragOver: (e) => {
        const d = C._drag;
        if (!d || d.kind !== 'scomp.comp') return;
        if (e && e.preventDefault) e.preventDefault();
        try { if (e && e.dataTransfer) e.dataTransfer.dropEffect = 'move'; } catch (x) { /* ignore */ }
        if (C.state.scomp_over !== g.id) C.setState({ scomp_over: g.id });
      },
      drop: (e) => {
        const d = C._drag;
        if (!d || d.kind !== 'scomp.comp') return;
        if (e && e.preventDefault) e.preventDefault();
        C._drag = null;
        C.setState({ scomp_over: '' });
        if (d.id !== g.id) SCOMP.reorder(C, ctx, d.id, g.id);
      }
    };
  }
};

MODS.scomp = {
  state: { scomp_closed: false, scomp_notes: {}, scomp_over: '' },
  vm(C, ctx) {
    const top = C.sheetOf('scomp');
    const out = { comp: top && top.kind === 'scomp.comp' ? SCOMP.compSheet(C, ctx, top) : null, show: !!ctx.model };
    if (!ctx.model) return Object.assign(out, { open: false, rows: [], empty: true, count: 0, sum: '', canEdit: false, emptyText: '' });
    const ro = C.isRo();
    const comps = SCOMP.comps(ctx);
    const open = !C.state.scomp_closed;
    const conformant = comps.filter((g) => F.band(SCOMP.score(ctx, g.id)) === 'ok').length;
    return Object.assign(out, {
      open: open, toggle: () => C.setState({ scomp_closed: open }),
      count: comps.length,
      sum: comps.length ? conformant + ' of ' + comps.length + ' conformant. Components are scored on their own specifications and don’t count toward the model’s conformance.' : '',
      canEdit: !ro, add: () => SCOMP.openComponent(C, ctx, ''),
      rows: open ? comps.map((g, i) => SCOMP.card(C, ctx, g, i, comps.length, ro)) : [],
      empty: !comps.length,
      emptyText: 'None yet. Components are the parts that must meet specifications to deliver the product specifications.'
    });
  }
};

/* ================= module: ssub (mods/ssub/mod.js) */
/* ============================================================================
   ssub: Product spec, Sub-products (inventory spec §12), Component owners and
   Cross-product dependencies (§13).

   Today: product_designer.template.html L554-603 (cross-document resolution),
   L764-856 (add / remove / auto-sync / links to spec), L1455-1544 (owners and
   cross-product dependencies), L1689-1773 (panel and the add picker).

   A sub-product is a host component (stageGates row with refModel) in this model,
   plus one imported row per child-model specification (kpis with refModel/refKr,
   linkType 'specification'), plus a portfolio composition edge CMP-<host> that the
   Planning app reads.

   Auto-sync: today imports child specifications added later on every render and
   saves. A Calm view model may not write, so rows not yet imported show straight
   away as computed rows, and every sub-product change first runs today's exact
   sync (same ids, same order) inside its save. Nothing else reads those rows
   before they are linked or given a target, so what people see and save matches.

   Other divisions' SPEC bins: today fetches them from the broker ("loading…",
   "unreachable"). The sample holds every document; the shell's ctx.refDocOfModel
   serves them, and its Settings simulate a slow load and an unreachable bin.
   Composition edges are written through ctx.portfolioWrite, the shell's version of
   today's persistPortfolio (including the merge after a simulated 412).

   Public interface (guard with typeof SSUB !== 'undefined'):
     SSUB.resolveRef(C, ctx, member)  today's resolveRef: { name, dir, unit, stackTgt,
         stackVal, tgt, score, live, pending, overridden } for an imported row; the
         specifications panel uses it for "From sub-products".
     SSUB.refDoc(C, ctx, modelId)    { doc, failed } for the model's SPEC document, or null while loading
     SSUB.hosts(ctx)                 this model's sub-product hosts
   ========================================================================== */

const SSUB = {
  blank() { return { keyResults: [], stageGates: [], kpis: [], kpiUpdates: [], modelSpec: {} }; },
  T(v) { return String(v == null ? '' : v).trim(); },

  /* ---------------------------------------------------------------- lookups */
  model(P, id) { return ((P && P.models) || []).find((m) => m.id === id) || null; },
  modelName(P, id) { const m = SSUB.model(P, id); return m ? m.name || m.id : id; },
  product(P, id) { return ((P && P.products) || []).find((p) => p.id === id) || null; },
  productName(P, id) { const p = SSUB.product(P, id); return p ? p.name || p.id : id; },
  productIdOf(P, modelId) { const m = SSUB.model(P, modelId); return m ? m.productId : null; },
  divOfModel(P, modelId) { const p = SSUB.product(P, SSUB.productIdOf(P, modelId)); return p ? p.divisionId : null; },
  divName(P, divId) { const d = ((P && P.divisions) || []).find((x) => x.id === divId); return d ? d.name || d.id : divId || ''; },
  akOf(doc, P) { const ks = (doc && doc.kpis) || []; return P && P.kpis && P.kpis.length ? ks.concat(P.kpis) : ks; },
  hosts(ctx) { return ((ctx.doc && ctx.doc.stageGates) || []).filter((g) => g.objectiveId === ctx.modelId && g.refModel); },
  specsOf(ctx) { return ((ctx.doc && ctx.doc.keyResults) || []).filter((r) => r.objectiveId === ctx.modelId); },
  childSpecs(rdoc, child) { return ((rdoc && rdoc.keyResults) || []).filter((r) => r.objectiveId === child); },
  /* a child spec's primary metric: its keyResult-hosted root KPI (today L594) */
  primary(rdoc, krId, RAK) { return ((rdoc && rdoc.kpis) || []).find((k) => k.hostType === 'keyResult' && k.hostId === krId && RD.linkOf(k, RAK).parent == null) || null; },

  /* ------------------------------------------- other documents (today refDocOfModel) */
  /* { doc, failed } for the SPEC document a model's specifications live in, or null while it loads */
  refDoc(C, ctx, modelId) {
    if (typeof ctx.refDocOfModel === 'function') return ctx.refDocOfModel(modelId);
    const div = SSUB.divOfModel(ctx.P, modelId);
    if (!div) return null;
    if (div === ctx.divId) return { doc: ctx.doc, failed: false };
    return { doc: (C.D.spec && C.D.spec['SPEC-' + div]) || SSUB.blank(), failed: false };
  },
  /* write the shared portfolio the way the live app does (persistPortfolio, L442) */
  portfolioWrite(C, ctx, apply, msg) {
    if (typeof ctx.portfolioWrite === 'function') return ctx.portfolioWrite(apply, msg);
    return C.mutate(apply, { msg: msg });
  },

  /* today's resolveRef (L586): the child spec's primary metric value and target, or for a %- or
     sub-spec-tracked child spec, target 100% and value = that spec's conformance */
  resolveRef(C, ctx, member) {
    const P = ctx.P;
    let name = member.name, dir = 'up', unit = member.unit || '', stackTgt = null, stackVal = null, live = false, pending = false, missing = false, binary = false;
    const rd = SSUB.refDoc(C, ctx, member.refModel);
    if (rd && rd.doc) {
      const kr = (rd.doc.keyResults || []).find((r) => r.id === member.refKr);
      if (kr) {
        name = kr.statement || name;
        const RAK = SSUB.akOf(rd.doc, P), REM = RD.withPortfolio(P, { REF: rd.doc });
        const pk = SSUB.primary(rd.doc, kr.id, RAK);
        if (pk) {
          dir = RD.kpiDirection(pk, RAK) || 'up'; unit = RD.kpiUnit(pk, RAK) || '';
          stackTgt = RD.effTarget(pk, RAK); stackVal = RD.effValue(pk, RAK, REM);
          binary = pk.targetType === 'binary';
        } else { dir = 'up'; unit = '%'; stackTgt = 100; stackVal = RD.keyResultScore(kr.id, REM); }
        live = true;
      } else { live = true; missing = !rd.failed; }
    } else {
      const dv = SSUB.divOfModel(P, member.refModel);
      if (dv && dv !== ctx.divId) pending = true;
    }
    const tgt = member.target != null ? member.target : stackTgt;
    const score = RD.rawScore(stackVal, tgt, dir);
    return { name: name, dir: dir, unit: unit, stackTgt: stackTgt, stackVal: stackVal, tgt: tgt, score: score, live: live, pending: pending, missing: missing, binary: binary, overridden: member.target != null };
  },

  /* ---------------------------------------------------------------- auto-sync */
  /* child specs not imported yet, as the rows today's sync would append (no ids yet) */
  missingRows(C, ctx, host, stored) {
    const rd = SSUB.refDoc(C, ctx, host.refModel);
    if (!rd || !rd.doc || rd.failed) return [];
    const RAK = SSUB.akOf(rd.doc, ctx.P);
    const have = {};
    stored.forEach((k) => { if (k.refKr) have[k.refKr] = 1; });
    return SSUB.childSpecs(rd.doc, host.refModel).filter((src) => !have[src.id]).map((src) => {
      const pk = SSUB.primary(rd.doc, src.id, RAK);
      return { id: '', vkey: host.id + '|' + src.id, objectiveId: ctx.modelId, hostType: 'component', hostId: host.id, refModel: host.refModel, refKr: src.id, linkType: 'specification', linkParent: null, name: src.statement || src.id, unit: pk ? RD.kpiUnit(pk, RAK) : '%', target: null };
    });
  },
  /* today's syncSubProductSpecs (L831), run inside C.mutate before every sub-product change */
  syncDoc(C, D, ctx) {
    const doc = D.spec[ctx.docKey];
    if (!doc) return 0;
    const P = D.portfolio, model = ctx.modelId;
    doc.kpis = doc.kpis || [];
    let n = 0;
    (doc.stageGates || []).filter((g) => g.objectiveId === model && g.refModel).forEach((hst) => {
      const child = hst.refModel, rd = SSUB.refDoc(C, ctx, child);
      if (!rd || !rd.doc || rd.failed) return;
      const RAK = SSUB.akOf(rd.doc, P);
      const have = {};
      doc.kpis.forEach((k) => { if (k.hostType === 'component' && k.hostId === hst.id && k.refKr) have[k.refKr] = 1; });
      SSUB.childSpecs(rd.doc, child).forEach((src) => {
        if (have[src.id]) return;
        const kid = RD.allocId('kpi', model, SSUB.akOf(doc, P).map((x) => x.id));
        const pk = SSUB.primary(rd.doc, src.id, RAK);
        doc.kpis.push({ id: kid, objectiveId: model, hostType: 'component', hostId: hst.id, refModel: child, refKr: src.id, linkType: 'specification', linkParent: null, name: src.statement || src.id, unit: pk ? RD.kpiUnit(pk, RAK) : '%', target: null });
        n++;
      });
    });
    return n;
  },
  findMember(doc, hostId, m) {
    const ks = (doc && doc.kpis) || [];
    if (m.id) return ks.find((k) => k.id === m.id) || null;
    return ks.find((k) => k.hostType === 'component' && k.hostId === hostId && k.refKr === m.refKr) || null;
  },

  /* ------------------------------------------------------------ formatting */
  fmtTarget(t, unit, dir, binary) {
    if (binary) return 'Pass';
    if (t == null) return 'No target';
    if (typeof t === 'object') return F.n(t.lo) + ' to ' + F.u(t.hi, unit);
    return (dir === 'down' ? '≤ ' : dir === 'up' ? '≥ ' : '') + F.u(t, unit);
  },
  fmtValue(v, unit, binary) {
    if (v == null || v === '') return 'No reading';
    if (binary) return Number(v) >= 1 ? 'Met' : 'Not met';
    return F.u(v, unit);
  },

  /* ------------------------------------------------- your target, links to spec */
  applyOverride(C, ctx, host, m, value) {
    const msg = value == null ? 'Override cleared. Using the sub-product’s target.' : 'Target override set.';
    const ok = C.mutate((D) => {
      SSUB.syncDoc(C, D, ctx);
      const rec = SSUB.findMember(D.spec[ctx.docKey], host.id, m);
      if (!rec) return false;
      rec.target = value;
    }, { msg: msg });
    if (ok) C.setState({ ssub_edit: null });
  },
  setOverride(C, ctx, host, m, isRange) {
    const E = C.state.ssub_edit || {};
    const T = SSUB.T;
    const err = (t) => C.setState({ ssub_edit: Object.assign({}, E, { err: t }) });
    let value = null;
    if (isRange) {
      const loT = T(E.lo), hiT = T(E.hi);
      if (loT || hiT) {
        if (!loT || !hiT) { err('Enter both ends of the range, or leave both blank to use the sub-product’s target.'); return; }
        const lo = K.num(loT), hi = K.num(hiT);
        if (lo == null || hi == null) { err('Use numbers for the range, like 2 and 4.'); return; }
        if (lo > hi) { err('The low end of the range must not be above the high end.'); return; }
        value = { lo: lo, hi: hi };
      }
    } else {
      const t = T(E.v);
      if (t) {
        const n = K.num(t);
        if (n == null) { err('Use a number, like 0.5. Leave it blank to use the sub-product’s target.'); return; }
        value = n;
      }
    }
    SSUB.applyOverride(C, ctx, host, m, value);
  },
  setLinkSpec(C, ctx, host, m, krId) {
    const linked = !!krId && SSUB.specsOf(ctx).some((r) => r.id === krId);
    C.mutate((D) => {
      SSUB.syncDoc(C, D, ctx);
      const doc = D.spec[ctx.docKey];
      const rec = SSUB.findMember(doc, host.id, m);
      if (!rec) return false;
      if (krId && (doc.keyResults || []).some((r) => r.id === krId && r.objectiveId === ctx.modelId)) rec.linkSpec = krId; else delete rec.linkSpec;
    }, { msg: linked ? 'Imported specification linked to a product specification.' : 'Link cleared.' });
  },

  /* ------------------------------------------------------- add and remove */
  addable(model, mid, comp, already) { return mid !== model && already.indexOf(mid) < 0 && !RD.wouldComposeCycle(model, mid, comp); },
  eligibleModels(ctx, pid) {
    const P = ctx.P, comp = P.composition || [];
    const already = RD.compositionChildren(ctx.modelId, comp);
    return (P.models || []).filter((m) => m.productId === pid && SSUB.addable(ctx.modelId, m.id, comp, already));
  },
  eligibleProducts(ctx) {
    const P = ctx.P, comp = P.composition || [];
    const already = RD.compositionChildren(ctx.modelId, comp);
    return (P.products || []).filter((p) => (P.models || []).some((m) => m.productId === p.id && SSUB.addable(ctx.modelId, m.id, comp, already)));
  },
  openAdd(C, ctx) {
    if (!C.guard()) return;
    const prods = SSUB.eligibleProducts(ctx);
    const pid = prods.length ? prods[0].id : '';
    const ms = pid ? SSUB.eligibleModels(ctx, pid) : [];
    C[C.sheet() ? 'pushSheet' : 'openSheet']('ssub.add', {}, { product: pid, model: ms.length ? ms[0].id : '' });
  },
  addSheet(C, ctx, sh) {
    const P = ctx.P, d = sh.d || {};
    const prods = SSUB.eligibleProducts(ctx);
    const pid = prods.some((p) => p.id === d.product) ? d.product : (prods.length ? prods[0].id : '');
    const models = pid ? SSUB.eligibleModels(ctx, pid) : [];
    const mid = models.some((m) => m.id === d.model) ? d.model : (models.length ? models[0].id : '');
    const groups = [], byDiv = {};
    prods.forEach((p) => {
      if (!byDiv[p.divisionId]) {
        byDiv[p.divisionId] = { key: p.divisionId || 'none', name: SSUB.divName(P, p.divisionId), here: p.divisionId === ctx.divId, prods: [] };
        groups.push(byDiv[p.divisionId]);
      }
      byDiv[p.divisionId].prods.push({ id: p.id, name: p.name || p.id, on: p.id === pid, pick: () => C.setDraft({ product: p.id, model: '' }) });
    });
    let preview = 'Select a model.', previewCls = 'sub', loading = false;
    if (mid) {
      const rd = SSUB.refDoc(C, ctx, mid);
      if (!rd || !rd.doc) { preview = 'Loading specifications…'; loading = true; }
      else if (rd.failed) { preview = 'Couldn’t reach that product’s SPEC bin. Is it configured on the broker?'; previewCls = 'note t-warn'; }
      else {
        const specs = SSUB.childSpecs(rd.doc, mid);
        const names = specs.slice(0, 6).map((s) => s.statement || s.id);
        preview = specs.length
          ? F.plural(specs.length, 'specification') + ' will import: ' + (specs.length > 6 ? names.join(', ') + ' and ' + (specs.length - 6) + ' more' : F.list(names)) + '.'
          : 'This model has no specifications yet. It will be added as an empty sub-product.';
      }
    }
    return {
      none: !prods.length, has: prods.length > 0,
      noneText: 'No other product has a model that can be added here. Every candidate would either duplicate an existing sub-product or form a composition cycle.',
      groups: groups,
      models: models.map((m) => ({ id: m.id, name: m.name || m.id, on: m.id === mid, pick: () => C.setDraft({ model: m.id }) })),
      noModels: !models.length,
      preview: preview, previewCls: previewCls, loading: loading,
      canAdd: !!mid, addOff: !mid,
      add: () => SSUB.add(C, ctx, mid)
    };
  },
  add(C, ctx, child) {
    if (!C.guard()) return;
    if (!child) { C.sheetErr('Select a model to add.'); return; }
    const P = ctx.P, model = ctx.modelId, comp = P.composition || [];
    if (RD.wouldComposeCycle(model, child, comp)) { C.sheetErr('That would create a composition cycle.'); return; }
    if (comp.some((e) => e.parent === model && e.child === child)) { C.sheetErr('That model is already a sub-product here.'); return; }
    const rd = SSUB.refDoc(C, ctx, child);
    if (!rd || !rd.doc) { C.sheetErr('Still loading that product’s specifications. Try again in a moment.'); return; }
    const n = SSUB.childSpecs(rd.doc, child).length;
    const msg = n ? 'Sub-product added, ' + F.plural(n, 'specification') + ' imported.' : rd.failed ? 'Sub-product added. Its specifications import once that product’s SPEC bin is reachable.' : 'Sub-product added.';
    /* the host, its imported rows and the composition edge are one change; the edge goes to the shared portfolio */
    const ok = SSUB.portfolioWrite(C, ctx, (D) => {
      const doc = D.spec[ctx.docKey];
      if (!doc) return false;
      SSUB.syncDoc(C, D, ctx);
      const PP = D.portfolio;
      PP.composition = PP.composition || [];
      if (PP.composition.some((e) => e.parent === model && e.child === child)) return false;
      const r2 = SSUB.refDoc(C, ctx, child) || { doc: SSUB.blank() };
      const RAK = SSUB.akOf(r2.doc, PP);
      doc.stageGates = doc.stageGates || [];
      doc.kpis = doc.kpis || [];
      const hostId = RD.allocId('stageGate', model, doc.stageGates.map((x) => x.id));
      const cpid = SSUB.productIdOf(PP, child);
      doc.stageGates.push({ id: hostId, objectiveId: model, refModel: child, refProduct: cpid, name: SSUB.productName(PP, cpid) + ' · ' + SSUB.modelName(PP, child) });
      SSUB.childSpecs(r2.doc, child).forEach((src) => {
        const kid = RD.allocId('kpi', model, SSUB.akOf(doc, PP).map((x) => x.id));
        const pk = SSUB.primary(r2.doc, src.id, RAK);
        doc.kpis.push({ id: kid, objectiveId: model, hostType: 'component', hostId: hostId, refModel: child, refKr: src.id, linkType: 'specification', linkParent: null, name: src.statement || src.id, unit: pk ? RD.kpiUnit(pk, RAK) : '%', target: null });
      });
      PP.composition.push({ id: 'CMP-' + hostId, parent: model, child: child });
    }, msg);
    if (ok) C.closeSheet();
  },
  confirmRemove(C, ctx, hostId, rowCount) {
    if (!C.guard()) return;
    const h = ((ctx.doc && ctx.doc.stageGates) || []).find((g) => g.id === hostId);
    if (!h) return;
    const P = ctx.P, model = ctx.modelId, child = h.refModel;
    const edges = (P.composition || []).filter((e) => e.id === 'CMP-' + hostId || (e.parent === model && e.child === child)).length;
    const body = 'Removes ' + (h.name || h.id) + ' from ' + SSUB.modelName(P, model) + ', with ' + (rowCount ? 'its ' + F.plural(rowCount, 'imported specification') + ' and any targets and links set on them' : 'no imported specifications') + '.' +
      (edges ? ' The composition link that Planning shows is removed too.' : '') + ' ' + SSUB.modelName(P, child) + ' itself is not changed.';
    const apply = (D) => {
      const doc = D.spec[ctx.docKey];
      if (!doc || !(doc.stageGates || []).some((g) => g.id === hostId)) return false;
      SSUB.syncDoc(C, D, ctx);

  /* ---------------------------------------------------------- the panels */
  rowVM(C, ctx, h, m, ro, specs) {

      key: key, name: r.name || '(unnamed)', pending: r.pending, missing: r.missing,

      stackValue: r.pending ? '…' : SSUB.fmtValue(r.stackVal, r.unit, r.binary),
      valCls: r.stackVal == null ? 'ssub-none' : '',

      yours: r.overridden ? SSUB.fmtTarget(own, r.unit, r.missing ? '' : r.dir, false) : 'Inherits',
      yCls: r.overridden ? '' : 'ssub-none',
      score: F.score(r.score), scoreCls: 'st ' + F.tone(tone),
      canEdit: !ro,
      linkVal: linkSpec ? linkSpec.id : '',
      linkText: linkSpec ? linkSpec.statement || linkSpec.id : 'Not linked',
      linkAria: 'Product specification that ' + (r.name || 'this row') + ' links to',
      onLink: (e) => SSUB.setLinkSpec(C, ctx, h, m, e && e.target ? e.target.value : ''),
      editing: editing, isRange: isRange, notRange: !isRange,
      ev: editing ? E.v || '' : '', elo: editing ? E.lo || '' : '', ehi: editing ? E.hi || '' : '',
      eph: ph,
      loPh: r.stackTgt && typeof r.stackTgt === 'object' ? F.n(r.stackTgt.lo) : 'low',
      hiPh: r.stackTgt && typeof r.stackTgt === 'object' ? F.n(r.stackTgt.hi) : 'high',
      earia: 'Your target for ' + (r.name || 'this row') + (r.unit ? ', in ' + r.unit : ''),
      err: editing ? E.err || '' : '', hasErr: !!(editing && E.err),
      canClear: editing && r.overridden,
      startEdit: () => C.setState({ ssub_edit: { key: key, v: own != null && typeof own !== 'object' ? String(own) : '', lo: own && typeof own === 'object' ? String(own.lo) : '', hi: own && typeof own === 'object' ? String(own.hi) : '', err: '' } }),
      onV: (e) => C.setState({ ssub_edit: Object.assign({}, C.state.ssub_edit, { key: key, v: e && e.target ? e.target.value : '', err: '' }) }),
      onLo: (e) => C.setState({ ssub_edit: Object.assign({}, C.state.ssub_edit, { key: key, lo: e && e.target ? e.target.value : '', err: '' }) }),
      onHi: (e) => C.setState({ ssub_edit: Object.assign({}, C.state.ssub_edit, { key: key, hi: e && e.target ? e.target.value : '', err: '' }) }),
      onKey: (e) => { if (!e) return; if (e.key === 'Enter') { if (e.preventDefault) e.preventDefault(); setT(); } else if (e.key === 'Escape') C.setState({ ssub_edit: null }); },
      setT: setT,

      cancel: () => C.setState({ ssub_edit: null })

  },
  hostVM(C, ctx, h, ro, specs) {
    const P = ctx.P;
    const stored = ((ctx.doc && ctx.doc.kpis) || []).filter((k) => k.hostType === 'component' && k.hostId === h.id);
    const all = stored.concat(SSUB.missingRows(C, ctx, h, stored));
    const rd = SSUB.refDoc(C, ctx, h.refModel);
    const dv = SSUB.divOfModel(P, h.refModel);
    const menuId = 'ssub:h:' + h.id;
    const notes = SSUB.T(h.notes);

    const label = h.name || h.refModel;
    return {
      id: h.id, name: label, aria: 'Sub-product ' + label,
      child: h.refModel, childName: SSUB.modelName(P, h.refModel),
      loading: !rd && !!dv && dv !== ctx.divId, unreachable: !!(rd && rd.failed),
      canEdit: !ro,
      edit: () => { if (typeof SCOMP !== 'undefined' && SCOMP.openComponent) SCOMP.openComponent(C, ctx, h.id); },
      menuOpen: C.isMenu(menuId), toggleMenu: () => C.toggleMenu(menuId), moreAria: 'More actions for ' + label,
      remove: () => SSUB.confirmRemove(C, ctx, h.id, all.length),
      rows: all.map((m) => SSUB.rowVM(C, ctx, h, m, ro, specs)),
      empty: !all.length,

  },
  /* today's ownerSpecTarget (L1492) */
  ownerTarget(kr, rdoc, P) {
    const RAK = SSUB.akOf(rdoc, P);
    const pk = SSUB.primary(rdoc, kr.id, RAK);

      if (pk.targetType === 'binary') return 'Pass';
      const dir = RD.kpiDirection(pk, RAK), unit = RD.kpiUnit(pk, RAK), tgt = RD.effTarget(pk, RAK);
      if (tgt == null) return 'No target';
      return SSUB.fmtTarget(tgt, unit, dir, false);

    return tt === 'percentage' || tt === 'subkr' ? '100%' : 'No target';
  },
  ownersVM(C, ctx) {
    const P = ctx.P;
    const parents = RD.compositionParents(ctx.modelId, P.composition || []);
    const closed = C.state.ssub_ownClosed || {};
    const flip = (k) => C.setState({ ssub_ownClosed: Object.assign({}, C.state.ssub_ownClosed, { [k]: !(C.state.ssub_ownClosed || {})[k] }) });
    const groups = [], idx = {};
    parents.forEach((pm) => {
      const ppid = SSUB.productIdOf(P, pm);
      if (!idx[ppid]) { idx[ppid] = { pid: ppid, models: [] }; groups.push(idx[ppid]); }
      idx[ppid].models.push(pm);

      open: open, toggle: () => C.setState({ ssub_ownOpen: !open }),
      count: parents.length, empty: !parents.length,
      emptyText: 'This model isn’t used as a sub-product in any other model yet. When it is, the owner products and their specifications show here.',
      prods: open ? groups.map((g) => {
        const pk = 'OWNP:' + g.pid, pOpen = !closed[pk];
        const pr = SSUB.product(P, g.pid);

          key: pk, name: SSUB.productName(P, g.pid), div: pr ? SSUB.divName(P, pr.divisionId) : '', hasDiv: !!pr,
          open: pOpen, toggle: () => flip(pk),
          models: pOpen ? g.models.map((pm) => {
            const mk = 'OWNM:' + pm, mOpen = !closed[mk];

            if (!rd || !rd.doc) state = 'loading';
            else if (rd.failed) state = 'unreachable';
            else {
              const REM = RD.withPortfolio(P, { REF: rd.doc });
              const specs = SSUB.childSpecs(rd.doc, pm);
              if (!specs.length) state = 'none';
              rows = specs.map((kr) => {
                const s = RD.keyResultScore(kr.id, REM);
                return { name: kr.statement || kr.id, target: SSUB.ownerTarget(kr, rd.doc, P), score: F.score(s), scoreCls: 'st ' + F.tone(F.band(s)) };
              });
            }
            return {
              key: mk, name: SSUB.modelName(P, pm), open: mOpen, toggle: () => flip(mk),
              loading: mOpen && state === 'loading', unreachable: mOpen && state === 'unreachable', none: mOpen && state === 'none',
              rows: mOpen ? rows : []
            };
          }) : []
        };
      }) : []
    };
  },
  /* Product KPIs: today's app carries full code for product-level KPIs (add / edit through the generic
     metric editor and saveSub L686-716, delete with its readings L722-727, post a reading L754-758, all
     written to the shared portfolio with persistPortfolio's merge on a 412) but no button reaches it: the
     panel it was written for became Component owners. Calm gives it its panel. The table, the editor and
     the writes are the shared ones (SSPEC.metricTable / SSPEC.openMetric with a product host). */
  prodVM(C, ctx) {
    const P = ctx.P;
    const pid = ctx.model ? ctx.model.productId : null;
    const prod = pid ? SSUB.product(P, pid) : null;
    const none = { show: false, open: false, rows: [], has: false, empty: false, count: 0, canEdit: false, sub: '', emptyText: '' };
    if (!prod || typeof SSPEC === 'undefined' || !SSPEC || typeof SSPEC.metricTable !== 'function') return none;
    const ro = C.isRo();
    const host = { type: 'product', id: pid };
    const mt = SSPEC.metricTable(C, ctx, host, { key: 'prod' });
    const open = !C.state.ssub_prodClosed;
    const nModels = ((P && P.models) || []).filter((m) => m.productId === pid).length;
    const pname = prod.name || prod.id;
    return {
      show: true, open: open, toggle: () => C.setState({ ssub_prodClosed: open }),
      count: mt.rows.length,
      sub: 'Shared by ' + (nModels === 1 ? 'the one model' : 'all ' + nModels + ' models') + ' of ' + pname + '. Specifications and components link to them from Link a metric.',
      canEdit: !ro,
      add: () => { if (!C.guard()) return; SSPEC.openMetric(C, ctx, host, null); },
      rows: open ? mt.rows : [],
      has: open && mt.rows.length > 0, empty: open && !mt.rows.length,
      emptyText: 'No product KPIs yet. Add one to give every model of ' + pname + ' the same target to link to.'
    };
  },
  /* today's crossProductImports + importsPanelHtml (L1457-1489): this product's linked metrics (every model in
     this division) whose source is another product's KPI */
  depsVM(C, ctx) {
    const P = ctx.P, doc = ctx.doc || {}, EM = ctx.em;
    const AK = SSUB.akOf(doc, P);
    const pid = SSUB.productIdOf(P, ctx.modelId);
    const imps = [];
    (doc.kpis || []).forEach((k) => {
      if (k.objectiveId == null || SSUB.productIdOf(P, k.objectiveId) !== pid) return;
      if (RD.linkOf(k, AK).parent == null) return;
      const def = RD.definerOf(k, AK);
      if (!def || def.hostType !== 'product' || def.hostId === pid) return;
      imps.push({ k: k, def: def });
    });
    const groups = [], idx = {};
    imps.forEach((im) => {
      const sp = im.def.hostId;
      if (!idx[sp]) {
        const pr = SSUB.product(P, sp);
        idx[sp] = { key: sp, name: SSUB.productName(P, sp), div: pr ? SSUB.divName(P, pr.divisionId) : '', hasDiv: !!pr, rows: [] };
        groups.push(idx[sp]);
      }
      const k = im.k, lk = RD.linkOf(k, AK), unit = RD.kpiUnit(k, AK), dir = RD.kpiDirection(k, AK);
      const bin = im.def.targetType === 'binary';
      const where = k.hostType === 'component'
        ? (((doc.stageGates || []).find((g) => g.id === k.hostId) || {}).name || k.hostId)
        : (((doc.keyResults || []).find((r) => r.id === k.hostId) || {}).statement || k.hostId);
      const cv = RD.effValue(k, AK, EM), s = RD.kpiScoreResolved(k, AK, EM);
      idx[sp].rows.push({
        key: 'dep:' + k.id, where: where, model: SSUB.modelName(P, k.objectiveId),
        metric: RD.kpiName(k, AK) || im.def.id, rel: F.cap(lk.type || 'contribute'),
        value: SSUB.fmtValue(cv, unit, bin), valCls: cv == null ? 'ssub-none' : '',
        target: SSUB.fmtTarget(RD.effTarget(k, AK), unit, dir, bin),
        score: F.score(s), scoreCls: 'st ' + F.tone(F.band(s))
      });
    });
    const open = !C.state.ssub_depClosed;
    return {
      show: imps.length > 0, open: open, toggle: () => C.setState({ ssub_depClosed: open }),
      count: imps.length, groups: open ? groups : [],
      sub: 'Metrics in ' + SSUB.productName(P, pid) + ' that inherit from another product’s KPI'
    };
  }
};

MODS.ssub = {

   Owns: selection (division, product, model), the sidebar product tree, the header,
   the model header with its conformance facts and signal bars, the status banner,
   the settings sheet (broker token, theme, product families, export / import JSON,
   read-only preview, URL-parameter links, sync simulations) and the "Model spec
   details" sheet.

   Live builds (LIVE, see LIVE.md): NET (kit/net.js) loads the portfolio and every R&D division's
   SPEC document (APP_LIVE_PLAN) and saves SPEC-* and the portfolio. The hooks at the end of this
   file pick the division, product and model after a load (APP_LIVE_READY) and show load states
   and other editors' changes in the banner (APP_LIVE_STATUS, APP_LIVE_NOTICE). Every simulation
   in this file (token-less local mode, slow or unreachable documents, 412s, teammate edits,
   restoring the sample) runs only in the sample build.

   ctx (read-only for modules; recomputed every render):
     today, nowMs, P (portfolio), ro
     connected      sample: a broker token is set (no token = the live app's local mode: no
                    portfolio). live: NET has loaded from the broker
     divs           divisions this app lists (kind 'rd'; biz divisions have no products here)
     div, divId     selected division
     docKey, doc    'SPEC-DIV-EL' and that document (always exists)
     products       products of the division (plan order); product, productId
     models         models of the product; model, modelId (the model being specified)
     em             RD.withPortfolio(P, { DOC: doc }) — the exact map the live app hands the engine
     AK             doc.kpis + P.kpis — the live app's allKpis()
     specs          this model's specifications (doc.keyResults, array order = display order)
     comps          this model's plain components (doc.stageGates without refModel, array order)
     subHosts       this model's sub-product hosts (doc.stageGates with refModel)
     productIdOf(modelId), productName(productId), modelById(id), productById(id),
     divOfProduct(productId) -> division name, specName(krId), componentName(sgId)
     refDivOfModel(modelId)  division id of a model's product
     refDocOfModel(modelId)  -> null while loading | { doc, failed? } (sample: other divisions are
                                simulated, Settings can make them slow or unreachable. live: NET
                                loaded every R&D division's document; one that is not there failed)
     refAllKpis(rdoc), refEm(rdoc), resolveRef(member)   sub-product resolution, as the live app
     portfolioWrite(apply, okMsg)  write the shared portfolio (composition edges) the way the
                                live app does: apply(D) changes D.portfolio; shows okMsg, or
                                "… (merged with a concurrent change)" when Settings simulates a 412.
                                live: C.mutate; NET saves the portfolio and merges on a 412 itself
   ========================================================================== */
const SPEC_HUB = 'https://celadynestaller.github.io/CeladyneHQ/';
const SPEC_MATURITY = ['Concept', 'Prototype', 'Pilot', 'Pre-production', 'Production'];

function specAllDivs(D) { return ((D.portfolio && D.portfolio.divisions) || []).slice().sort(K.byOrder); }
function specDivs(D) { return specAllDivs(D).filter((d) => RD.divisionKind(d) !== 'biz'); }
function specBlankDoc() { return { keyResults: [], stageGates: [], kpis: [], kpiUpdates: [], modelSpec: {} }; }
function specLS(key, value) {
  try {
    if (value === undefined) return window.localStorage.getItem(key);
    if (value === null) window.localStorage.removeItem(key); else window.localStorage.setItem(key, value);
  } catch (e) { return null; }
  return null;
}
function specUrlParams() {
  try {
    const s = (window.location && window.location.search) || '';
    if (!s) return {};
    const p = new URLSearchParams(s);
    return { division: p.get('division') || '', product: p.get('product') || '', token: p.get('token') || '', readonly: p.has('readonly') };
  } catch (e) { return {}; }
}

/* load-time repairs (L356–384): legacy links -> explicit, legacy host types renamed,
   colliding component / specification ids re-numbered and their metrics re-homed */
function specNormalizeDoc(doc) {
  if (!doc) return false;
  ['keyResults', 'stageGates', 'kpis', 'kpiUpdates'].forEach((k) => { if (!Array.isArray(doc[k])) doc[k] = []; });
  if (!doc.modelSpec || typeof doc.modelSpec !== 'object') doc.modelSpec = {};
  RD.migrateKpiLinks(doc.kpis);
  doc.kpis.forEach((k) => { if (k.hostType === 'initiative') k.hostType = 'product'; else if (k.hostType === 'stageGate') k.hostType = 'component'; });
  let changed = false;
  const sgs = doc.stageGates, kpis = doc.kpis;
  const groups = {};
  sgs.forEach((g) => { (groups[g.id] = groups[g.id] || []).push(g); });
  const used = sgs.map((g) => g.id);
  Object.keys(groups).forEach((oldId) => {
    const grp = groups[oldId];
    if (grp.length < 2) return;
    changed = true;
    const hosted = kpis.filter((k) => k.hostType === 'component' && k.hostId === oldId);
    grp.forEach((g) => { const fresh = RD.allocId('stageGate', g.objectiveId || 'MDL-X', used); used.push(fresh); g.__newId = fresh; });
    const firstNormal = grp.find((g) => !g.refModel) || grp[0];
    hosted.forEach((k) => {
      let host = null;
      if (k.refModel) host = grp.find((g) => g.refModel === k.refModel);
      k.hostId = (host || firstNormal).__newId;
    });
    grp.forEach((g) => { g.id = g.__newId; delete g.__newId; });
  });
  const krs = doc.keyResults, kseen = {}, kused = krs.map((k) => k.id);
  krs.forEach((kr) => {
    if (kseen[kr.id]) { const fresh = RD.allocId('keyResult', kr.objectiveId || 'MDL-X', kused); kr.id = fresh; kused.push(fresh); changed = true; }
    kseen[kr.id] = 1;
  });
  return changed;
}

/* live: a link to this page with parameters, as a full address (the relative name becomes
   product_designer.html when standalone.py packages the live pages) */
function specAbsUrl(rel) {
  try { return new URL(rel, window.location.href).href; } catch (e) { return rel; }
}

/* ---- initial state: called once from the constructor (and after "Restore the sample data") */
function APP_INIT(C, st) {
  if (LIVE) { specInitLive(C, st); return; }
  const D = C.D;

  /* theme (L4–10): rd_theme if valid, else follow the OS; storage that throws means dark */
  let theme = 'light';   /* Calm: light until a choice is saved, so the four boards match (today follows the OS; 'Match system' does that) */
  try { const t = window.localStorage.getItem('rd_theme'); if (t === 'light' || t === 'dark' || t === 'system') theme = t; } catch (e) { /* storage blocked: stay light */ }
  st.theme = theme;
  /* division: ?division, else the last session (rd_division), else the story's Electrolyzer */
  let divId = url.division || specLS('rd_division') || 'DIV-EL';
  const dd = specAllDivs(D).find((x) => x.id === divId);
  if (!dd) divId = divs.some((x) => x.id === 'DIV-EL') ? 'DIV-EL' : (divs[0] ? divs[0].id : '');
  else if (RD.divisionKind(dd) === 'biz') divId = divs[0] ? divs[0].id : '';   /* a biz division redirects to the first product division (L478) */
  st.divId = divId;
  /* today's loadAll stores the resolved division on every load with a token (L480) */
  if (divId) specLS('rd_division', divId);
  st.productId = 'PRD-EL-1';
  st.modelId = 'MDL-EL-1-1';
  if (url.product) st.productId = url.product;
  if (divId !== 'DIV-EL') { st.productId = url.product || ''; st.modelId = ''; }
  if (url.readonly) st.ro = true;
  st.sh_token = url.token || 'sample-broker-token';
  st.sh_banner = null;
  st.sh_open = {};
  st.sh_sim = { refDown: false, refLoading: false, portConflict: false };
  st.sh_lastPoll = D.nowMs;
  st.sh_link = { division: divId, product: '', token: '', readonly: false };
  const h = C.takeHandoff(APP);
  if (h && h.model) {
    const P = D.portfolio;
    const m = (P.models || []).find((x) => x.id === h.model);
    const p = m && (P.products || []).find((x) => x.id === m.productId);
    if (m && p && divs.some((x) => x.id === p.divisionId)) { st.divId = p.divisionId; st.productId = p.id; st.modelId = m.id; }
  }
}
/* live: C.D is still empty here (NET loads it after mount), so nothing below reads data. NET repairs

function specInitLive(C, st) {

  st.theme = theme;

  st.sh_token = '';
  st.sh_banner = null;

/* ---- context for modules */
function APP_CTX(C) {
  const D = C.D, S = C.state;
  /* live: the portfolio is the broker's (blank until NET loads it, and kept after a failed reload) */
  const connected = LIVE ? !!(C.net && C.net.loaded) : !!S.sh_token;
  const P = LIVE || connected ? D.portfolio : { divisions: [], products: [], models: [], kpis: [], composition: [], objectives: [], initiatives: [] };
  const divs = LIVE || connected ? specDivs(D) : [];
  /* live: when the picked division is gone (deleted in Planning since), fall back to one whose document loaded */
  const div = divs.find((d) => d.id === S.divId) || (LIVE ? divs.find((d) => D.spec['SPEC-' + d.id]) : null) || divs[0] || null;
  const divId = div ? div.id : '';
  const docKey = divId ? 'SPEC-' + divId : '';
  /* live: only a division whose document failed to load can lack one here; the blank one NET then saves
     with If-Match "0" after your first change, so it never overwrites a document the broker has (412) */
  if (docKey && !D.spec[docKey]) D.spec[docKey] = specBlankDoc();
  const doc = docKey ? D.spec[docKey] : specBlankDoc();
  const products = (P.products || []).filter((p) => p.divisionId === divId).slice().sort(K.byOrder);
  const product = products.find((p) => p.id === S.productId) || products[0] || null;
  const models = product ? (P.models || []).filter((m) => m.productId === product.id).slice().sort(K.byOrder) : [];
  const model = models.find((m) => m.id === S.modelId) || models[0] || null;
  const modelId = model ? model.id : '';
  const pk = P.kpis || [];
  const AK = pk.length ? doc.kpis.concat(pk) : doc.kpis;
  const em = RD.withPortfolio(P, { DOC: doc });
  /* remember the document before your last change: the 412 simulation reloads it (sample only) */
  if (!LIVE && C._snapVer !== D.version) {
    C._specPrev = C._specCur || null;
    C._specCur = { key: docKey, json: JSON.stringify(doc) };
    C._snapVer = D.version;
  }
  const modelById = (id) => (P.models || []).find((m) => m.id === id) || null;
  const productById = (id) => (P.products || []).find((p) => p.id === id) || null;
  const productIdOf = (mid) => { const m = modelById(mid); return m ? m.productId : null; };
  const productName = (id) => { const p = productById(id); return p ? (p.name || p.id) : id; };
  const divOfProduct = (pid) => { const p = productById(pid); if (!p) return null; const d = (P.divisions || []).find((x) => x.id === p.divisionId); return d ? (d.name || d.id) : (p.divisionId || null); };
  const refDivOfModel = (mid) => { const p = productById(productIdOf(mid)); return p ? p.divisionId : null; };
  const refDocOfModel = (mid) => {
    const dv = refDivOfModel(mid);
    if (!dv) return null;
    if (dv === divId) return { doc };
    /* live: NET loaded every R&D division's SPEC document with the portfolio (and a division added
       since, after the next portfolio change); one that is not there failed to load: unreachable */
    if (LIVE) return D.spec['SPEC-' + dv] ? { doc: D.spec['SPEC-' + dv] } : { doc: specBlankDoc(), failed: true };
    if (S.sh_sim && S.sh_sim.refLoading) return null;
    if (S.sh_sim && S.sh_sim.refDown) return { doc: specBlankDoc(), failed: true };
    const k = 'SPEC-' + dv;
    return { doc: D.spec[k] || specBlankDoc() };
  };
  const refAllKpis = (rdoc) => (pk.length ? (rdoc.kpis || []).concat(pk) : (rdoc.kpis || []));
  const refEm = (rdoc) => RD.withPortfolio(P, { REF: rdoc });
  /* one imported sub-product spec, resolved in its own document (L586) */
  const resolveRef = (member) => {
    let name = member.name, dir = 'up', unit = member.unit || '', stackTgt = null, stackVal = null, live = false, pending = false;
    const rd = refDocOfModel(member.refModel);
    if (rd && rd.doc) {
      const kr = (rd.doc.keyResults || []).find((r) => r.id === member.refKr);
      if (kr) {
        name = kr.statement || name;
        const RAK = refAllKpis(rd.doc), REM = refEm(rd.doc);
        const p0 = (rd.doc.kpis || []).find((k) => k.hostType === 'keyResult' && k.hostId === kr.id && RD.linkOf(k, RAK).parent == null);
        if (p0) { dir = RD.kpiDirection(p0, RAK) || 'up'; unit = RD.kpiUnit(p0, RAK) || ''; stackTgt = RD.effTarget(p0, RAK); stackVal = RD.effValue(p0, RAK, REM); }
        else { dir = 'up'; unit = '%'; stackTgt = 100; stackVal = RD.keyResultScore(kr.id, REM); }
      }
      live = true;
    } else if (refDivOfModel(member.refModel) && refDivOfModel(member.refModel) !== divId) pending = true;
    const tgt = member.target != null ? member.target : stackTgt;
    const score = RD.rawScore(stackVal, tgt, dir);
    return { name, dir, unit, stackTgt, stackVal, tgt, score, live, pending, overridden: member.target != null, failed: !!(rd && rd.failed) };
  };
  return {
    today: D.today, nowMs: C.now(), P, ro: !!S.ro, connected,
    divs, div, divId, docKey, doc,
    products, product, productId: product ? product.id : '',
    models, model, modelId,
    em, AK,
    specs: model ? (doc.keyResults || []).filter((r) => r.objectiveId === modelId) : [],
    comps: model ? (doc.stageGates || []).filter((g) => g.objectiveId === modelId && !g.refModel) : [],
    subHosts: model ? (doc.stageGates || []).filter((g) => g.objectiveId === modelId && g.refModel) : [],
    modelById, productById, productIdOf, productName, divOfProduct,
    specName: (id) => { const r = (doc.keyResults || []).find((x) => x.id === id); return r ? (r.statement || r.id) : id; },
    componentName: (id) => { const g = (doc.stageGates || []).find((x) => x.id === id); return g ? (g.name || g.id) : id; },
    refDivOfModel, refDocOfModel, refAllKpis, refEm, resolveRef,
    portfolioWrite: (apply, okMsg) => specPortfolioWrite(C, apply, okMsg)
  };
}

/* ---- simulated broker */
function specBanner(C, text, tone) { C.setState({ sh_banner: text ? { text: String(text), tone: tone || 'info' } : null }); }
/* the live app's persistPortfolio (L442): If-Match PUT, auto-merge on 412.
   live: a plain change; NET saves the portfolio and, on a 412, merges and saves again by itself */
function specPortfolioWrite(C, apply, okMsg) {
  if (LIVE) return C.mutate(apply, { msg: okMsg || 'Saved.' });
  const sim = C.state.sh_sim || {};
  if (!C.state.sh_token) {
    const ok0 = C.mutate(apply, {});
    if (ok0) specBanner(C, (okMsg || 'Saved') + ' (local only — add a broker token in Settings to sync).', 'info');
    return ok0;
  }
  if (sim.portConflict) {
    const ok1 = C.mutate(apply, {});
    if (ok1) {
      C.setState({ sh_sim: Object.assign({}, C.state.sh_sim, { portConflict: false }) });
      C.toast((okMsg || 'Saved.') + ' (merged with a concurrent change)', 'ok');
    }
    return ok1;
  }
  return C.mutate(apply, { msg: okMsg || 'Saved.' });
}
function specSwitchDivision(C, ctx, divId, after) {
  if (!divId) return false;
  if (divId === ctx.divId) { if (after) C.setState(after); return true; }
  const d = ctx.divs.find((x) => x.id === divId);
  if (!d) return false;
  if (LIVE) {
    /* NET loaded this division's document with the others; not there means its load failed (today L503) */
    if (!(C.D.spec || {})['SPEC-' + divId]) {
      specBanner(C, 'Couldn’t load SPEC-' + divId + ' — is its SPEC bin configured on the broker? Load from the broker in Settings to try again.', 'err');
      return false;
    }
    /* today flushes before repointing (flushPersist); NET saves per document, so nothing has to wait */
    if (NET.dirty(C).length) NET.flush(C);
    specLS('rd_division', divId);
    C.setState(Object.assign({ divId, productId: '', modelId: '', sheets: [], menu: '', dlg: null, sspec_reads: {} }, after || {}));
    C.toast('Switched to ' + d.name + '.', 'ok');
    return true;
  }
  if (C.state.sh_sim && C.state.sh_sim.refDown) {
    specBanner(C, 'Couldn’t load SPEC-' + divId + ' (503) — is its SPEC bin configured on the broker?', 'err');
    return false;
  }
  /* save pending edits for this division first (flushPersist), then repoint */
  const save = C.state.save && C.state.save.state === 'saving' ? { save: { state: 'saved', at: C.now() } } : {};
  specLS('rd_division', divId);
  C.setState(Object.assign({ divId, productId: '', modelId: '', sheets: [], menu: '', dlg: null, sspec_reads: {} }, save, after || {}));
  C.toast('Switched to ' + d.name + '.', 'ok');
  return true;
}
/* a teammate's change arriving (polling / conflict): Toru re-measures a metric on this model */
function specTeammateEdit(C, ctx, D) {
  const doc = D.spec[ctx.docKey];
  if (!doc || !ctx.modelId) return '';
  const AK = (D.portfolio.kpis || []).length ? doc.kpis.concat(D.portfolio.kpis) : doc.kpis;
  const em = RD.withPortfolio(D.portfolio, { DOC: doc });
  const cands = doc.kpis.filter((k) => k.objectiveId === ctx.modelId && !k.refModel && RD.effValue(k, AK, em) != null && (doc.kpiUpdates || []).some((u) => u.kpiId === k.id));
  const k = cands[0];
  if (!k) return '';
  const def = RD.definerOf(k, AK);
  const ups = (doc.kpiUpdates || []).filter((u) => u.kpiId === k.id).sort((a, b) => b.timestamp - a.timestamp);
  const last = Number(ups[0].value);
  const tgt = RD.effTarget(k, AK);
  let v = last;
  if (def.targetType === 'binary') v = 1;
  else if (typeof tgt === 'number') v = last + (tgt - last) * 0.25;
  else if (tgt && typeof tgt === 'object') v = last + ((tgt.lo + tgt.hi) / 2 - last) * 0.25;
  v = Number(v.toPrecision(3));
  const ts = Math.max(C.now(), ups[0].timestamp + 1);
  doc.kpiUpdates.push({ id: 'UPD-' + k.id + '-' + ts, kpiId: k.id, value: v, timestamp: ts, note: '' });
  return 'Toru Hayashi posted ' + F.u(v, RD.kpiUnit(k, AK)) + ' on ' + (RD.kpiName(k, AK) || k.id) + '.';
}
function specPoll(C, ctx) {
  if (LIVE) return;   // live: NET polls every 25 s
  /* offline, today's poll fails quietly (L519): nothing arrives until the connection returns */
  if (C.state.sim && C.state.sim.offline) { C.toast('You are offline, so other editors’ changes can’t arrive. The app checks again when the connection returns.', 'info'); return; }
  /* polling (every 25 s): save pending edits, compare versions, adopt the newer document */
  const sv = C.state.save && C.state.save.state === 'saving' ? { save: { state: 'saved', at: C.now() } } : {};
  let what = '';
  C.mutate((D) => { what = specTeammateEdit(C, ctx, D); if (!what) return false; }, { quiet: true, allowRo: true });
  C.setState(Object.assign({ sh_lastPoll: C.now() }, sv));
  if (what) specBanner(C, 'Updated from another editor. ' + what, 'info');
  else C.toast('Checked for changes. Nothing new from other editors.', 'info');
}
function specConflict(C, ctx) {
  if (LIVE) return;   // live: the broker's own 412s, resolved by NET
  const prev = C._specPrev;
  if (C.state.sim && C.state.sim.offline) { C.toast('You are offline, so no save reaches the broker and none can conflict. Restore the connection first.', 'info'); return; }
  if (!prev || prev.key !== ctx.docKey) { C.toast('Make a change first. A conflict happens when your save meets a teammate’s newer save.', 'info'); return; }
  let what = '';
  C.mutate((D) => {
    D.spec[ctx.docKey] = JSON.parse(prev.json);
    specNormalizeDoc(D.spec[ctx.docKey]);
    what = specTeammateEdit(C, ctx, D);
  }, { quiet: true, allowRo: true });
  C._specPrev = null;
  C.setState({ save: { state: 'conflict', at: C.now() }, sheets: [], menu: '', sspec_reads: {} });
  specBanner(C, 'Another editor saved first — reloaded; re-apply your change.' + (what ? ' Their change: ' + what : ''), 'err');
}

/* ---- export / import JSON (L521–532) */
/* what is wrong with a parsed import, or '' when it is a usable specification document.
   Today any parsable JSON is taken and a malformed one breaks the page; Calm refuses it first. */
function specImportProblem(obj) {
  const isRec = (x) => !!x && typeof x === 'object' && !Array.isArray(x);
  if (!isRec(obj)) return 'Import failed — not a valid document.';
  const lists = ['keyResults', 'stageGates', 'kpis', 'kpiUpdates'];
  for (let i = 0; i < lists.length; i++) {
    const k = lists[i];
    if (obj[k] == null) continue;
    if (!Array.isArray(obj[k]) || !obj[k].every(isRec)) return 'Import failed — not a valid document. “' + k + '” must be a list of records.';
  }
  if (obj.modelSpec != null && (!isRec(obj.modelSpec) || !Object.keys(obj.modelSpec).every((m) => isRec(obj.modelSpec[m])))) return 'Import failed — not a valid document. “modelSpec” must map model ids to their spec details.';
  return '';
}
function specExportVM(C, ctx) {
  const json = JSON.stringify(ctx.doc, null, 2);

  return {

function specImportVM(C, ctx, top) {

      body: 'Importing replaces every model’s specifications, components, metrics and readings in ' + (ctx.div ? ctx.div.name : 'this division') + ' (now ' +
        F.plural(n('keyResults'), 'specification') + ', ' + F.plural(n('kpis'), 'metric') + ' and ' + F.plural(n('kpiUpdates'), 'reading') + '; the file has ' +
        F.plural(inN('keyResults'), 'specification') + ', ' + F.plural(inN('kpis'), 'metric') + ' and ' + F.plural(inN('kpiUpdates'), 'reading') + '). The broker copy is overwritten when it saves.',
      ok: 'Import and replace', danger: true,

    run,
    close: () => C.closeSheet()
