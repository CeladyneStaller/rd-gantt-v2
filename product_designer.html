<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Specification</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* ============================================================================
   Calm kit: shared tokens and components for the four calm prototypes.
   Light is the default; [data-theme="dark"] on .cw switches every token.
   Module CSS must use these variables (never raw hex) so dark mode keeps working.
   ========================================================================== */
body{margin:0}
.cw{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F9FB; --surface-3:#FBFCFD; --hover:#F2F5F9; --press:#E9EDF2;
  --line:#E1E5EB; --line-2:#E8ECF1; --line-3:#EEF1F4; --field:#D3D9E1; --field-hover:#B9C2CE;
  --ink:#17202C; --ink-2:#3A4656; --muted:#5B6878; --faint:#8C97A5; --ghost:#B9C2CE;
  --accent:#2B57B5; --accent-ink:#1F4590; --accent-soft:#EAF0FB; --accent-line:#B7C8EC; --accent-ring:rgba(43,87,181,.18); --accent-wash:#F6F8FD;
  --ok:#12784A; --ok-ink:#0E6640; --ok-soft:#E6F3EC; --ok-line:#B9DCC9;
  --warn:#C98A16; --warn-ink:#8A5D07; --warn-soft:#FBF3E1; --warn-line:#EBD3A2;
  --bad:#B4352A; --bad-ink:#9A2C22; --bad-soft:#FBECEA; --bad-line:#EBC0BA;
  --none:#C7CFD9; --track:#E6EAF0; --info-soft:#EEF2F7;
  --pri:#17202C; --pri-hover:#2C3848; --pri-ink:#FFFFFF;
  --shadow-1:0 1px 2px rgba(23,32,44,.06); --shadow-pop:0 12px 32px rgba(23,32,44,.14); --shadow-sheet:-18px 0 48px rgba(23,32,44,.16);
  --scrim:rgba(23,32,44,.28);
  font-family:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink); background:var(--bg); font-size:14px; line-height:1.45;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  color-scheme:light;
  min-height:100vh; display:flex; flex-direction:column;
}
.cw[data-theme="dark"]{
  --bg:#0F141A; --surface:#161C24; --surface-2:#1B222B; --surface-3:#19202A; --hover:#202833; --press:#27303C;
  --line:#2A333F; --line-2:#252E39; --line-3:#222A34; --field:#3A4554; --field-hover:#4C5868;
  --ink:#E6EBF1; --ink-2:#C5CEDA; --muted:#9AA6B4; --faint:#717D8C; --ghost:#55606E;
  --accent:#86A8F2; --accent-ink:#AEC5F7; --accent-soft:#1D2840; --accent-line:#3A5180; --accent-ring:rgba(134,168,242,.25); --accent-wash:#18213A;
  --ok:#4DBE88; --ok-ink:#7FD4AA; --ok-soft:#14291F; --ok-line:#2A5A43;
  --warn:#E0AC4C; --warn-ink:#EBC47A; --warn-soft:#2B2213; --warn-line:#5E4A22;
  --bad:#EC7A6E; --bad-ink:#F2A097; --bad-soft:#2E1816; --bad-line:#6A322C;
  --none:#4A5564; --track:#2A333F; --info-soft:#1E2631;
  --pri:#E6EBF1; --pri-hover:#C9D2DD; --pri-ink:#10161D;
  --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-pop:0 14px 36px rgba(0,0,0,.5); --shadow-sheet:-18px 0 48px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}
.cw *{box-sizing:border-box}
.cw :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cw a{color:var(--accent);text-decoration:none}
.cw a:hover{color:var(--accent-ink)}
.cw svg{flex:none}
.cw h1,.cw h2,.cw h3{margin:0;font-weight:600;letter-spacing:-.005em}

/* ---------- app frame ---------- */
.app{display:flex;align-items:stretch;flex:1 0 auto}
.side{flex:0 0 252px;width:252px;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:18px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center}
.brand-name{display:flex;flex-direction:column;line-height:1.15}
.brand-name b{font-weight:700;font-size:15px}
.nav{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;color:var(--ink-2);font-weight:500}
.cw a.nav{color:var(--ink-2)}
.cw a.nav:hover,.nav:hover{background:var(--hover);color:var(--ink)}
.cw a.nav.on,.nav.on{background:var(--accent-soft);color:var(--accent-ink)}
button.nav{width:100%;border:0;background:transparent;font:inherit;text-align:left;cursor:pointer}
.side-sec{display:flex;flex-direction:column;gap:4px}
.grp{font-size:12px;font-weight:600;color:var(--muted);padding:0 10px}
.grp.gap{margin-top:12px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px 2px;border-top:1px solid var(--line-2)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.avatar.sm{width:22px;height:22px;font-size:10.5px}
.avatar.xs{width:18px;height:18px;font-size:9.5px}
.main{flex:1 1 640px;min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;min-height:60px;padding:10px 32px;border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:5}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted);font-weight:500;min-width:0}
.crumb .sep{color:var(--ghost)}
.page{display:flex;flex-direction:column;gap:20px;padding:24px 32px 64px;min-width:0}
.search{display:flex;align-items:center;gap:8px;height:36px;width:320px;max-width:100%;padding:0 12px;border:1px solid var(--field);border-radius:8px;background:var(--surface);color:var(--faint)}
.search input{border:0;outline:0;flex:1;min-width:0;font:inherit;color:var(--ink);background:transparent}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.saveind{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap}

/* ---------- objective list (sidebar) ---------- */
.obj{display:flex;align-items:flex-start;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--ink);font:inherit;line-height:1.35;text-align:left;cursor:pointer}
.obj:hover{background:var(--hover)}
.obj.on{background:var(--accent-soft)}
.obj .s{margin-left:auto;padding-left:6px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.obj .dot{margin-top:6px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--field);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover);border-color:var(--field-hover)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:default}
.btn.q{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.q:hover{background:var(--press);color:var(--ink)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.pri:hover{background:var(--pri-hover);border-color:var(--pri-hover)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
.cw[data-theme="dark"] .btn.acc{color:#10161D}
.btn.danger{color:var(--bad-ink);border-color:var(--bad-line);background:var(--surface)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#FFFFFF}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:7px}
.btn.xs{height:26px;padding:0 8px;font-size:12.5px;border-radius:6px;gap:5px}
.btn.ic{width:36px;padding:0}
.btn.sm.ic{width:30px}
.btn.xs.ic{width:26px}
.btn.full{width:100%}
.lnk{display:inline;padding:0;border:0;background:transparent;color:var(--accent);font:inherit;font-weight:500;text-align:left;cursor:pointer}
.lnk:hover{color:var(--accent-ink);text-decoration:underline}
.lnk.ink{color:var(--ink)}
.lnk.ink:hover{color:var(--accent-ink)}
.lnk.muted{color:var(--muted)}
.lnk.bad{color:var(--bad-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:500;white-space:nowrap;cursor:pointer}
.chip:hover{border-color:var(--field-hover);color:var(--ink)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.chip.static{cursor:default}
.handle{display:inline-grid;place-items:center;width:18px;height:24px;color:var(--ghost);cursor:grab;flex:none}
.handle:hover{color:var(--muted)}

/* ---------- status ---------- */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:var(--none)}
.dot.lg{width:10px;height:10px}
.t-ok .dot,.dot.t-ok{background:var(--ok)}
.t-warn .dot,.dot.t-warn{background:var(--warn)}
.t-bad .dot,.dot.t-bad{background:var(--bad)}
.t-info .dot,.dot.t-info{background:var(--accent)}
.t-none .dot,.dot.t-none{background:var(--none)}
.st{display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:13px;white-space:nowrap}
.tx-ok{color:var(--ok-ink)} .tx-warn{color:var(--warn-ink)} .tx-bad{color:var(--bad-ink)} .tx-info{color:var(--accent-ink)} .tx-none{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;padding:2px 9px;border-radius:6px;white-space:nowrap;background:var(--info-soft);color:var(--ink-2)}
.pill.t-ok{background:var(--ok-soft);color:var(--ok-ink)}
.pill.t-warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.t-bad{background:var(--bad-soft);color:var(--bad-ink)}
.pill.t-info{background:var(--accent-soft);color:var(--accent-ink)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted);font-size:11.5px;font-weight:600;white-space:nowrap}
.tid{font-size:12px;font-weight:600;color:var(--faint)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#FFFFFF;font-size:11.5px;font-weight:600}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel.flat{border-radius:10px}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 20px}
.ph .act{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.h1{font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.h2{font-size:16px;font-weight:600}
.h3{font-size:14px;font-weight:600}
.cnt{font-size:12px;color:var(--faint);font-weight:600}
.pb{padding:16px 20px}
.sec{border-top:1px solid var(--line-2)}
.li{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line-3);min-width:0}
.li:first-child{border-top:0}
.empty{padding:18px 20px;color:var(--muted)}
.sec>.empty,.ph+.empty{border-top:1px solid var(--line-2)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2);font-size:13.5px}
.note.t-warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn-ink)}
.note.t-bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad-ink)}
.note.t-ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok-ink)}
.note.t-info{background:var(--accent-wash);border-color:var(--accent-line);color:var(--accent-ink)}
.sub{color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.strong{font-weight:600}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row.wrap{flex-wrap:wrap}
.row.top{align-items:flex-start}
.row.g4{gap:4px}.row.g12{gap:12px}.row.g16{gap:16px}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.col.g2{gap:2px}.col.g10{gap:10px}.col.g16{gap:16px}
.grow{flex:1 1 auto;min-width:0}
.push{margin-left:auto}
.hide{display:none}

/* ---------- tabs and segmented controls ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:24px;border-bottom:1px solid var(--line);padding:0 2px}
.tab{height:44px;display:inline-flex;align-items:center;gap:6px;padding:0;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font:inherit;font-weight:500;white-space:nowrap;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;padding:3px;gap:2px;border-radius:9px;background:var(--press)}
.seg button{height:28px;padding:0 11px;border:0;border-radius:7px;background:transparent;font:inherit;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.seg button:disabled{cursor:default;opacity:.5}

/* ---------- forms ---------- */
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
.fld>.lab{display:flex;align-items:center;gap:6px}
.fld .hint{font-weight:400;color:var(--faint)}
.in,.ta,.sel{height:36px;padding:0 10px;border:1px solid var(--field);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:400;min-width:0}
.ta{height:auto;min-height:76px;padding:8px 10px;line-height:1.45;resize:vertical}
.sel{padding-right:6px;cursor:pointer}
.in:hover,.ta:hover,.sel:hover{border-color:var(--field-hover)}
.in:focus,.ta:focus,.sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.in.sm,.sel.sm{height:30px;font-size:13px;padding:0 8px}
.in.bad,.ta.bad,.sel.bad{border-color:var(--bad)}
.in:disabled,.ta:disabled,.sel:disabled{opacity:.6;cursor:default}
.in.num{text-align:right}
.cb{width:16px;height:16px;margin:0;accent-color:var(--accent);flex:none;cursor:pointer}
.cw input[type=range]{accent-color:var(--accent)}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);font-weight:400;cursor:pointer}
.frm{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:14px 20px;border-top:1px solid var(--line-2);background:var(--surface-3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.err{color:var(--bad-ink);font-size:12.5px;font-weight:500}
.okn{color:var(--ok-ink);font-size:12.5px;font-weight:500}
.hint{color:var(--faint);font-size:12.5px}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:500;font-size:12.5px;color:var(--muted);background:var(--surface-2);padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:9px 12px;border-top:1px solid var(--line-3);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.hov:hover td{background:var(--surface-3)}
.tbl tr.sel td{background:var(--accent-wash)}
.tbox{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}

/* ---------- bars and meters ---------- */
.track{position:relative;display:block;height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.track.sm{height:6px}
.track.lg{height:10px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent);transition:width .25s ease}
.fill.t-ok{background:var(--ok)} .fill.t-warn{background:var(--warn)} .fill.t-bad{background:var(--bad)} .fill.t-none{background:var(--none)}
.hatch{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--warn) 0 3px,transparent 3px 6px);opacity:.55}
.hatch.t-bad{background:repeating-linear-gradient(135deg,var(--bad) 0 3px,transparent 3px 6px)}
.hatch.t-ok{background:repeating-linear-gradient(135deg,var(--ok) 0 3px,transparent 3px 6px)}
.tick{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--ink)}
.meter{display:flex;flex-direction:column;gap:6px;min-width:0}

/* ---------- menus and popovers ---------- */
.scrim{position:fixed;inset:0;z-index:25;border:0;margin:0;padding:0;background:transparent;cursor:default}
.above{position:relative;z-index:31}
.anchor{position:relative}
.menu{position:absolute;z-index:32;display:flex;flex-direction:column;gap:2px;min-width:200px;max-height:420px;overflow:auto;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-pop)}
.menu.r{right:0}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:6px 10px;border:0;border-radius:7px;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;text-align:left;cursor:pointer;white-space:nowrap}
.mi:hover{background:var(--hover)}
.mi.on{background:var(--accent-soft);color:var(--accent-ink)}
.mi.bad{color:var(--bad-ink)}
.mi:disabled{opacity:.5;cursor:default}
.mi .sub{margin-left:auto;padding-left:12px}
.mh{padding:6px 10px 2px;font-size:12px;font-weight:600;color:var(--muted)}
.msep{height:1px;margin:4px 6px;background:var(--line-2)}
.pop{position:absolute;z-index:32;width:340px;max-width:calc(100vw - 32px);display:flex;flex-direction:column;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-pop);color:var(--ink);font-size:13.5px;text-align:left;font-weight:400}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;font-size:13px;align-items:baseline}
.kv>.k{color:var(--muted)}

/* ---------- sheets (right-hand editors) and dialogs ---------- */
.sheet-scrim{position:fixed;inset:0;z-index:40;border:0;margin:0;padding:0;background:var(--scrim);cursor:default}
.sheet{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(600px,100%);display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-sheet)}
.sheet.wide{width:min(860px,100%)}
.sh-head{display:flex;align-items:flex-start;gap:12px;padding:18px 22px 14px;border-bottom:1px solid var(--line-2)}
.sh-title{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.sh-title h2{font-size:18px;font-weight:600;line-height:1.3}
.sh-body{flex:1;overflow:auto;padding:18px 22px 28px;display:flex;flex-direction:column;gap:18px}
.sh-sec{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid var(--line-2)}
.sh-sec:first-child{padding-top:0;border-top:0}
.sh-sec>h3{font-size:14px;font-weight:600}
.sh-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 22px;border-top:1px solid var(--line-2);background:var(--surface-3)}
.sh-foot .push{margin-left:auto}
.dlg-scrim{position:fixed;inset:0;z-index:60;border:0;margin:0;padding:0;background:var(--scrim);cursor:default}
.dlg{position:fixed;z-index:61;left:50%;top:22%;transform:translateX(-50%);width:min(460px,calc(100% - 32px));display:flex;flex-direction:column;gap:14px;padding:20px 22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-pop)}
.dlg h2{font-size:17px}
.dlg .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}

/* ---------- toasts and banners ---------- */
.toasts{position:fixed;z-index:70;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:560px;padding:10px 14px;border-radius:10px;background:var(--pri);color:var(--pri-ink);font-size:13.5px;box-shadow:var(--shadow-pop);pointer-events:auto}
.toast.err{background:var(--bad);color:#FFFFFF}
.toast.info{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.toast .x{margin-left:6px;padding:0;border:0;background:transparent;color:inherit;opacity:.7;cursor:pointer;font:inherit}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 32px;border-bottom:1px solid var(--line);font-size:13.5px}
.banner.t-warn{background:var(--warn-soft);color:var(--warn-ink);border-color:var(--warn-line)}
.banner.t-bad{background:var(--bad-soft);color:var(--bad-ink);border-color:var(--bad-line)}
.banner.t-info{background:var(--accent-wash);color:var(--accent-ink);border-color:var(--accent-line)}

/* ---------- facts strip ---------- */
.facts{display:flex;flex-wrap:wrap;gap:14px 0}
.fact{display:flex;flex-direction:column;gap:2px;padding:0 22px;border-left:1px solid var(--line-2);min-width:0}
.fact:first-child{padding-left:0;border-left:0}
.fv{font-weight:600;font-size:15px}

/* ---------- drag feedback ---------- */
.dz{transition:background .12s ease,box-shadow .12s ease}
.dz.hot{background:var(--accent-wash);box-shadow:inset 0 0 0 2px var(--accent-line)}
.lift{opacity:.45}
.dim{opacity:.4}

.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--none);border-top-color:var(--muted);animation:cwspin .8s linear infinite;flex:none}
@keyframes cwspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}.fill,.dz{transition:none}}
@media (max-width: 900px){
  .side{display:none}
  .top,.page{padding-left:16px;padding-right:16px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
}

/* ---- apps/spec/shell.css */
/* Product spec shell (S-core). Tokens only: dark mode follows .cw[data-theme="dark"]. */
.spc-brand{color:var(--ink);text-decoration:none;border-radius:8px}
.cw a.spc-brand{color:var(--ink)}
.cw a.spc-brand:hover{background:var(--hover);color:var(--ink)}
.spc-tree{gap:2px}
.spc-prow{display:flex;align-items:center;gap:2px;min-width:0}
.spc-chev{flex:none;color:var(--muted)}
.spc-chev svg{transition:transform .15s ease}
.spc-prod{flex:1;min-width:0;height:32px;padding:0 8px;font-weight:600;color:var(--ink)}
.spc-model{padding-left:34px}
.spc-model .ellip{flex:1}
.spc-nomodels{padding:2px 10px 4px 34px}
.spc-meta{gap:4px 14px}
.spc-notes{font-size:13.5px;margin-top:4px;white-space:pre-wrap}
.spc-banner{padding-left:32px;padding-right:20px}
.spc-conf{display:flex;flex-wrap:wrap;align-items:flex-start;gap:20px 36px;padding:20px 24px}
.spc-big{display:flex;align-items:center;gap:16px;flex:0 1 330px;min-width:240px}
.spc-num{font-size:46px;font-weight:650;letter-spacing:-.02em;line-height:1;min-width:64px}
.spc-bar{width:200px;max-width:100%;margin-top:6px}
.spc-signals{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:10px}
.spc-sighead{gap:8px 16px}
.spc-legend{font-weight:400}
.spc-legend .st{font-size:12.5px;font-weight:500}
.spc-siggrid{display:grid;grid-template-columns:minmax(120px,240px) minmax(0,1fr) 52px;gap:8px 12px;align-items:center;font-size:13px}
.spc-siglbl{min-width:0}
.spc-sigval{justify-content:flex-end}
.spc-facts{padding:14px 24px;border-top:1px solid var(--line-2)}
.spc-facts .fact{gap:1px}
.spc-empty{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.spc-empty>span{flex:1 1 320px}
.spc-endrow{align-self:flex-end;min-height:36px}
.spc-url{align-items:center}
.spc-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;color:var(--ink)}
.spc-json{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;min-height:280px;white-space:pre}
@media (max-width: 900px){.spc-siggrid{grid-template-columns:minmax(0,1fr) 90px 48px}.spc-big{flex-basis:100%}}

/* ---- mods/sspec/mod.css */
/* sspec: product specifications + the shared metric table. Tokens only. */
.sspec-coll{display:inline-flex;align-items:center;gap:8px;padding:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.sspec-coll svg{color:var(--muted);transition:transform .15s ease}
.sspec-coll .cnt{margin-left:2px}
.sspec-list{display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px}
.sspec-card{border:1px solid var(--line-2);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;min-width:0}
.sspec-card.hot{box-shadow:inset 0 3px 0 0 var(--accent)}
.sspec-head{display:flex;align-items:flex-start;gap:10px;padding:12px 14px 10px}
.sspec-head .handle{margin-top:3px}
.sspec-tag{margin-top:3px;min-width:22px}
.sspec-stmt{font-size:15px;font-weight:600;line-height:1.35}
.sspec-score{font-size:15px;font-weight:600;margin-top:2px}
.sspec-acts{flex:none}
.sspec-pad{padding:0 14px 12px}
.sspec-prog{display:flex;align-items:center;gap:12px;padding:0 14px 12px}
.sspec-prog .track{min-width:120px}
.sspec-subs{display:flex;flex-direction:column;margin:0 14px 12px;border:1px solid var(--line-2);border-radius:8px}
.sspec-subrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 12px;border-top:1px solid var(--line-3);font-size:13.5px}
.sspec-subrow:first-child{border-top:0}
.sspec-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:0 14px 10px;font-size:13.5px}
.sspec-note{white-space:pre-wrap;font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px}
.sspec-note-card{margin:0 14px 12px}
.sspec-mt .tbl td{vertical-align:top}
.sspec-mt .tbl th{white-space:nowrap}
.sspec-mcell{min-width:180px}
.sspec-mname{font-weight:500;text-align:left}
.sspec-badges{margin-top:4px}
.sspec-badges .tag{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.sspec-read{width:92px}
.sspec-menuwrap{display:inline-block}
.sspec-mt .tbl tr.sspec-drop td{box-shadow:inset 0 2px 0 0 var(--accent)}
.sspec-note-tr td{padding-top:0;border-top:0}
.sspec-mt-empty{border-top:0;font-size:13.5px}
.sspec-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sspec-pct{min-width:44px;text-align:right}
.sspec-ferr{flex-basis:100%}
.sspec-gh{padding-left:2px}
.sspec-cand{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;text-align:left;cursor:pointer}
.sspec-cand:hover{border-color:var(--field-hover);background:var(--surface-3)}
.sspec-cand.on{border-color:var(--accent);background:var(--accent-wash)}
.sspec-cand>.sub:last-child{white-space:nowrap}
.sspec-radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--field-hover);flex:none;background:var(--surface)}
.sspec-cand.on .sspec-radio{border:5px solid var(--accent)}
.sspec-subname{text-align:left;font-weight:500}

/* ---- mods/scomp/mod.css */
/* scomp: components panel (tokens only, so dark mode follows) */
.scomp-h{display:flex;align-items:center;margin:0}
.scomp-tgl{display:inline-flex;align-items:center;gap:8px;padding:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.scomp-tgl svg{color:var(--faint);transition:transform .15s ease}
.scomp-tgl[aria-expanded="false"] svg{transform:rotate(-90deg)}
.scomp-tgl:hover{color:var(--accent-ink)}
.scomp-card{display:flex;flex-direction:column;gap:10px;padding:14px 20px 16px;border-top:1px solid var(--line-2);min-width:0}
.scomp-head{display:flex;align-items:flex-start;gap:10px;min-width:0}
.scomp-head .handle{margin-top:1px}
.scomp-tag{padding-top:3px;min-width:22px}
.scomp-name{font-weight:600;font-size:15px;line-height:1.35;min-width:0}
.scomp-meta:empty{display:none}
.scomp-score{display:inline-flex;align-items:center;gap:8px;padding-top:2px;white-space:nowrap}
.scomp-num{font-weight:600;min-width:22px;text-align:right}
.scomp-acts{flex:none}
.scomp-menu{top:30px;min-width:200px}
.scomp-pad{min-width:0}
.scomp-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.scomp-note{white-space:pre-wrap;font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px}
.scomp-ferr{flex-basis:100%}

/* ---- mods/ssub/mod.css */
/* ssub: sub-products, component owners, cross-product dependencies (tokens only) */
.ssub-h{display:flex;align-items:center;margin:0}
.ssub-tgl{display:inline-flex;align-items:center;gap:8px;padding:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.ssub-tgl svg{color:var(--faint);transition:transform .15s ease}
.ssub-tgl[aria-expanded="false"] svg{transform:rotate(-90deg)}
.ssub-tgl:hover{color:var(--accent-ink)}
.ssub-card{display:flex;flex-direction:column;gap:10px;padding:14px 20px 16px;border-top:1px solid var(--line-2);min-width:0}
.ssub-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;min-width:0}
.ssub-name{font-weight:600;font-size:15px}
.ssub-more{margin-left:auto}
.ssub-menu{top:30px;min-width:200px}
.ssub-tbl{border:1px solid var(--line-2);border-radius:10px;background:var(--surface);min-width:0;overflow-x:auto}
.ssub-tbl .tbl th:first-child{border-top-left-radius:10px}
.ssub-tbl .tbl th:last-child{border-top-right-radius:10px}
.ssub-tbl .tbl td{vertical-align:top}
.ssub-spec{font-weight:500}
.ssub-none{color:var(--muted)}
.ssub-mv{padding:2px 6px;margin:-2px -6px;border:1px dashed transparent;border-radius:6px;background:transparent;color:var(--ink);font:inherit;font-weight:600;text-align:left;cursor:text;white-space:nowrap}
.ssub-mv.ssub-none{color:var(--muted);font-weight:500}
.ssub-mv:hover{border-color:var(--accent-line);background:var(--accent-wash)}
.ssub-oin{width:84px}
.ssub-sel{max-width:220px}
.ssub-notes{display:flex;flex-direction:column;gap:6px}
.ssub-ntgl{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;align-self:flex-start}
.ssub-ntgl svg{transition:transform .15s ease}
.ssub-ntgl[aria-expanded="true"] svg{transform:rotate(90deg)}
.ssub-nbody{white-space:pre-wrap;font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px}
/* component owners */
.ssub-og{display:flex;flex-direction:column;gap:2px;padding:10px 20px 12px;border-top:1px solid var(--line-2)}
.ssub-gh{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;min-height:30px;padding:0 6px;margin-left:-6px;border:0;border-radius:7px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.ssub-gh:hover{background:var(--hover)}
.ssub-gh svg{color:var(--faint);transition:transform .15s ease}
.ssub-gh[aria-expanded="false"] svg{transform:rotate(-90deg)}
.ssub-gh2{margin-left:14px;color:var(--ink-2);font-weight:500}
.ssub-om{display:flex;flex-direction:column;gap:0}
.ssub-orow{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:12px;align-items:center;padding:7px 8px 7px 42px;border-top:1px solid var(--line-3);font-size:13.5px}
.ssub-osc{justify-content:flex-end}
.ssub-onote{padding:6px 8px 6px 42px}
/* cross-product dependencies */
.ssub-dg{display:flex;flex-direction:column;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line-2)}
/* add sheet */
.ssub-pg{display:flex;flex-direction:column;gap:2px}
.ssub-pgh{padding:4px 0 2px}
.ssub-grp{padding:0}
.ssub-opt{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:6px 10px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ssub-opt:hover{background:var(--hover)}
.ssub-opt[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.ssub-radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--field-hover);background:var(--surface);flex:none}
.ssub-opt[aria-checked="true"] .ssub-radio{border:5px solid var(--accent)}
.ssub-oid{margin-left:auto}
.ssub-inl{display:inline-block;margin-right:8px;vertical-align:-1px}
/* product KPIs */
.ssub-pk{margin:0 20px 16px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);min-width:0;overflow-x:auto}
.ssub-pk .tbl td{vertical-align:top}
.ssub-pk .tbl th{white-space:nowrap}
.ssub-badges{margin-top:4px}
.ssub-pkmenu{display:inline-block}
.ssub-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

c/td>\n              \u003c/sc-if>\n            \u003c/tr>\n          \u003c/sc-for>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n  \u003c/sc-if>\n\u003c/section>\n\u003c/sc-if>\n\n\u003csection class=\"panel\" aria-labelledby=\"ssub-ow-h\" data-k=\"component-owners\">\n  \u003cdiv class=\"ph\">\n    \u003ch2 id=\"ssub-ow-h\" class=\"h2 ssub-h\">\u003cbutton class=\"ssub-tgl\" type=\"button\" aria-expanded=\"{{ssub.ow.open}}\" onClick=\"{{ssub.ow.toggle}}\">\u003csvg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>Component owners\u003cspan class=\"cnt\">{{ssub.ow.count}}\u003c/span>\u003c/button>\u003c/h2>\n    \u003cspan class=\"sub\">Products this model is a component in\u003c/span>\n  \u003c/div>\n  \u003csc-if value=\"{{ssub.ow.open}}\" hint-placeholder-val=\"{{false}}\">\n    \u003csc-if value=\"{{ssub.ow.empty}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"empty\">{{ssub.ow.emptyText}}\u003c/div>\u003c/sc-if>\n    \u003csc-for list=\"{{ssub.ow.prods}}\" as=\"p\" hint-placeholder-count=\"1\">\n      \u003cdiv class=\"ssub-og\" data-k=\"{{p.key}}\">\n        \u003cbutton class=\"ssub-gh\" type=\"button\" aria-expanded=\"{{p.open}}\" onClick=\"{{p.toggle}}\">\u003csvg aria-hidden=\"true\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\u003cspan class=\"strong\">{{p.name}}\u003c/span>\u003csc-if value=\"{{p.hasDiv}}\" hint-placeholder-val=\"{{true}}\">\u003cspan class=\"tag\">{{p.div}}\u003c/span>\u003c/sc-if>\u003c/button>\n        \u003csc-for list=\"{{p.models}}\" as=\"m\" hint-placeholder-count=\"1\">\n          \u003cdiv class=\"ssub-om\" data-k=\"{{m.key}}\">\n            \u003cbutton class=\"ssub-gh ssub-gh2\" type=\"button\" aria-expanded=\"{{m.open}}\" onClick=\"{{m.toggle}}\">\u003csvg aria-hidden=\"true\" width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>{{m.name}}\u003c/button>\n            \u003csc-if value=\"{{m.loading}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"ssub-onote\">\u003cspan class=\"st t-info\">\u003cspan class=\"spin\" aria-hidden=\"true\">\u003c/span>Loading specifications\u003c/span>\u003c/div>\u003c/sc-if>\n            \u003csc-if value=\"{{m.unreachable}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"ssub-onote\">\u003cspan class=\"st t-warn\" title=\"Couldn’t reach that product’s SPEC bin\">\u003cspan class=\"dot\">\u003c/span>Unreachable\u003c/span>\u003c/div>\u003c/sc-if>\n            \u003csc-if value=\"{{m.none}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"ssub-onote sub\">No specifications yet\u003c/div>\u003c/sc-if>\n            \u003csc-for list=\"{{m.rows}}\" as=\"r\" hint-placeholder-count=\"2\">\n              \u003cdiv class=\"ssub-orow\">\u003cspan class=\"ellip\" title=\"{{r.name}}\">{{r.name}}\u003c/span>\u003cspan class=\"sub num\">{{r.target}}\u003c/span>\u003cspan class=\"{{r.scoreCls}} ssub-osc\">\u003cspan class=\"dot\">\u003c/span>{{r.score}}\u003c/span>\u003c/div>\n            \u003c/sc-for>\n          \u003c/div>\n        \u003c/sc-for>\n      \u003c/div>\n    \u003c/sc-for>\n  \u003c/sc-if>\n\u003c/section>\n\n\u003csc-if value=\"{{ssub.dep.show}}\" hint-placeholder-val=\"{{false}}\">\n\u003csection class=\"panel\" aria-labelledby=\"ssub-dep-h\" data-k=\"cross-product-dependencies\">\n  \u003cdiv class=\"ph\">\n    \u003ch2 id=\"ssub-dep-h\" class=\"h2 ssub-h\">\u003cbutton class=\"ssub-tgl\" type=\"button\" aria-expanded=\"{{ssub.dep.open}}\" onClick=\"{{ssub.dep.toggle}}\">\u003csvg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>Cross-product dependencies\u003cspan class=\"cnt\">{{ssub.dep.count}}\u003c/span>\u003c/button>\u003c/h2>\n    \u003cspan class=\"sub\">{{ssub.dep.sub}}\u003c/span>\n  \u003c/div>\n  \u003csc-for list=\"{{ssub.dep.groups}}\" as=\"g\" hint-placeholder-count=\"1\">\n    \u003cdiv class=\"ssub-dg\" data-k=\"{{g.key}}\">\n      \u003cdiv class=\"row\">\u003cspan class=\"strong\">{{g.name}}\u003c/span>\u003csc-if value=\"{{g.hasDiv}}\" hint-placeholder-val=\"{{true}}\">\u003cspan class=\"tag\">{{g.div}}\u003c/span>\u003c/sc-if>\u003c/div>\n      \u003cdiv class=\"ssub-tbl\">\n        \u003ctable class=\"tbl\">\n          \u003cthead>\u003ctr>\u003cth>Used in\u003c/th>\u003cth>Metric\u003c/th>\u003cth>Current\u003c/th>\u003cth>Target\u003c/th>\u003cth class=\"r\">Score\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003csc-for list=\"{{g.rows}}\" as=\"r\" hint-placeholder-count=\"1\">\n              \u003ctr class=\"hov\" data-k=\"{{r.key}}\">\n                \u003ctd>\u003cdiv class=\"col g2\">\u003cspan>{{r.where}}\u003c/span>\u003cspan class=\"sub\">{{r.model}}\u003c/span>\u003c/div>\u003c/td>\n                \u003ctd>\u003cdiv class=\"row wrap g4\">\u003cspan>{{r.metric}}\u003c/span>\u003cspan class=\"tag\" title=\"Relationship\">{{r.rel}}\u003c/span>\u003c/div>\u003c/td>\n                \u003ctd class=\"num\">\u003cspan class=\"{{r.valCls}}\">{{r.value}}\u003c/span>\u003c/td>\n                \u003ctd class=\"num\">{{r.target}}\u003c/td>\n                \u003ctd class=\"r\">\u003cspan class=\"{{r.scoreCls}}\">\u003cspan class=\"dot\">\u003c/span>{{r.score}}\u003c/span>\u003c/td>\n              \u003c/tr>\n            \u003c/sc-for>\n          \u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n    \u003c/div>\n  \u003c/sc-for>\n\u003c/section>\n\u003c/sc-if>\n\u003c/sc-if>\n\n\u003c!--/src-->\n      \u003c/sc-if>\n      \u003csc-if value=\"{{sh.noModel}}\" hint-placeholder-val=\"{{false}}\">\n        \u003cdiv class=\"panel\">\u003cdiv class=\"empty spc-empty\">\u003cspan>{{sh.emptyText}}\u003c/span>\u003csc-if value=\"{{sh.hasEmptyAct}}\" hint-placeholder-val=\"{{false}}\">\u003cbutton class=\"btn sm\" type=\"button\" onClick=\"{{sh.emptyAct}}\">{{sh.emptyActLabel}}\u003c/button>\u003c/sc-if>\u003ca class=\"btn sm q\" href=\"planning_app.html\">Open Planning\u003c/a>\u003c/div>\u003c/div>\n      \u003c/sc-if>\n    \u003c/main>\n  \u003c/div>\n\u003c/div>\n\n\u003csc-if value=\"{{ui.sheetOpen}}\" hint-placeholder-val=\"{{false}}\">\n  \u003cbutton class=\"sheet-scrim\" type=\"button\" aria-label=\"Close panel\" onClick=\"{{ui.dismissAll}}\">\u003c/button>\n  \u003caside class=\"{{ui.sheetCls}}\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Editor\" onKeyDown=\"{{ui.sheetKey}}\">\n    \u003csc-if value=\"{{sh.settings}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv class=\"sh-head\">\n        \u003cdiv class=\"sh-title\">\u003ch2>Settings\u003c/h2>\u003cspan class=\"sub\">Sync, appearance and this division’s document.\u003c/span>\u003c/div>\n        \u003cbutton class=\"btn ic q\" type=\"button\" aria-label=\"Close\" title=\"Close\" onClick=\"{{ui.closeSheet}}\">\u003csvg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\u003cpath d=\"M6 6l12 12M18 6L6 18\">\u003c/path>\u003c/svg>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"sh-body\">\n\n        \u003csection class=\"sh-sec\" aria-label=\"Broker\">\n          \u003ch3>Broker\u003c/h3>\n          \u003cdiv class=\"hint\">The token lives in this browser only. The division comes from ?division=… or your last session. An SSO embed can pass ?token=…, which is stored and removed from the address.\u003c/div>\n          \u003cspan class=\"{{sh.settings.brokerTone}}\">\u003cspan class=\"dot\">\u003c/span>{{sh.settings.brokerState}}\u003c/span>\n          \u003cdiv class=\"row wrap g12\">\n            \u003clabel class=\"fld grow\">Broker token\u003cinput class=\"in\" type=\"password\" autoComplete=\"off\" placeholder=\"{{sh.settings.tokenPh}}\" value=\"{{sh.settings.tokenDraft}}\" onChange=\"{{sh.settings.onToken}}\" onKeyDown=\"{{sh.settings.onTokenKey}}\">\u003c/label>\n            \u003cdiv class=\"row g4 spc-endrow\">\u003cbutton class=\"btn\" type=\"button\" onClick=\"{{sh.settings.saveToken}}\">Save token\u003c/button>\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"hint\">{{sh.settings.tokenHint}}\u003c/div>\n          \u003cdiv class=\"row wrap g12\">\u003cbutton class=\"btn sm\" type=\"button\" onClick=\"{{sh.settings.reload}}\">Load from the broker\u003c/button>\u003cspan class=\"sub\">Reloads the portfolio and every product division’s specification document. Other editors’ changes also arrive on their own within 25 s.\u003c/span>\u003c/div>\n          \u003cdiv class=\"hint\">Changes save automatically 0.7 s after you stop editing, at most 2.5 s after the first change, one write at a time.\u003c/div>\n        \u003c/section>\n\n\n\n\n\n\n\n\n\n\n\n\n        \u003csection class=\"sh-sec\">\n          \u003ch3>Appearance\u003c/h3>\n          \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Theme\">\u003csc-for list=\"{{sh.settings.themes}}\" as=\"x\" hint-placeholder-count=\"3\">\u003cbutton type=\"button\" aria-pressed=\"{{x.on}}\" onClick=\"{{x.pick}}\">{{x.label}}\u003c/button>\u003c/sc-for>\u003c/div>\n          \u003cdiv class=\"hint\">Theme is saved in this browser only, and shared across the R&amp;D suite. Match system follows your computer’s light or dark setting.\u003c/div>\n        \u003c/section>\n        \u003csection class=\"sh-sec\">\n          \u003ch3>Product families\u003c/h3>\n          \u003cdiv class=\"hint\">Products and models are authored in the Planning app; this list is read-only. Product-level KPIs are shared across a product’s models and can be linked from any specification or component.\u003c/div>\n          \u003csc-if value=\"{{sh.settings.hasFams}}\" hint-placeholder-val=\"{{true}}\">\n            \u003cdiv class=\"tbox\">\u003csc-for list=\"{{sh.settings.fams}}\" as=\"x\" hint-placeholder-count=\"2\">\u003cdiv class=\"li\">\u003cspan class=\"strong grow\">{{x.name}}\u003c/span>\u003cspan class=\"tid\">{{x.id}}\u003c/span>\u003cspan class=\"sub\">{{x.meta}}\u003c/span>\u003c/div>\u003c/sc-for>\u003c/div>\n          \u003c/sc-if>\n          \u003csc-if value=\"{{!sh.settings.hasFams}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"sub\">{{sh.settings.famEmpty}}\u003c/div>\u003c/sc-if>\n        \u003c/section>\n        \u003csection class=\"sh-sec\">\n          \u003ch3>Document\u003c/h3>\n          \u003cdiv class=\"hint\">Specifications are stored on the broker per division. Export to back up; import to load a saved specification document.\u003c/div>\n          \u003cdiv class=\"row g12\">\u003cbutton class=\"btn sm\" type=\"button\" onClick=\"{{sh.settings.exportJson}}\">Export JSON\u003c/button>\u003csc-if value=\"{{!sh.settings.roOn}}\" hint-placeholder-val=\"{{true}}\">\u003cbutton class=\"btn sm\" type=\"button\" onClick=\"{{sh.settings.importJson}}\">Import JSON\u003c/button>\u003c/sc-if>\u003c/div>\n        \u003c/section>\n        \u003csection class=\"sh-sec\" aria-label=\"Hub sign-in\">\n          \u003ch3>Hub sign-in\u003c/h3>\n          \u003clabel class=\"fld\">Signed in as\u003cselect class=\"sel\" value=\"{{sh.settings.hub.value}}\" disabled=\"{{sh.settings.hub.fixed}}\" onChange=\"{{sh.settings.hub.pick}}\">\u003csc-for list=\"{{sh.settings.hub.opts}}\" as=\"o\" hint-placeholder-count=\"5\">\u003coption value=\"{{o.v}}\" label=\"{{o.label}}\">\u003c/option>\u003c/sc-for>\u003c/select>\u003c/label>\n          \u003cdiv class=\"hint\">{{sh.settings.hub.hint}} Product spec doesn’t check the sign-in: anyone with the broker token can edit, as today.\u003c/div>\n        \u003c/section>\n        \u003csection class=\"sh-sec\">\n          \u003ch3>Access\u003c/h3>\n          \u003clabel class=\"check\">\u003cinput class=\"cb\" type=\"checkbox\" checked=\"{{sh.settings.roOn}}\" onChange=\"{{sh.settings.toggleRo}}\">Preview the read-only view\u003c/label>\n          \u003cdiv class=\"hint\">Read-only is what ?readonly gives a viewer: everything shows, nothing can be changed or saved. There is no sign-in; access depends only on the broker token.\u003c/div>\n        \u003c/section>\n        \u003csection class=\"sh-sec\">\n          \u003ch3>Link with parameters\u003c/h3>\n          \u003cdiv class=\"grid2\">\n            \u003clabel class=\"fld\">Division\u003cselect class=\"sel\" value=\"{{sh.settings.linkDiv}}\" onChange=\"{{sh.settings.onLinkDiv}}\">\u003csc-for list=\"{{sh.settings.linkDivs}}\" as=\"o\" hint-placeholder-count=\"3\">\u003coption value=\"{{o.v}}\" label=\"{{o.label}}\">\u003c/option>\u003c/sc-for>\u003c/select>\u003c/label>\n            \u003clabel class=\"fld\">Product\u003cselect class=\"sel\" value=\"{{sh.settings.linkProd}}\" onChange=\"{{sh.settings.onLinkProd}}\">\u003csc-for list=\"{{sh.settings.linkProds}}\" as=\"o\" hint-placeholder-count=\"3\">\u003coption value=\"{{o.v}}\" label=\"{{o.label}}\">\u003c/option>\u003c/sc-for>\u003c/select>\u003c/label>\n            \u003clabel class=\"fld\">Token\u003cinput class=\"in\" autoComplete=\"off\" placeholder=\"Optional\" value=\"{{sh.settings.linkToken}}\" onChange=\"{{sh.settings.onLinkToken}}\">\u003c/label>\n            \u003clabel class=\"check spc-endrow\">\u003cinput class=\"cb\" type=\"checkbox\" checked=\"{{sh.settings.linkRo}}\" onChange=\"{{sh.settings.onLinkRo}}\">Read-only\u003c/label>\n          \u003c/div>\n          \u003cdiv class=\"note spc-url\">\u003cspan class=\"grow spc-code\">{{sh.settings.url}}\u003c/span>\u003c/div>\n          \u003cdiv class=\"row wrap g12\">\u003cbutton class=\"btn sm\" type=\"button\" onClick=\"{{sh.settings.openLink}}\">Open with these parameters\u003c/button>\u003cbutton class=\"btn sm q\" type=\"button\" onClick=\"{{sh.settings.copyUrl}}\">Copy link\u003c/button>\u003c/div>\n          \u003cdiv class=\"hint\">A business division redirects to the first product division. A product outside the division is ignored. A token is stored and removed from the address. There is no model parameter.\u003c/div>\n        \u003c/section>\n        \n\n\n\n\n\n\n\n\n\n        \n        \n\n\n\n      \u003c/div>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{sh.modelSheet}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv class=\"sh-head\">\n        \u003cdiv class=\"sh-title\">\u003ch2>Model spec details\u003c/h2>\u003cspan class=\"sub\">{{sh.modelSheet.name}}\u003c/span>\u003c/div>\n        \u003cbutton class=\"btn ic q\" type=\"button\" aria-label=\"Close\" title=\"Close\" onClick=\"{{sh.modelSheet.cancel}}\">\u003csvg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\u003cpath d=\"M6 6l12 12M18 6L6 18\">\u003c/path>\u003c/svg>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"sh-body\">\n        \u003csection class=\"sh-sec\">\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">Model\u003c/span>\u003cspan>\u003cspan class=\"strong\">{{sh.modelSheet.name}}\u003c/span> \u003cspan class=\"tid\">{{sh.modelSheet.id}}\u003c/span>\u003c/span>\u003cspan class=\"k\">Product family\u003c/span>\u003cspan>{{sh.modelSheet.product}}\u003c/span>\u003c/div>\n          \u003cdiv class=\"hint\">Models and product families are authored in the Planning app.\u003c/div>\n        \u003c/section>\n        \u003csection class=\"sh-sec\">\n          \u003clabel class=\"fld\">Target application\u003cinput class=\"in\" placeholder=\"e.g. Heavy-duty truck range extender\" value=\"{{sh.modelSheet.application}}\" onChange=\"{{sh.modelSheet.onApplication}}\" onKeyDown=\"{{sh.modelSheet.onKey}}\" autoFocus=\"\">\u003c/label>\n          \u003clabel class=\"fld\">Maturity\u003cinput class=\"in\" placeholder=\"e.g. Concept, Prototype, Pilot, Production\" value=\"{{sh.modelSheet.maturity}}\" onChange=\"{{sh.modelSheet.onMaturity}}\" onKeyDown=\"{{sh.modelSheet.onKey}}\">\u003c/label>\n          \u003cdiv class=\"row wrap g4\" role=\"group\" aria-label=\"Maturity suggestions\">\u003cspan class=\"sub\">Suggestions\u003c/span>\u003csc-for list=\"{{sh.modelSheet.suggestions}}\" as=\"x\" hint-placeholder-count=\"5\">\u003cbutton class=\"chip\" type=\"button\" aria-pressed=\"{{x.on}}\" onClick=\"{{x.pick}}\">{{x.label}}\u003c/button>\u003c/sc-for>\u003c/div>\n          \u003clabel class=\"fld\">Notes\u003ctextarea class=\"ta\" rows=\"2\" placeholder=\"Optional\" value=\"{{sh.modelSheet.notes}}\" onChange=\"{{sh.modelSheet.onNotes}}\">\u003c/textarea>\u003c/label>\n        \u003c/section>\n      \u003c/div>\n      \u003cdiv class=\"sh-foot\">\n        \u003cbutton class=\"btn pri\" type=\"button\" onClick=\"{{sh.modelSheet.save}}\">Save spec details\u003c/button>\n        \u003cbutton class=\"btn q\" type=\"button\" onClick=\"{{sh.modelSheet.cancel}}\">Cancel\u003c/button>\n      \u003c/div>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{sh.exportSheet}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv class=\"sh-head\">\n        \u003cbutton class=\"btn ic q\" type=\"button\" aria-label=\"Back\" title=\"Back\" onClick=\"{{ui.closeSheet}}\">\u003csvg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M15 6l-6 6 6 6\">\u003c/path>\u003c/svg>\u003c/button>\n        \u003cdiv class=\"sh-title\">\u003ch2>{{sh.exportSheet.title}}\u003c/h2>\u003cspan class=\"sub\">{{sh.exportSheet.sub}}\u003c/span>\u003c/div>\n        \u003cbutton class=\"btn ic q\" type=\"button\" aria-label=\"Close\" title=\"Close\" onClick=\"{{ui.closeAllSheets}}\">\u003csvg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\u003cpath d=\"M6 6l12 12M18 6L6 18\">\u003c/path>\u003c/svg>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"sh-body\">\n        \u003cdiv class=\"hint\">{{sh.exportSheet.counts}} The file holds no portfolio data: products, models, product KPIs and composition live in the portfolio.\u003c/div>\n        \u003clabel class=\"fld\">product-spec.json\u003ctextarea class=\"ta spc-json\" rows=\"18\" readOnly value=\"{{sh.exportSheet.json}}\">\u003c/textarea>\u003c/label>\n      \u003c/div>\n      \u003cdiv class=\"sh-foot\">\n        \u003cbutton class=\"btn pri\" type=\"button\" onClick=\"{{sh.exportSheet.copy}}\">Copy JSON\u003c/button>\n        \u003cbutton class=\"btn q\" type=\"button\" onClick=\"{{sh.exportSheet.close}}\">Done\u003c/button>\n      \u003c/div>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{sh.importSheet}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv class=\"sh-head\">\n        \u003cbutton class=\"btn ic q\" type=\"button\" aria-label=\"Back\" title=\"Back\" onClick=\"{{ui.closeSheet}}\">\u003csvg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M15 6l-6 6 6 6\">\u003c/path>\u003c/svg>\u003c/button>\n        \u003cdiv class=\"sh-title\">\u003ch2>{{sh.importSheet.title}}\u003c/h2>\u003cspan class=\"sub\">{{sh.importSheet.sub}}\u003c/span>\u003c/div>\n        \u003cbutton class=\"btn ic q\" type=\"button\" aria-label=\"Close\" title=\"Close\" onClick=\"{{ui.closeAllSheets}}\">\u003csvg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\u003cpath d=\"M6 6l12 12M18 6L6 18\">\u003c/path>\u003c/svg>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"sh-body\">\n        \u003cdiv class=\"hint\">Paste a product-spec.json export. Importing replaces the whole division document, then saves it to the broker. Links in older formats are converted and colliding ids repaired, as on load.\u003c/div>\n        \u003clabel class=\"fld\">Document JSON\u003ctextarea class=\"ta spc-json\" rows=\"16\" placeholder=\"{ &quot;keyResults&quot;: [], &quot;stageGates&quot;: [], &quot;kpis&quot;: [], &quot;kpiUpdates&quot;: [], &quot;modelSpec&quot;: {} }\" value=\"{{sh.importSheet.text}}\" onChange=\"{{sh.importSheet.onText}}\">\u003c/textarea>\u003c/label>\n        \u003cdiv class=\"row\">\u003cbutton class=\"btn sm q\" type=\"button\" onClick=\"{{sh.importSheet.loadCurrent}}\">Start from the current document\u003c/button>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"sh-foot\">\n        \u003csc-if value=\"{{ui.hasSheetErr}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"err\" role=\"alert\" style=\"flex-basis: 100%\">{{ui.sheetErr}}\u003c/div>\u003c/sc-if>\n        \u003cbutton class=\"btn pri\" type=\"button\" onClick=\"{{sh.importSheet.run}}\">Import\u003c/button>\n        \u003cbutton class=\"btn q\" type=\"button\" onClick=\"{{sh.importSheet.close}}\">Cancel\u003c/button>\n      \u003c/div>\n    \u003c/sc-if>\n    \u003c!--src:mods/sspec/slot-sheets.html-->\n\u003csc-if value=\"{{sspec.specSheet}}\" hint-placeholder-val=\"{{false}}\">\n  \u003cdiv class=\"sh-head\">\n    \u003cdiv class=\"sh-title\">\u003ch2>{{sspec.specSheet.title}}\u003c/h2>\u003cspan class=\"sub\">{{sspec.specSheet.sub}}\u003c/span>\u003c/div>\n    \u003cbutton class=\"btn ic q\" type=\"button\" aria-label=\"Close\" title=\"Close\" onClick=\"{{sspec.specSheet.cancel}}\">\u003csvg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\u003cpath d=\"M6 6l12 12M18 6L6 18\">\u003c/path>\u003c/svg>\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"sh-body\">\n    \u003csection class=\"sh-sec\">\n      \u003clabel class=\"fld\">Specification\u003cinput class=\"in\" value=\"{{sspec.specSheet.statement}}\" placeholder=\"e.g. Peak power density ≥ 1.2 W/cm²\" onChange=\"{{sspec.specSheet.onStatement}}\" onKeyDown=\"{{sspec.specSheet.onKey}}\" autoFocus=\"\">\u003c/label>\n      \u003cdiv class=\"fld\">\u003cspan class=\"lab\">Tracking type\u003c/span>\n        \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Tracking type\">\u003csc-for list=\"{{sspec.specSheet.tracks}}\" as=\"t\" hint-placeholder-count=\"3\">\u003cbutton type=\"button\" aria-pressed=\"{{t.on}}\" onClick=\"{{t.pick}}\">{{t.label}}\u003c/button>\u003c/sc-for>\u003c/div>\n      \u003c/div>\n    \u003c/section>\n    \u003csc-if value=\"{{sspec.specSheet.isPct}}\" hint-placeholder-val=\"{{true}}\">\n      \u003csection class=\"sh-sec\">\n        \u003clabel class=\"fld\">Progress\u003cdiv class=\"row g12\">\u003cinput type=\"range\" min=\"0\" max=\"100\" step=\"1\" class=\"grow\" aria-label=\"Progress\" value=\"{{sspec.specSheet.progress}}\" onChange=\"{{sspec.specSheet.onProgress}}\">\u003cspan class=\"strong num sspec-pct\">{{sspec.specSheet.progressText}}\u003c/span>\u003c/div>\u003c/label>\n        \u003cdiv class=\"hint\">The specification scores its progress directly.\u003c/div>\n      \u003c/section>\n    \u003c/sc-if>\n    \u003csc-if value=\"{{sspec.specSheet.isKpi}}\" hint-placeholder-val=\"{{false}}\">\n      \u003csection class=\"sh-sec\">\n        \u003ch3>Primary metric\u003c/h3>\n        \u003cdiv class=\"hint\">{{sspec.specSheet.kpiHint}}\u003c/div>\n        \u003csc-if value=\"{{sspec.specSheet.hasLinkedNote}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"note t-info\">{{sspec.specSheet.linkedNote}}\u003c/div>\u003c/sc-if>\n        \u003cdiv class=\"fld\">\u003cspan class=\"lab\">Target type\u003c/span>\n          \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Target type\">\u003csc-for list=\"{{sspec.specSheet.types}}\" as=\"t\" hint-placeholder-count=\"3\">\u003cbutton type=\"button\" aria-pressed=\"{{t.on}}\" onClick=\"{{t.pick}}\">{{t.label}}\u003c/button>\u003c/sc-for>\u003c/div>\n        \u003c/div>\n        \u003csc-if value=\"{{sspec.specSheet.isStat}}\" hint-placeholder-val=\"{{false}}\">\n          \u003cdiv class=\"grid2\">\n            \u003clabel class=\"fld\">Read count\u003cinput class=\"in num\" inputMode=\"numeric\" placeholder=\"e.g. 10\" value=\"{{sspec.specSheet.readCount}}\" onChange=\"{{sspec.specSheet.onReadCount}}\" onKeyDown=\"{{sspec.specSheet.onKey}}\">\u003c/label>\n            \u003clabel class=\"fld\">Statistic\u003cselect class=\"sel\" value=\"{{sspec.specSheet.statistic}}\" onChange=\"{{sspec.specSheet.onStatistic}}\">\u003csc-for list=\"{{sspec.specSheet.stats}}\" as=\"o\" hint-placeholder-count=\"7\">\u003coption value=\"{{o.v}}\" label=\"{{o.label}}\">\u003c/option>\u003c/sc-for>\u003c/select>\u003c/label>\n          \u003c/div>\n        \u003c/sc-if>\n        \u003csc-if value=\"{{sspec.specSheet.notBin}}\" hint-placeholder-val=\"{{true}}\">\n          \u003cdiv class=\"fld\">\u003cspan class=\"lab\">Direction\u003c/span>\n            \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Direction\">\u003csc-for list=\"{{sspec.specSheet.dirs}}\" as=\"t\" hint-placeholder-count=\"3\">\u003cbutton type=\"button\" aria-pressed=\"{{t.on}}\" onClick=\"{{t.pick}}\">{{t.label}}\u003c/button>\u003c/sc-for>\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"grid3\">\n            \u003csc-if value=\"{{sspec.specSheet.showTarget}}\" hint-placeholder-val=\"{{true}}\">\u003clabel class=\"fld\">Target\u003cinput class=\"in num\" inputMode=\"decimal\" placeholder=\"e.g. 1.2\" value=\"{{sspec.specSheet.target}}\" onChange=\"{{sspec.specSheet.onTarget}}\" onKeyDown=\"{{sspec.specSheet.onKey}}\">\u003c/label>\u003c/sc-if>\n            \u003csc-if value=\"{{sspec.specSheet.showRange}}\" hint-placeholder-val=\"{{false}}\">\n              \u003clabel class=\"fld\">Range low\u003cinput class=\"in num\" inputMode=\"decimal\" placeholder=\"e.g. 2\" value=\"{{sspec.specSheet.lo}}\" onChange=\"{{sspec.specSheet.onLo}}\" onKeyDown=\"{{sspec.specSheet.onKey}}\">\u003c/label>\n              \u003clabel class=\"fld\">Range high\u003cinput class=\"in num\" inputMode=\"decimal\" placeholder=\"e.g. 4\" value=\"{{sspec.specSheet.hi}}\" onChange=\"{{sspec.specSheet.onHi}}\" onKeyDown=\"{{sspec.specSheet.onKey}}\">\u003c/label>\n            \u003c/sc-if>\n            \u003clabel class=\"fld\">Unit\u003cinput class=\"in\" placeholder=\"e.g. W/cm²\" value=\"{{sspec.specSheet.unit}}\" onChange=\"{{sspec.specSheet.onUnit}}\" onKeyDown=\"{{sspec.specSheet.onKey}}\">\u003c/label>\n          \u003c/div>\n        \u003c/sc-if>\n        \u003csc-if value=\"{{sspec.specSheet.isBin}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"hint\">A binary metric passes when its reading is 1 (met) and fails at 0 (not met). It has no direction, target or unit.\u003c/div>\u003c/sc-if>\n      \u003c/section>\n    \u003c/sc-if>\n    \u003csc-if value=\"{{sspec.specSheet.isSub}}\" hint-placeholder-val=\"{{false}}\">\n      \u003csection class=\"sh-sec\">\n        \u003cdiv class=\"row\">\u003ch3 class=\"grow\">Sub-specifications\u003c/h3>\u003cspan class=\"sub\">{{sspec.specSheet.subScore}}\u003c/span>\u003cbutton class=\"btn sm\" type=\"button\" onClick=\"{{sspec.specSheet.addSub}}\">\u003csvg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\u003cpath d=\"M12 5v14M5 12h14\">\u003c/path>\u003c/svg>Add sub-spec\u003c/button>\u003c/div>\n        \u003csc-if value=\"{{sspec.specSheet.noSubs}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"sub\">None yet. Add a weighted sub-specification.\u003c/div>\u003c/sc-if>\n        \u003csc-if value=\"{{sspec.specSheet.hasSubs}}\" hint-placeholder-val=\"{{true}}\">\n          \u003cdiv class=\"tbox\">\n            \u003csc-for list=\"{{sspec.specSheet.subs}}\" as=\"x\" hint-placeholder-count=\"2\">\n              \u003cdiv class=\"li\">\u003cdiv class=\"col g2 grow\">\u003cbutton class=\"lnk ink\" type=\"button\" title=\"Edit sub-specification\" aria-label=\"{{x.editLabel}}\" onClick=\"{{x.edit}}\">{{x.name}}\u003c/button>\u003cspan class=\"sub\">{{x.meta}}\u003c/span>\u003c/div>\u003cbutton class=\"btn xs q\" type=\"button\" aria-label=\"{{x.removeLabel}}\" onClick=\"{{x.remove}}\">Remove\u003c/button>\u003c/div>\n            \u003c/sc-for>\n          \u003c/div>\n        \u003c/sc-if>\n        \u003cdiv class=\"hint\">The specification scores the weighted mean of its sub-specifications; one without a score is skipped.\u003c/div>\n      \u003c/section>\n    \u003c/sc-if>\n    \u003csection class=\"sh-sec\">\n      \u003clabel class=\"fld\">Notes\u003ctextarea class=\"ta\" rows=\"3\" placeholder=\"Context, rationale, open questions\" value=\"{{sspec.specSheet.notes}}\" onChange=\"{{sspec.specSheet.onNotes}}\">\u003c/textarea>\u003c/label>\n    \u003c/section>\n  \u003c/div>\n  \u003cdiv class=\"sh-foot\">\n    \u003csc-if value=\"{{ui.hasSheetErr}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"err sspec-ferr\" role=\"alert\">{{ui.sheetErr}}\u003c/div>\u003c/sc-if>\n    \u003cbutton class=\"btn pri\" type=\"button\" onClick=\"{{sspec.specSheet.save}}\">{{sspec.specSheet.saveLabel}}\u003c/button>\n    \u003cbutton class=\"btn q\" type=\"button\" onClick=\"{{sspec.specSheet.cancel}}\">Cancel\u003c/button>\n  \u003c/div>\n\u003c/sc-if>\n\n\u003csc-if value=\"{{sspec.subSheet}}\" hint-placeholder-val=\"{{false}}\">\n  \u003cdiv class=\"sh-head\">\n    \u003cbutton class=\"btn ic q\" type=\"button\" aria-label=\"Back\" title=\"Back\" onClick=\"{{ui.closeSheet}}\">\u003csvg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M15 6l-6 6 6 6\">\u003c/path>\u003c/svg>\u003c/button>\n    \u003cdiv class=\"sh-title\">\u003ch2>{{sspec.subSheet.title}}\u003c/h2>\u003cspan class=\"sub\">{{sspec.subSheet.sub}}\u003c/span>\u003c/div>\n    \u003cbutton class=\"btn ic q\" type=\"button\" aria-label=\"Close\" title=\"Close\" onClick=\"{{sspec.subSheet.cancel}}\">\u003csvg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\u003cpath d=\"M6 6l12 12M18 6L6 18\">\u003c/path>\u003c/svg>\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"sh-body\">\n    \u003csection class=\"sh-sec\">\n      \u003cdiv class=\"fld\">\u003cspan class=\"lab\">Tracking type\u003c/span>\n        \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Sub-spec tracking type\">\u003csc-for list=\"{{sspec.subSheet.types}}\" as=\"t\" hint-placeholder-count=\"4\">\u003cbutton type=\"button\" aria-pressed=\"{{t.on}}\" onClick=\"{{t.pick}}\">{{t.label}}\u003c/button>\u003c/sc-for>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grid2\">\n        \u003clabel class=\"fld\">Sub-spec name\u003cinput class=\"in\" placeholder=\"e.g. Achieve power density\" value=\"{{sspec.subSheet.name}}\" onChange=\"{{sspec.subSheet.onName}}\" onKeyDown=\"{{sspec.subSheet.onKey}}\" autoFocus=\"\">\u003c/label>\n        \u003clabel class=\"fld\">Weight\u003cinput class=\"in num\" inputMode=\"decimal\" placeholder=\"1\" value=\"{{sspec.subSheet.weight}}\" onChange=\"{{sspec.subSheet.onWeight}}\" onKeyDown=\"{{sspec.subSheet.onKey}}\">\u003c/label>\n      \u003c/div>\n    \u003c/section>\n    \u003csc-if value=\"{{sspec.subSheet.isPct}}\" hint-placeholder-val=\"{{true}}\">\n      \u003csection class=\"sh-sec\">\n        \u003clabel class=\"fld\">Initial progress\u003cdiv class=\"row g12\">\u003cinput type=\"range\" min=\"0\" max=\"100\" step=\"1\" class=\"grow\" aria-label=\"Initial progress\" value=\"{{sspec.subSheet.progress}}\" onChange=\"{{sspec.subSheet.onProgress}}\">\u003cspan class=\"strong num sspec-pct\">{{sspec.subSheet.progressText}}\u003c/span>\u003c/div>\u003c/label>\n      \u003c/section>\n    \u003c/sc-if>\n    \u003csc-if value=\"{{sspec.subSheet.showKpi}}\" hint-placeholder-val=\"{{false}}\">\n      \u003csection class=\"sh-sec\">\n        \u003csc-if value=\"{{sspec.subSheet.isStat}}\" hint-placeholder-val=\"{{false}}\">\n          \u003cdiv class=\"grid2\">\n            \u003clabel class=\"fld\">Read count\u003cinput class=\"in num\" inputMode=\"numeric\" placeholder=\"e.g. 10\" value=\"{{sspec.subSheet.readCount}}\" onChange=\"{{sspec.subSheet.onReadCount}}\" onKeyDown=\"{{sspec.subSheet.onKey}}\">\u003c/label>\n            \u003clabel class=\"fld\">Statistic\u003cselect class=\"sel\" value=\"{{sspec.subSheet.statistic}}\" onChange=\"{{sspec.subSheet.onStatistic}}\">\u003csc-for list=\"{{sspec.subSheet.stats}}\" as=\"o\" hint-placeholder-count=\"7\">\u003coption value=\"{{o.v}}\" label=\"{{o.label}}\">\u003c/option>\u003c/sc-for>\u003c/select>\u003c/label>\n          \u003c/div>\n        \u003c/sc-if>\n        \u003cdiv class=\"fld\">\u003cspan class=\"lab\">Direction\u003c/span>\n          \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Sub-spec direction\">\u003csc-for list=\"{{sspec.subSheet.dirs}}\" as=\"t\" hint-placeholder-count=\"2\">\u003cbutton type=\"button\" aria-pressed=\"{{t.on}}\" onClick=\"{{t.pick}}\">{{t.label}}\u003c/button>\u003c/sc-for>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"grid2\">\n          \u003clabel class=\"fld\">Target\u003cinput class=\"in num\" inputMode=\"decimal\" placeholder=\"e.g. 1.2\" value=\"{{sspec.subSheet.target}}\" onChange=\"{{sspec.subSheet.onTarget}}\" onKeyDown=\"{{sspec.subSheet.onKey}}\">\u003c/label>\n          \u003clabel class=\"fld\">Unit\u003cinput class=\"in\" placeholder=\"e.g. W/cm²\" value=\"{{sspec.subSheet.unit}}\" onChange=\"{{sspec.subSheet.onUnit}}\" onKeyDown=\"{{sspec.subSheet.onKey}}\">\u003c/label>\n        \u003c/div>\n        \u003csc-if value=\"{{sspec.subSheet.isDemo}}\" hint-placeholder-val=\"{{false}}\">\n          \u003clabel class=\"fld\">Current measurement\u003cinput class=\"in num\" inputMode=\"decimal\" placeholder=\"Latest measured value\" value=\"{{sspec.subSheet.current}}\" onChange=\"{{sspec.subSheet.onCurrent}}\" onKeyDown=\"{{sspec.subSheet.onKey}}\">\u003c/label>\n        \u003c/sc-if>\n        \u003csc-if value=\"{{sspec.subSheet.isStat}}\" hint-placeholder-val=\"{{false}}\">\n          \u003clabel class=\"fld\">\u003cspan class=\"lab\">Readings\u003cspan class=\"hint\">Newest first. Separate with commas, spaces or new lines.\u003c/span>\u003c/span>\u003ctextarea class=\"ta\" rows=\"2\" placeholder=\"e.g. 1.22, 1.18, 1.25\" value=\"{{sspec.subSheet.readings}}\" onChange=\"{{sspec.subSheet.onReadings}}\">\u003c/textarea>\u003c/label>\n          \u003cdiv class=\"sub\" aria-live=\"polite\">{{sspec.subSheet.preview}}\u003c/div>\n        \u003c/sc-if>\n      \u003c/section>\n    \u003c/sc-if>\n    \u003csc-if value=\"{{sspec.subSheet.isBin}}\" hint-placeholder-val=\"{{false}}\">\n      \u003csection class=\"sh-sec\">\n        \u003cdiv class=\"fld\">\u003cspan class=\"lab\">Status\u003c/span>\n          \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Status\">\u003csc-for list=\"{{sspec.subSheet.mets}}\" as=\"t\" hint-placeholder-count=\"3\">\u003cbutton type=\"button\" aria-pressed=\"{{t.on}}\" onClick=\"{{t.pick}}\">{{t.label}}\u003c/button>\u003c/sc-for>\u003c/div>\n        \u003c/div>\n      \u003c/section>\n    \u003c/sc-if>\n    \u003cdiv class=\"hint\">Saved into the specification you are editing. Nothing is stored until you save the specification.\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"sh-foot\">\n    \u003csc-if value=\"{{ui.hasSheetErr}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"err sspec-ferr\" role=\"ale um\" inputMode=\"decimal\" placeholder=\"e.g. 2\" value=\"{{sspec.metricSheet.lo}}\" onChange=\"{{sspec.metricSheet.onLo}}\" onKeyDown=\"{{sspec.metricSheet.onKey}}\">\u003c/label>\n            \u003clabel class=\"fld\">Range high\u003cinput class=\"in num\" inputMode=\"decimal\" placeholder=\"e.g. 4\" value=\"{{sspec.metricSheet.hi}}\" onChange=\"{{sspec.metricSheet.onHi}}\" onKeyDown=\"{{sspec.metricSheet.onKey}}\">\u003c/label>\n          \u003c/sc-if>\n          \u003clabel class=\"fld\">Unit\u003cinput class=\"in\" placeholder=\"e.g. mg/cm²\" value=\"{{sspec.metricSheet.unit}}\" onChange=\"{{sspec.metricSheet.onUnit}}\" onKeyDown=\"{{sspec.metricSheet.onKey}}\">\u003c/label>\n        \u003c/div>\n      \u003c/sc-if>\n      \u003csc-if value=\"{{sspec.metricSheet.isBin}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"hint\">A binary metric passes when its reading is 1 (met) and fails at 0 (not met).\u003c/div>\u003c/sc-if>\n    \u003c/section>\n    \u003csc-if value=\"{{sspec.metricSheet.isComp}}\" hint-placeholder-val=\"{{false}}\">\n      \u003csection class=\"sh-sec\">\n        \u003clabel class=\"fld\">Gates a product specification (optional)\u003cselect class=\"sel\" value=\"{{sspec.metricSheet.gates}}\" onChange=\"{{sspec.metricSheet.onGates}}\">\u003csc-for list=\"{{sspec.metricSheet.gateOpts}}\" as=\"o\" hint-placeholder-count=\"3\">\u003coption value=\"{{o.v}}\" label=\"{{o.label}}\">\u003c/option>\u003c/sc-for>\u003c/select>\u003c/label>\n        \u003cdiv class=\"hint\">A gating spec measures the same requirement a different way. It shows as a gate on that product specification, keeps its own target and readings, and does not count in that specification’s score.\u003c/div>\n        \u003clabel class=\"fld\">Notes\u003ctextarea class=\"ta\" rows=\"3\" placeholder=\"Context, rationale, open questions\" value=\"{{sspec.metricSheet.notes}}\" onChange=\"{{sspec.metricSheet.onNotes}}\">\u003c/textarea>\u003c/label>\n      \u003c/section>\n    \u003c ass=\"sh-sec\">\n        \u003ch3>Link to a product, specification, or another product’s KPI\u003c/h3>\n        \u003cdiv class=\"col g10\" role=\"radiogroup\" aria-label=\"Metric to link to\">\n          \u003csc-for list=\"{{sspec.linkSheet.groups}}\" as=\"g\" hint-placeholder-count=\"2\">\n            \u003cdiv class=\"col g2\">\n              \u003cdiv class=\"mh sspec-gh\">{{g.label}}\u003c/div>\n              \u003csc-for list=\"{{g.items}}\" as=\"c\" hint-placeholder-count=\"2\">\n                \u003cbutton class=\"{{c.cls}}\" type=\"button\" role=\"radio\" aria-checked=\"{{c.on}}\" onClick=\"{{c.pick}}\">\u003cspan class=\"sspec-radio\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"col g2 grow\">\u003cspan class=\"strong\">{{c.name}}\u003c/span>\u003csc-if value=\"{{c.hasSub}}\" hint-placeholder-val=\"{{true}}\">\u003cspan class=\"sub\">{{c.sub}}\u003c/span>\u003c/sc-if>\u003c/span>\u003csc-if value=\"{{c.defText}}\" hint-placeholder-val=\"{{false}}\">\u003cspan class=\"sub\">{{c.defText}}\u003c/span>\u003c/sc-if>\u003c/button>\n              \u003c/sc-for>\n            \u003c/div>\n          \u003c/sc-for>\n        \u003c/div>\n      \u003c/section>\n      \u003csection class=\"sh-sec\">\n        \u003cdiv class=\"fld\">\u003cspan class=\"lab\">Relationship\u003c/span>\n          \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Relationship\">\u003csc-for list=\"{{sspec.linkSheet.rels}}\" as=\"t\" hint-placeholder-count=\"3\">\u003cbutton type=\"button\" aria-pressed=\"{{t.on}}\" onClick=\"{{t.pick}}\">{{t.label}}\u003c/button>\u003c/sc-for>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"hint\">{{sspec.linkSheet.relHelp}}\u003c/div>\n        \u003csc-if value=\"{{sspec.linkSheet.hasWarn}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"note t-warn\" role=\"status\">{{sspec.linkSheet.warn}}\u003c/div>\u003c/sc-if>\n      \u003c/section>\n    \u003c/sc-if>\n  \u003c/div>\n  \u003cdiv class=\"sh-foot\">\n    \u003csc-if value=\"{{   // ---- partial check-in: the sample-completeness discount ------------------------------------------

  // Before this, two readings of twenty at target scored 100, and since gateAtTarget is score === 100 a

  // sample cannot reach 100. `raw` travels alongside so a screen can say what was withheld ("92 without

  // already claimed "ALL at/above target" — the code only ever checked the ones that had been read.

  // ---- Kanban stage-gating (board = one gate sequence, tiles = parallel workstreams) --------
  // A board's columns are an ordered stage-gate sequence; each tile is one workstream (a "driver")
  // moving through them. Swimlanes carry the rules (max days per column, a deadline) that drive both
  // tile health and — via gateDueDates — where the gates land on a timeline. Gates are binary; no score.

  /* ---- Done-column window: a per-viewer DISPLAY filter --------------------------------------------------
