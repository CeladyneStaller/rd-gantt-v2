<sc-if value="{{$ST.edit}}" hint-placeholder-val="{{true}}">
  <div class="{{$ST.wrapCls}}" onKeyDown="{{$ST.onKey}}">
    <button class="{{$ST.btnCls}}" type="button" aria-haspopup="menu" aria-expanded="{{$ST.open}}" aria-label="{{$ST.aria}}" title="Change status" onClick="{{$ST.toggle}}"><span class="dot"></span>{{$ST.word}}<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
    <sc-if value="{{$ST.open}}" hint-placeholder-val="{{false}}">
      <div class="menu fmea-stm" role="menu" aria-label="{{$ST.menuAria}}">
        <sc-for list="{{$ST.opts}}" as="so" hint-placeholder-count="3"><button class="mi" type="button" role="menuitemradio" aria-checked="{{so.on}}" onClick="{{so.pick}}"><span class="{{so.dotCls}}"></span>{{so.label}}</button></sc-for>
      </div>
    </sc-if>
  </div>
</sc-if>
<sc-if value="{{!$ST.edit}}" hint-placeholder-val="{{false}}"><span class="{{$ST.cls}}"><span class="dot"></span>{{$ST.word}}</span></sc-if>
