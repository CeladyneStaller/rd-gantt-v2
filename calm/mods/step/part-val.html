<span class="col g2"><span class="num"><sc-if value="{{r.noRead}}" hint-placeholder-val="{{false}}"><span class="faint">No read</span></sc-if><sc-if value="{{!r.noRead}}" hint-placeholder-val="{{true}}"><span class="strong">{{r.val}}</span></sc-if></span><sc-if value="{{r.hasChip}}" hint-placeholder-val="{{false}}"><span class="tag" title="{{r.chipTitle}}">{{r.chip}}</span></sc-if><sc-if value="{{r.hasSub}}" hint-placeholder-val="{{false}}"><span class="{{r.subCls}}"><span class="dot"></span>{{r.sub}}</span></sc-if></span>
